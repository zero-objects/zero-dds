# OpenDDS SHMEM-Transport-Variante fuer SHM-self-roundtrip-Bench.
# Discovery bleibt RTPS-Multicast (Cyclone/Fast/RTI-Compat), aber
# Data-Transport ist shmem statt rtps_udp.
[common]
DCPSGlobalTransportConfig=$file
DCPSDefaultDiscovery=rtps_disc

[rtps_discovery/rtps_disc]
use_xtypes=no

[transport/the_shmem_transport]
transport_type=shmem
