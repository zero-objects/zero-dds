# The Dust DDS row of the speed setup (tests/perf/speed/speed.py, row
# `dust`): a Rust app over the dust_dds API, the API Dust DDS is written in
# (rc8-plan.md, arc 3, decision 1, D3). Dust DDS and its IDL code generator
# are pinned here at the newest crates.io release; both are licensed
# Apache-2.0 (the `license` of their Cargo.toml at github.com/s2e-systems/
# dust-dds v0.16.0). Built by tests/perf/speed/build.sh on the speed host,
# not by the workspace (excluded in the root Cargo.toml; `[workspace]`
# below).
[package]
name = "dust-roundtrip"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "dust-roundtrip"
path = "src/main.rs"

[dependencies]
# 0.16.0: the newest release of dust_dds on crates.io (tag v0.16.0 of
# github.com/s2e-systems/dust-dds). Default features: `rtps_udp_transport`
# and `std`.
dust_dds = "=0.16.0"
libc = "0.2"

[build-dependencies]
# The IDL code generator of Dust DDS, released with dust_dds.
dust_dds_gen = "=0.16.0"

[profile.release]
debug = false
