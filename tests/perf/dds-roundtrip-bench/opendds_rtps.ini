# OpenDDS RTPS-Discovery + rtps_udp-Transport — fuer Cross-Vendor.
# OpenDDS default ist InfoRepo-Discovery; fuer Interop mit
# Cyclone/FastDDS/RTI/ZeroDDS MUSS RTPS (DDSI-RTPS 2.x) genutzt
# werden. Via `-DCPSConfigFile opendds_rtps.ini` geladen.
[common]
DCPSGlobalTransportConfig=$file
DCPSDefaultDiscovery=rtps_disc

# use_xtypes=no — OpenDDS verlangt per Default vom Remote-Writer
# vollstaendige XTypes-TypeObject-Information. ZeroDDS' C-FFI-Pfad
# ist byte-orientiert und sendet kein TypeObject (type_identifier=
# None). Mit use_xtypes=no matcht OpenDDS rein ueber Topic+Type-Name
# — wie Cyclone/FastDDS/RTI das mit ZeroDDS auch tun.
[rtps_discovery/rtps_disc]
use_xtypes=no

[transport/the_rtps_transport]
transport_type=rtps_udp
