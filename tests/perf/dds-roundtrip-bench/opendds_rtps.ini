# OpenDDS RTPS discovery + rtps_udp transport — for cross-vendor runs.
# The OpenDDS default is InfoRepo discovery; for interop with
# Cyclone/FastDDS/RTI/ZeroDDS, RTPS (DDSI-RTPS 2.x) MUST be
# used. Loaded via `-DCPSConfigFile opendds_rtps.ini`.
[common]
DCPSGlobalTransportConfig=$file
DCPSDefaultDiscovery=rtps_disc

# use_xtypes=no — by default OpenDDS requires complete XTypes
# TypeObject information from the remote writer. ZeroDDS' C FFI path
# is byte-oriented and sends no TypeObject (type_identifier=
# None). With use_xtypes=no, OpenDDS matches purely on topic + type name
# — as Cyclone/FastDDS/RTI do with ZeroDDS as well.
[rtps_discovery/rtps_disc]
use_xtypes=no

[transport/the_rtps_transport]
transport_type=rtps_udp
