# OpenDDS RTPS-Discovery + rtps_udp-Transport MIT DDS-Security 1.2.
# Wie opendds_rtps.ini, aber `DCPSSecurity=1` aktiviert den
# Security-Plugin-Stack (Auth/AccessControl/Crypto). Die cert/key/
# governance/permissions-Paths kommen via PropertyQosPolicy aus
# apply_security() im App-Code (env-driven). Via
# `-DCPSConfigFile opendds_rtps_sec.ini` geladen.
[common]
DCPSGlobalTransportConfig=$file
DCPSDefaultDiscovery=rtps_disc
DCPSSecurity=1

# use_xtypes=no — gleiche Begruendung wie opendds_rtps.ini: byte-
# orientierte Peers (ZeroDDS-C-FFI) senden kein TypeObject; Match
# laeuft ueber Topic+Type-Name.
[rtps_discovery/rtps_disc]
use_xtypes=no

[transport/the_rtps_transport]
transport_type=rtps_udp
