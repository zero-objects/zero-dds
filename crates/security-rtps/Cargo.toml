[package]
name = "zerodds-security-rtps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Secure submessage wrapper (SEC_PREFIX/SEC_BODY/SEC_POSTFIX) + RTPS header AAD codec (SRTPS_PREFIX/SRTPS_POSTFIX) for DDS-Security 1.1 §7.3.6 + §9.5."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-rtps"
readme = "README.md"
keywords = ["dds", "security", "rtps", "submessage", "aad"]
categories = ["network-programming", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (internal/safety-flag-drift.md)
default = ["std"]
std = []

[dependencies]
zerodds-security = { version = "1.0.0-rc.7", path = "../security" }

[dev-dependencies]
zerodds-security-crypto = { path = "../security-crypto" }
