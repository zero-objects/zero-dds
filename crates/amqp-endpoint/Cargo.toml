[package]
name = "zerodds-amqp-endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDS-AMQP 1.0 bidirectional endpoint stack: SASL + session/link lifecycle + routing + mapping + properties + disposition-mapper wire-up + Annex-A configuration. Sits on top of zerodds-amqp-bridge."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-amqp-endpoint"
readme = "README.md"
keywords = ["dds", "amqp", "amqp-1-0", "endpoint", "no-std"]
categories = ["network-programming", "encoding", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# Spec `zerodds-amqp-bridge-daemon-1.0` §2 — daemon binary.
[[bin]]
name = "zerodds-amqp-bridged"
path = "src/bin/zerodds-amqp-bridged.rs"
required-features = ["std"]

[features]
default = ["std"]
std = [
    "alloc",
    "dep:roxmltree",
    "zerodds-amqp-bridge/std",
    "dep:zerodds-bridge-security",
    "dep:rustls",
    "dep:zerodds-monitor",
    "dep:zerodds-observability-otlp",
    "dep:zerodds-qos",
    "dep:signal-hook",
]
alloc = []
# Cross-vendor interop tests against RabbitMQ/qpid (Spec §10 + §12.3).
cross-vendor-tests = ["std"]

[dependencies]
# Wire codec from the sibling crate.
zerodds-amqp-bridge = { version = "1.0.0-rc.5", path = "../amqp-bridge", default-features = false, features = ["alloc"] }
# SHA-256 for §7.6.1 group-id (KeyHash → hex digest) + SASL SCRAM-SHA-256.
sha2 = { workspace = true }
# SASL SCRAM-SHA-256 (RFC 7677): HMAC + PBKDF2 (built on hmac) + base64 wire.
hmac = { workspace = true }
base64 = { workspace = true }
# Spec §9.2 — XML configuration loader (std-only).
roxmltree = { workspace = true, optional = true }
# Bridge-security substrate (Bridge-Spec §7.1 TLS / §7.2 Auth / §7.3 ACL).
zerodds-bridge-security = { version = "1.0.0-rc.5", path = "../bridge-security", optional = true }
rustls = { workspace = true, optional = true }
# Cross-cutting daemon observability: Prometheus + OTLP + shutdown watcher + QoS mapper.
zerodds-monitor = { version = "1.0.0-rc.5", path = "../monitor", optional = true, default-features = false, features = ["std", "prometheus-server"] }
zerodds-observability-otlp = { version = "1.0.0-rc.5", path = "../observability-otlp", optional = true }
zerodds-qos = { version = "1.0.0-rc.5", path = "../qos", optional = true, default-features = false, features = ["alloc"] }
signal-hook = { workspace = true, optional = true }

[dev-dependencies]
# §9.1 Annex-A IDL roundtrip test: parser verification that the
# `module zerodds::amqp` from the spec parses and that the annex_a.rs
# mirror matches it exactly.
zerodds-idl = { path = "../idl" }
proptest = { workspace = true }
# Self-signed certs + PEM loader for the §7.1 TLS tests in
# `tests/security_e2e.rs`. Per-crate, no workspace edit.
rcgen = "0.13"
rustls-pemfile = { workspace = true }
# Cross-stack interop capstone: drive the AMQP 0.9.1 client (Path B) alongside
# the in-crate AMQP 1.0 client (Path A) against the same RabbitMQ queue.
zerodds-amqp-0-9-1 = { path = "../amqp-0-9-1" }
# SIGTERM-graceful shutdown in DaemonGuard (otherwise SIGKILL → corrupt
# `.profraw` under cargo-llvm-cov). Unix-only via cfg gate.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true, features = ["std"] }
