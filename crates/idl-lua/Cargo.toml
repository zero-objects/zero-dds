[package]
name = "zerodds-idl-lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OMG IDL4 → Lua code generator for ZeroDDS (byte-identical XCDR2 wire via string.pack, pure-Lua endpoint mapping)."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idl-lua"
readme = "README.md"
keywords = ["dds", "idl", "lua", "codegen", "xtypes"]
categories = ["development-tools", "network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zerodds-idl = { version = "1.0.0-rc.7", path = "../idl" }

[dev-dependencies]
# XCDR1 byte-vector oracle for the classic-CDR conformance tests: the generated
# Lua `marshalCdr1` output is asserted byte-for-byte against `zerodds_cdr`'s
# authoritative XCDR1 writer (`BufferWriter` defaults to XCDR1 cap-8) and its
# PL_CDR1 `@mutable` framing (`xcdr1::encode_pl_cdr1_member` / sentinel).
zerodds-cdr = { version = "1.0.0-rc.7", path = "../cdr", default-features = false, features = ["alloc"] }
