[package]
name = "zerodds-transport-tsn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OMG DDS-TSN 1.0 (formal/2024-05-16) — Configuration-Modell PIM (§7.2) + DDSI-RTPS-Ethernet-PSM (Annex A). Pure-Rust no_std+alloc."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-transport-tsn"
readme = "README.md"
keywords = ["dds", "tsn", "ieee802", "ethernet", "real-time"]
categories = ["network-programming", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
# Live AF_PACKET transport (Linux-only): RTPS-direct-on-Ethernet with
# EtherType 0x88B5 (Spec Annex A). Pulls in std + libc + the transport
# trait crate. On non-Linux the module is empty (no build error).
live = ["std", "dep:libc", "zerodds-transport/std", "zerodds-rtps/std"]

[dependencies]
# Read-only XML parser for the §7.3 PSM configuration schema.
roxmltree = { workspace = true }
# Only for feature `live` (AF_PACKET raw-socket syscalls).
libc = { workspace = true, features = ["std"], optional = true }
zerodds-transport = { version = "1.0.0-rc.5", path = "../transport", optional = true }
zerodds-rtps = { version = "1.0.0-rc.5", path = "../rtps", optional = true }

# AF_PACKET-Roundtrip-Latenz-Bench (TSN vs UDP-Baseline) — nur Linux+live.
[[example]]
name = "tsn_latency"
required-features = ["live"]
