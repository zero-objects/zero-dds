[package]
name = "zerodds-idl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OMG IDL 4.2 (ISO/IEC 19516) parser + AST + semantic model for ZeroDDS — lexer, grammar engine, CST→AST builder, spec validators, annotations."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idl"
readme = "README.md"
keywords = ["idl", "parser", "omg", "dds", "xtypes"]
categories = ["parsing", "development-tools"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/safety-flag-drift.md)
# Crate is std-only by design (build-time tool, no embedded use case).
# See crates/idl/src/lib.rs and RFC 0001.
default = ["std"]
std = []

[dependencies]
zerodds-types = { version = "1.0.0-rc.3", path = "../types", default-features = false, features = ["alloc", "std"] }
# Big-integer backing for §7.4.1.4.3 fixed-point arithmetic (62-digit
# intermediate result per spec). i128 (~38 digits) does not cover the
# spec constraint; a custom soft big-decimal would be ~300 LOC and thus
# a deliberate re-implementation of an existing crate.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "parse_hotpaths"
harness = false
