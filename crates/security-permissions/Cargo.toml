[package]
name = "zerodds-security-permissions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDS-Security 1.1 permissions/governance XML parser + access-control plugin (S/MIME-CMS signature via rustls-webpki, topic wildcard match, delegation chain)."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-permissions"
readme = "README.md"
keywords = ["dds", "security", "access-control", "permissions", "governance"]
categories = ["network-programming", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/safety-flag-drift.md)
default = ["std"]
std = []

[dependencies]
zerodds-security = { version = "1.0.0-rc.3", path = "../security" }
# DelegationLink + Sign/Verify + Chain.
zerodds-security-pki = { version = "1.0.0-rc.3", path = "../security-pki" }
# The PSK profile bundle allows creating PSK-Crypto + PSK-Auth + PSK-Access
# together from one caller path.
zerodds-security-crypto = { version = "1.0.0-rc.3", path = "../security-crypto" }
# Read-only XML parser. Apache-2.0 / MIT. Pure Rust, lightweight.
roxmltree = { workspace = true }
# PKCS#7/CMS SignedData parser (RFC 5652). Apache-2.0 / MIT.
cms = { version = "0.2", default-features = false, features = ["std"] }
# X.509 cert struct (RFC 5280) — compatible with `cms` SignerInfo.
x509-cert = { version = "0.2", default-features = false, features = ["pem", "std"] }
# ASN.1-DER for PKCS#7 decoding and re-encoding of the signed attributes.
der = { version = "0.7", default-features = false, features = ["alloc", "oid", "derive"] }
# Algorithm OIDs.
const-oid = { version = "0.9", default-features = false }
# SHA-256 for the message digest in CMS signed-attrs.
sha2 = { workspace = true }
# Signature verify (ECDSA/RSA-PKCS1) — same backend as webpki.
ring = { workspace = true }
# Trust-anchor DER + PEM parser.
rustls-pki-types = { workspace = true }
# Chain validation against the permissions CA.
rustls-webpki = { workspace = true }

[dev-dependencies]
# Test keys for chain-validation tests.
ring = { workspace = true }
