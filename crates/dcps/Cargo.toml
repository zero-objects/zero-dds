[package]
name = "zerodds-dcps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DCPS public API (OMG DDS 1.4 §2.2.2): DomainParticipant, Publisher, Subscriber, Topic, DataWriter, DataReader. Live runtime with SPDP/SEDP/WLP, built-in topics, TypeLookup service, durability backend."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-dcps"
readme = "README.md"
keywords = ["dds", "dcps", "rtps", "publish-subscribe", "middleware"]
categories = ["network-programming", "concurrency"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "metrics"]
std = ["alloc"]
# `alloc` alone (`--no-default-features --features alloc`) is not a real
# no_std tier for this crate: `DataReader`/`DataWriter`/`Subscriber`/
# `Publisher` — this crate's whole public surface — depend on `std`
# (`std::sync::Mutex`, `DcpsRuntime`, `mpsc`, threads) far too deeply for
# a partial `#[cfg(feature = "std")]` split to produce anything usable;
# `docs/architecture/02_architecture.md`'s crate table lists `zerodds-dcps`
# no_std: No, and `04_safety_by_architecture.md` §2 excludes it from the
# Safe-Subset no_std profile by name. `alloc` therefore requires `std` —
# it is kept as a feature name for Cargo.toml compatibility (some
# dependents may already spell `features = ["alloc"]`), not as a
# narrower, independently buildable tier.
alloc = ["std"]
safety = []
# C2(2) — real-time thread scheduling (SCHED_FIFO/SCHED_RR/SCHED_DEADLINE)
# and CPU affinity for the `threads.*` config keys, via `zerodds-rt-linux`
# instead of the crate's own `unsafe` (the whole point of moving it out:
# `zerodds-dcps` stays `#![deny(unsafe_code)]`). Linux-only in effect —
# `zerodds-rt-linux` compiles everywhere and returns `Unsupported` off
# Linux, so this feature is safe to enable on any host. Off by default: a
# config that requests a `threads.*` policy or CPU list without this
# feature makes `DcpsRuntime::start` fail, naming the missing feature,
# rather than silently running untuned. On by default for the daemons where
# an operator plausibly sets `threads.recv_policy=fifo` in production
# (`rmw-zerodds-shim`, `zerodds-c-api`) — see their own Cargo.toml.
rt = ["dep:zerodds-rt-linux"]
# Opt-in: pull the security gate into the UDP hot path
# (DDS-Security 1.2). Without this feature the runtime runs with
# plaintext RTPS.
security = [
    "zerodds-security-runtime",
    "dep:zerodds-security",
    "dep:zerodds-security-logging",
]
# FIPS crypto backend: route the whole DDS-Security stack through aws-lc-rs
# (AWS-LC, FIPS-140-3-validatable) instead of ring. Implies `security`. The
# validated module becomes the *active* crypto on the live RTPS hot path; ring
# stays linked unless a no-default-features cascade is added (D1a limitation).
fips = ["security", "zerodds-security-runtime/fips"]
# wolfCrypt crypto backend (FIPS-ready, DO-178/embedded heritage) via the
# ring-API-compatible shim. Implies `security`. Needs libwolfssl / WOLFSSL_SRC
# (a wolfSSL 5.9.x source tree) at build time.
wolfcrypt = ["security", "zerodds-security-runtime/wolfcrypt"]
# Hook points for zerodds-monitor-1.1 §2.3 (DCPS domain). On by default.
metrics = ["std", "dep:zerodds-monitor"]
# Cross-vendor live interop. Enables FastDDS and Cyclone live
# tests against the lab host. Without this feature the tests stay
# `#[ignore]`'d.
live-interop = []
# ADR-0005: opt-in dual stack — DataWriter::write_flat / DataReader::read_flat.
# Requires the FlatStruct bound; derive(FlatStruct) is ergonomically necessary.
flatdata-integration = ["dep:zerodds-flatdata"]
# docs/specs/zerodds-zero-copy-1.0.md §6: two ZeroDDS participants on one
# host open an SHM channel (a ring each way) when SPDP reports the other,
# and every unicast datagram between them goes through it instead of UDP.
# Switched off at run time by transport.same_host_shm. Default OFF here
# (on in zerodds-c-api) — other vendors on the host stay on UDP.
same-host-shm = ["dep:zerodds-transport-shm"]
# The UDS datagram user transport: transport.user_transport = UDS carries
# the user traffic over Unix datagram sockets instead of UDP. Useful on
# targets without /dev/shm (sandboxed containers); the kernel copies.
same-host-uds = ["dep:zerodds-transport-uds"]
# Live TSN transport (Linux-only): user_transport=Tsn over AF_PACKET
# (RTPS direct on Ethernet, EtherType 0x88B5). Interface/VLAN/PCP via
# the env vars ZERODDS_TSN_IFACE/_VLAN/_PCP.
tsn-live = ["zerodds-transport-tsn/live"]
# 4b.5 (alternative): iceoryx2 slot pool as a same-host backend.
# Provides true zero-copy for `T: FlatStruct` samples; for
# generic bytes it falls back to the POSIX-shm path.
# Requires a userspace iceoryx2 daemon setup.
same-host-iceoryx2 = ["zerodds-flatdata?/iceoryx2-bridge"]
# Cross-vendor same-host zero-copy with Cyclone DDS over the iceoryx C++ (POSH)
# transport: a DataWriter/DataReader, once `enable_cyclone_iox`-ed, publishes /
# subscribes Cyclone-PSMX-shaped chunks via the zerodds-iceoryx-cyclone bridge
# (libiceoryx_binding_c FFI). Linux + iceoryx POSH + iox-roudi only; off by
# default (cross-vendor RTPS interop stays the portable path).
cyclone-iox = ["dep:zerodds-iceoryx-cyclone"]
# Opt-2 (Spec `zerodds-zero-copy-1.0` §9): Linux recvmmsg batch recv.
# Forwards the feature to zerodds-transport-udp; `recv_user_data_loop`
# then uses `recv_batch_linux` instead of the single-recv loop.
# Default off (no automatic Linux-on, so cross-platform CI
# does not silently diverge).
recvmmsg-batch = ["zerodds-transport-udp/recvmmsg-batch"]
# Embargo feature: PDE Reality Inspector hook-up — tap dispatch in the
# hot path. Default OFF: production builds contain no tap code.
# Removed in the public mirror (embargo trigger: PDE release).
inspect = ["dep:zerodds-inspect-endpoint", "zerodds-inspect-endpoint/inspect"]

[dependencies]
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire" }
# The common AST. `builtin_type_set` declares XTypes 1.3 §7.6.5's four
# built-in types into one, rather than into a type representation of its
# own — see that module's docs.
zerodds-ast = { version = "1.0.0-rc.7", path = "../ast" }
zerodds-ast-core = { version = "1.0.0-rc.7", path = "../ast-core" }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../ast-layout" }
zerodds-float128 = { version = "1.0.0-rc.7", path = "../float128", default-features = false }
zerodds-wire-codec = { version = "1.0.0-rc.7", path = "../wire-codec", default-features = false }
zerodds-foundation = { version = "1.0.0-rc.7", path = "../foundation" }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos" }
# C2(6) — the DCPS time source adapter (`crates/dcps/src/time_source.rs`):
# SOURCE_TIMESTAMP / DESTINATION_ORDER=BY_SOURCE_TIMESTAMP / write_w_timestamp
# defaults / the LIFESPAN reception clock can be driven from an OMG Time
# Service 1.1 source instead of the system clock (config `time.source`).
zerodds-time-service = { version = "1.0.0-rc.7", path = "../time-service" }
zerodds-config = { version = "1.0.0-rc.7", path = "../config" }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps" }
zerodds-types = { version = "1.0.0-rc.7", path = "../types" }
zerodds-transport = { version = "1.0.0-rc.7", path = "../transport" }
zerodds-transport-udp = { version = "1.0.0-rc.7", path = "../transport-udp" }
# TCP transport (DDSI-RTPS §9.4 LocatorKind=TCPv4=4). Optionally
# selected via the env var ZERODDS_USER_TRANSPORT=TCPv4.
zerodds-transport-tcp = { version = "1.0.0-rc.7", path = "../transport-tcp" }
# Same-host SHM transport (feature `same-host-shm`). Default off —
# only ZeroDDS peers on the same host benefit; cross-vendor
# interop keeps running over UDP.
zerodds-transport-shm = { version = "1.0.0-rc.7", path = "../transport-shm", optional = true }
# UDS datagram user transport (feature `same-host-uds`).
zerodds-transport-uds = { version = "1.0.0-rc.7", path = "../transport-uds", optional = true }
# Live TSN transport (feature `tsn-live`, Linux-only).
zerodds-transport-tsn = { version = "1.0.0-rc.7", path = "../transport-tsn", optional = true, default-features = false }
zerodds-discovery = { version = "1.0.0-rc.7", path = "../discovery" }
zerodds-sql-filter = { version = "1.0.0-rc.7", path = "../sql-filter" }
zerodds-security-runtime = { version = "1.0.0-rc.7", path = "../security-runtime", optional = true }
# Auth plugin SPI (AuthenticationPlugin/IdentityHandle) — only needed
# for the handshake driver path (enable_security_builtins_with_auth).
zerodds-security = { version = "1.0.0-rc.7", path = "../security", optional = true }
# Property-driven security logger (dds.sec.log.*) wireup.
zerodds-security-logging = { version = "1.0.0-rc.7", path = "../security-logging", optional = true }
zerodds-flatdata = { version = "1.0.0-rc.7", path = "../flatdata", optional = true, default-features = false, features = ["std"] }
zerodds-iceoryx-cyclone = { version = "1.0.0-rc.7", path = "../iceoryx-cyclone", optional = true, features = ["posh"] }
# Inspect endpoint tap hooks (PDE Reality Inspector).
zerodds-inspect-endpoint = { version = "1.0.0-rc.7", path = "../inspect-endpoint", optional = true }
# Hook points for zerodds-monitor-1.1 §2.3. Optional.
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", optional = true, default-features = false, features = ["std"] }
# C2(2) — real-time thread scheduling + CPU affinity (feature `rt`). All
# `unsafe` for `threads.*` now lives in this crate, not here (this crate
# stays `#![deny(unsafe_code)]`). Compiles on every target (macOS/Windows
# return `Unsupported`), so the optional edge itself is not `cfg(unix)`.
zerodds-rt-linux = { version = "1.0.0-rc.7", path = "../rt-linux", optional = true }

[target.'cfg(unix)'.dependencies]
# libc for gethostname(3) in the same-host detection path (all Unixes:
# Linux, macOS, BSD).
libc = { workspace = true }

[dev-dependencies]
# One DDS domain per test process, host-wide (the domain number is the UDP port).
zerodds-test-domains = { path = "../test-domains" }
# DynamicType lookup + TypeInformation builder for
# C4 discovery tests (XTypes 1.3 §7.6.3).
zerodds-types = { path = "../types" }
# Record-capture e2e (type_following_record_e2e): drive the real .zddsrec path.
zerodds-recorder = { path = "../recorder" }
# Wave 4b.3: tempdir for the same_host_shm::tests roundtrip.
tempfile = "3"
# Security-gate construction for security E2E tests needs the
# plugin + governance parser.
zerodds-security-crypto = { path = "../security-crypto" }
zerodds-security-permissions = { path = "../security-permissions" }
# ParticipantGenericMessage builder for stateless/volatile
# wire-demux tests (DDS-Security 1.2).
zerodds-security = { path = "../security" }
# Real PKI auth plugin + cert minting for the FU2 handshake e2e test
# (the runtime replier + in-test initiator stack complete a real
# 3-round handshake over the dispatch path).
zerodds-security-pki = { path = "../security-pki" }
rcgen = "0.13"
rustls-pki-types = { workspace = true }
# Serializes parallel tests that share a host-wide resource. Per-named
# lock granularity (`dcps`, `security_live`) so that not all tests have
# to serialize globally.
#
# `file_locks` is what makes the groups reach: the plain `serial` mutex
# lives inside one process, and cargo runs test binaries in parallel, so
# a group spread over several files only ever serialized the part of it
# that shared a binary. `file_serial` takes the same group names through
# a lock file and therefore holds across the process boundary.
serial_test = { version = "3", features = ["file_locks"] }
# documentation/04-idl/idlc-handbook.md build.rs+include! fence drift check
# (documentation_snippets_compile.rs): parses the same IDL through the exact
# libraries the `zerodds-idlc generate --rust` CLI subcommand wraps, so a
# codegen API change is caught without shelling out to a prebuilt binary.
# The chain the rebuild replaced `zerodds-idl` + `zerodds-idl-rust` with:
# parse, lower, adapt, apply, materialise, render.
zerodds-ast = { path = "../ast" }
zerodds-idl-parse = { path = "../idl-parse" }
zerodds-idl-lower = { path = "../idl-lower" }
# Annex C conformance test (tests/annex_c_idl_conformance.rs): create_type_w_uri and
# create_type_w_document are defined there.
zerodds-xml-compose = { path = "../xml-compose" }
zerodds-lang-rules = { path = "../lang-rules" }
zerodds-lang-cst = { path = "../lang-cst" }
zerodds-lang-render = { path = "../lang-render" }
# shapes_type_idl_agreement.rs: the reflective IDL -> layout plan -> octets
# walk, so `interop::ShapeType`'s hand-written codec can be checked against
# the front end instead of against a second hand-written byte sequence. The
# probe path compiles no generated code, so the test needs no build step.
zerodds-ast-layout = { path = "../ast-layout" }
zerodds-wire-probe = { path = "../wire-probe" }
serde_json = "1"
# documentation/06-operations/monitoring.md metrics::gauge! fragment.
metrics = "0.24"
