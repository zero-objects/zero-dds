[package]
name = "zerodds-dcps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DCPS public API (OMG DDS 1.4 §2.2.2): DomainParticipant, Publisher, Subscriber, Topic, DataWriter, DataReader. Live runtime with SPDP/SEDP/WLP, built-in topics, TypeLookup service, durability backend."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-dcps"
readme = "README.md"
keywords = ["dds", "dcps", "rtps", "publish-subscribe", "middleware"]
categories = ["network-programming", "concurrency"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "metrics"]
std = ["alloc"]
alloc = []
safety = []
# Opt-in: pull the security gate into the UDP hot path
# (DDS-Security 1.2). Without this feature the runtime runs with
# plaintext RTPS.
security = [
    "zerodds-security-runtime",
    "dep:zerodds-security",
    "dep:zerodds-security-logging",
]
# FIPS crypto backend: route the whole DDS-Security stack through aws-lc-rs
# (AWS-LC, FIPS-140-3-validatable) instead of ring. Implies `security`. The
# validated module becomes the *active* crypto on the live RTPS hot path; ring
# stays linked unless a no-default-features cascade is added (D1a limitation).
fips = ["security", "zerodds-security-runtime/fips"]
# wolfCrypt crypto backend (FIPS-ready, DO-178/embedded heritage) via the
# ring-API-compatible shim. Implies `security`. Needs libwolfssl / WOLFSSL_SRC
# (a wolfSSL 5.9.x source tree) at build time.
wolfcrypt = ["security", "zerodds-security-runtime/wolfcrypt"]
# Hook points for zerodds-monitor-1.1 §2.3 (DCPS domain). On by default.
metrics = ["std", "dep:zerodds-monitor"]
# Cross-vendor live interop. Enables FastDDS and Cyclone live
# tests against the lab host. Without this feature the tests stay
# `#[ignore]`'d.
live-interop = []
# ADR-0005: opt-in dual stack — DataWriter::write_flat / DataReader::read_flat.
# Requires the FlatStruct bound; derive(FlatStruct) is ergonomically necessary.
flatdata-integration = ["dep:zerodds-flatdata"]
# Wave 4b of the zero-copy roadmap (docs/specs/zerodds-zero-copy-1.0.md
# §6 wave 3): wire the same-host SHM transport into the DCPS hot path.
# When the feature is enabled, the SEDP match hook tries to establish
# a PosixShmTransport for each same-host pair (owner = reader
# side, consumer = writer side) and, on a successful bind, routes
# the user datagrams over SHM instead of UDP. Default OFF — cross-vendor
# interop stays UDP-only.
same-host-shm = ["dep:zerodds-transport-shm"]
# 4b.5 (Spec `zerodds-zero-copy-1.0` §6 wave 3 sub-sprints):
# an alternative same-host backend via UDS datagram instead of POSIX shm.
# Useful on targets without /dev/shm (sandboxed containers) or when
# the 1:N nature of UDS datagram is preferred (multiple writers
# per reader endpoint). Eliminates IP-stack overhead, but is
# **not** true zero-copy (a kernel copy remains).
# Mutually exclusive with `same-host-shm`; if both are active, SHM wins.
same-host-uds = ["dep:zerodds-transport-uds"]
# Live TSN transport (Linux-only): user_transport=Tsn over AF_PACKET
# (RTPS direct on Ethernet, EtherType 0x88B5). Interface/VLAN/PCP via
# the env vars ZERODDS_TSN_IFACE/_VLAN/_PCP.
tsn-live = ["zerodds-transport-tsn/live"]
# 4b.5 (alternative): iceoryx2 slot pool as a same-host backend.
# Provides true zero-copy for `T: FlatStruct` samples; for
# generic bytes it falls back to the POSIX-shm path.
# Requires a userspace iceoryx2 daemon setup.
same-host-iceoryx2 = ["zerodds-flatdata?/iceoryx2-bridge"]
# Cross-vendor same-host zero-copy with Cyclone DDS over the iceoryx C++ (POSH)
# transport: a DataWriter/DataReader, once `enable_cyclone_iox`-ed, publishes /
# subscribes Cyclone-PSMX-shaped chunks via the zerodds-iceoryx-cyclone bridge
# (libiceoryx_binding_c FFI). Linux + iceoryx POSH + iox-roudi only; off by
# default (cross-vendor RTPS interop stays the portable path).
cyclone-iox = ["dep:zerodds-iceoryx-cyclone"]
# Opt-2 (Spec `zerodds-zero-copy-1.0` §9): Linux recvmmsg batch recv.
# Forwards the feature to zerodds-transport-udp; `recv_user_data_loop`
# then uses `recv_batch_linux` instead of the single-recv loop.
# Default off (no automatic Linux-on, so cross-platform CI
# does not silently diverge).
recvmmsg-batch = ["zerodds-transport-udp/recvmmsg-batch"]
# Embargo feature: PDE Reality Inspector hook-up — tap dispatch in the
# hot path. Default OFF: production builds contain no tap code.
# Removed in the public mirror (embargo trigger: PDE release).
inspect = ["dep:zerodds-inspect-endpoint", "zerodds-inspect-endpoint/inspect"]

[dependencies]
zerodds-cdr = { version = "1.0.0-rc.4", path = "../cdr" }
zerodds-foundation = { version = "1.0.0-rc.4", path = "../foundation" }
zerodds-qos = { version = "1.0.0-rc.4", path = "../qos" }
zerodds-rtps = { version = "1.0.0-rc.4", path = "../rtps" }
zerodds-types = { version = "1.0.0-rc.4", path = "../types" }
zerodds-transport = { version = "1.0.0-rc.4", path = "../transport" }
zerodds-transport-udp = { version = "1.0.0-rc.4", path = "../transport-udp" }
# TCP transport (DDSI-RTPS §9.4 LocatorKind=TCPv4=4). Optionally
# selected via the env var ZERODDS_USER_TRANSPORT=TCPv4.
zerodds-transport-tcp = { version = "1.0.0-rc.4", path = "../transport-tcp" }
# Same-host SHM transport (feature `same-host-shm`). Default off —
# only ZeroDDS peers on the same host benefit; cross-vendor
# interop keeps running over UDP.
zerodds-transport-shm = { version = "1.0.0-rc.4", path = "../transport-shm", optional = true }
# 4b.5 — same-host UDS datagram transport (feature `same-host-uds`).
zerodds-transport-uds = { version = "1.0.0-rc.4", path = "../transport-uds", optional = true }
# Live TSN transport (feature `tsn-live`, Linux-only).
zerodds-transport-tsn = { version = "1.0.0-rc.4", path = "../transport-tsn", optional = true, default-features = false }
zerodds-discovery = { version = "1.0.0-rc.4", path = "../discovery" }
zerodds-sql-filter = { version = "1.0.0-rc.4", path = "../sql-filter" }
zerodds-security-runtime = { version = "1.0.0-rc.4", path = "../security-runtime", optional = true }
# Auth plugin SPI (AuthenticationPlugin/IdentityHandle) — only needed
# for the handshake driver path (enable_security_builtins_with_auth).
zerodds-security = { version = "1.0.0-rc.4", path = "../security", optional = true }
# Property-driven security logger (dds.sec.log.*) wireup.
zerodds-security-logging = { version = "1.0.0-rc.4", path = "../security-logging", optional = true }
zerodds-flatdata = { version = "1.0.0-rc.4", path = "../flatdata", optional = true, default-features = false, features = ["std"] }
zerodds-iceoryx-cyclone = { version = "1.0.0-rc.4", path = "../iceoryx-cyclone", optional = true, features = ["posh"] }
# Inspect endpoint tap hooks (PDE Reality Inspector).
zerodds-inspect-endpoint = { version = "1.0.0-rc.4", path = "../inspect-endpoint", optional = true }
# Hook points for zerodds-monitor-1.1 §2.3. Optional.
zerodds-monitor = { version = "1.0.0-rc.4", path = "../monitor", optional = true, default-features = false, features = ["std"] }

# Linux-only: libc for pthread_setschedparam + sched_setaffinity in
# `apply_thread_tuning` (Sprint D.5d lever C — RT pinning + priority).
# No effect on macOS/Windows; the hooks are no-ops there.
[target.'cfg(unix)'.dependencies]
# libc for gethostname(3) in the same-host detection path (all Unixes:
# Linux, macOS, BSD). On Linux additionally for apply_thread_tuning
# (Sprint D.5d lever C — RT pinning + priority). On macOS the
# thread-tuning hooks are no-ops.
libc = { workspace = true }

[dev-dependencies]
# DynamicType lookup + TypeInformation builder for
# C4 discovery tests (XTypes 1.3 §7.6.3).
zerodds-types = { path = "../types" }
# Record-capture e2e (type_following_record_e2e): drive the real .zddsrec path.
zerodds-recorder = { path = "../recorder" }
# Wave 4b.3: tempdir for the same_host_shm::tests roundtrip.
tempfile = "3"
# Security-gate construction for security E2E tests needs the
# plugin + governance parser.
zerodds-security-crypto = { path = "../security-crypto" }
zerodds-security-permissions = { path = "../security-permissions" }
# ParticipantGenericMessage builder for stateless/volatile
# wire-demux tests (DDS-Security 1.2).
zerodds-security = { path = "../security" }
# Real PKI auth plugin + cert minting for the FU2 handshake e2e test
# (the runtime replier + in-test initiator stack complete a real
# 3-round handshake over the dispatch path).
zerodds-security-pki = { path = "../security-pki" }
rcgen = "0.13"
rustls-pki-types = { workspace = true }
# Serializes parallel tests that share UDP multicast ports
# (CI runner cores ≥ test threads → port-collision race). Per-named
# lock granularity (e.g. "dcps_udp_match") so that not all tests
# have to serialize globally.
serial_test = "3"
