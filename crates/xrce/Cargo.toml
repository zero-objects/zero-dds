[package]
name = "zerodds-xrce"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDS-XRCE Wire-Codec (16 Submessages, MessageHeader, RFC-1982, UDP-Mapping)"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-xrce"
readme = "README.md"
keywords = ["dds", "xrce", "embedded", "iot"]
categories = ["embedded", "network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
# `zerodds-xml` needs roxmltree (std-only); we split it out as
# its own `xml-config` feature, which is implied by `std` but
# is NOT active under pure `alloc`. This way the XRCE wire
# codec builds on thumbv7em-none-eabihf without an XML parser.
std = ["alloc", "xml-config", "zerodds-xml/std", "dep:socket2"]
alloc = []
xml-config = ["alloc", "dep:zerodds-xml"]
safety = []
# Productive DTLS 1.2 for the UDP transport of §11.2 (DDS-XRCE 1.0 leaves the
# security of a transport to DTLS or a VPN, §11.2). Opt-in:
# pulls webrtc-dtls (pure-Rust, async) + tokio + a crypto provider — std-only,
# NOT in the no_std wire-codec build. Mirrors crates/coap-bridge §7.1.
dtls = ["std", "dep:webrtc-dtls", "dep:webrtc-util", "dep:tokio", "dep:pem", "dep:rustls"]
# Productive TLS 1.2/1.3 for the TCP transport of §11.3 (TLS or a VPN, §11.3).
# Opt-in: rustls over a std TcpStream + a self-signed cert (rcgen).
tls = ["std", "dep:rustls", "dep:rustls-pki-types", "dep:rcgen"]

[dependencies]
# C6.2.C — XRCE XML configuration (Spec §7.7.3 + §9.3). Re-use of the
# DDS-XML-1.0 loader from `crates/xml/` for type/QoS-profile resolution
# (DDS-XML module I/J). Optional, because roxmltree (transitively via zerodds-xml)
# needs `extern crate std` and does not compile in the
# thumbv7em-none-eabihf build.
zerodds-xml = { version = "1.0.0-rc.7", path = "../xml", default-features = false, features = ["alloc"], optional = true }
# MD5 of a REPRESENTATION_BY_REFERENCE string: the ObjectIdPrefix of the
# objects a configuration file defines (DDS-XRCE 1.0 §9.3).
md5 = { package = "md-5", version = "0.11", default-features = false }
# DTLS 1.2 (feature `dtls`) — pure-Rust DTLS over UDP. webrtc-util must match
# webrtc-dtls 0.12's `^0.11` requirement (same pin as crates/coap-bridge).
webrtc-dtls = { version = "0.12", optional = true, features = ["pem"] }
# PEM parsing of the certificate and key files, and the root store the client
# checks the agent's certificate against (both are in webrtc-dtls's tree).
pem = { version = "3", optional = true }
webrtc-util = { version = "0.11", optional = true, default-features = false, features = ["conn"] }
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time"] }
# Discovery binds its port shared (SO_REUSEADDR/SO_REUSEPORT): 7400 is also
# the SPDP multicast port of DDS domain 0.
socket2 = { workspace = true, optional = true }
# TLS 1.2/1.3 (feature `tls`) — rustls over a std TcpStream + self-signed cert.
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "decode_hotpaths"
harness = false
