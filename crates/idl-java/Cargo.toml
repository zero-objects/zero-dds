[package]
name = "zerodds-idl-java"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idl-java"
readme = "README.md"
keywords = ["dds", "idl", "codegen", "java", "java-psm"]
categories = ["development-tools"]
authors.workspace = true
description = "OMG IDL4 → Java 17 code generator (idl4-java-1.0 + DDS Java PSM) for ZeroDDS."
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (internal/safety-flag-drift.md)
default = ["std"]
std = []

[dependencies]
zerodds-idl = { version = "1.0.0-rc.6", path = "../idl" }
zerodds-rpc = { version = "1.0.0-rc.6", path = "../rpc" }

[dev-dependencies]
insta = { workspace = true }
tempfile = "3"

