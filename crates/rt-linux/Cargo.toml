[package]
name = "zerodds-rt-linux"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Linux real-time scheduling adapter for ZeroDDS: sched_setattr (FIFO/RR/DEADLINE) + sched_setaffinity (CPU pinning) + current_scheduler inspect."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-rt-linux"
readme = "README.md"
keywords = ["dds", "real-time", "linux", "scheduler", "ffi"]
categories = ["os::linux-apis"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# The API returns `std::io::Result`; the crate needs `std` whatever the
# features say. `std` stays so that a manifest naming it keeps resolving.
default = ["std"]
std = []

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, features = ["std"] }
