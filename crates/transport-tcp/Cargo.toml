[package]
name = "zerodds-transport-tcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ZeroDDS TCP transport: RTPS messages over TCP with a length-prefix framing, the ZeroDDS handshake and a connection pool (ZeroDDS TCP Transport 1.0)."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-transport-tcp"
readme = "README.md"
keywords = ["dds", "rtps", "tcp", "transport"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps" }
zerodds-transport = { version = "1.0.0-rc.7", path = "../transport" }

# TCP keepalive on accepted connections (§3.6), and on Unix `recv` with
# flags on a borrowed stream.
socket2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The look at an outgoing connection before each write, in one syscall:
# `recv` through socket2 with the flags `MSG_PEEK` and `MSG_DONTWAIT`
# from libc.
libc = { workspace = true }

# Windows: `WSAPoll` before a read of an accepted connection, so that the
# read sees `close` (`UntilClosed`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Networking_WinSock"] }

[dev-dependencies]
zerodds-rtps = { path = "../rtps" }
zerodds-transport = { path = "../transport" }
