[package]
name = "zerodds-zenoh-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bidirectional bridge between ZeroDDS DCPS and Eclipse Zenoh: topic mapping + QoS translation + optional live runtime via the `zenoh-runtime` feature."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-zenoh-bridge"
readme = "README.md"
keywords = ["dds", "zenoh", "bridge", "iot", "pub-sub"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[features]
# `daemon` is in `default` so a plain `cargo build --release --bin
# zerodds-zenoh-bridged` / `cargo build --workspace` produces the binary
# without extra flags, matching every other `*-bridged` daemon in this
# workspace (`crates/coap-bridge`, `crates/mqtt-bridge`,
# `crates/websocket-bridge`) — the packaging scripts
# (`packaging/linux/appimage/build.sh`, the rpm/deb specs) build it that way.
# The pure-Rust topic-mapping logic (`mapping.rs`) still builds and tests
# with no external dep at all via `--no-default-features --features std`.
default = ["std", "daemon"]
std = ["zerodds-qos/std"]
zenoh-runtime = [
    "std",
    "dep:zenoh",
    "dep:zenoh-ext",
    "dep:tokio",
    "dep:thiserror",
    "dep:zerodds-dcps",
    "dep:zerodds-rtps",
    "dep:zerodds-types",
]
# `daemon` enables the `zerodds-zenoh-bridged` binary + DDS-topic auto-discovery.
daemon = [
    "zenoh-runtime",
    "dep:zerodds-config",
    "dep:zerodds-monitor",
    "dep:zerodds-observability-otlp",
    "dep:signal-hook",
]

[dependencies]
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos", default-features = false, features = ["alloc"] }

# Optional, active only with zenoh-runtime.
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps", optional = true, default-features = false, features = ["std"] }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps", optional = true, default-features = false, features = ["std"] }
zerodds-types = { version = "1.0.0-rc.7", path = "../types", optional = true, default-features = false, features = ["alloc"] }
zerodds-config = { version = "1.0.0-rc.7", path = "../config", optional = true }
# Cross-cutting daemon observability: Prometheus + OTLP + graceful shutdown,
# same substrate `coap-bridge`/`mqtt-bridge`/`websocket-bridge` use.
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", optional = true, default-features = false, features = ["std", "prometheus-server"] }
zerodds-observability-otlp = { version = "1.0.0-rc.7", path = "../observability-otlp", optional = true }
signal-hook = { workspace = true, optional = true }
# The lz4_flex advisory reaches us only through zenoh-transport's
# `transport_compression` (decompress_into). It is unfixed upstream:
# zenoh-transport pins `lz4_flex ^0.10`, below the fixed 0.11.6/0.12.1, and it
# affects the whole zenoh/ROS 2 ecosystem, not us specifically. We keep zenoh's
# default features (compression included) and track the upstream bump rather
# than unilaterally disabling functionality; the advisory stays open until then.
# `zenoh-ext` (PublicationCache / FetchingSubscriber, the TRANSIENT_LOCAL /
# late-joiner mechanics `zenoh-plugin-dds` itself uses) adds no dependency
# outside the `zenoh` tree already pulled in — same workspace, same release.
zenoh = { version = "1", optional = true }
# `unstable`: PublicationCache/FetchingSubscriber (see above) live behind it.
zenoh-ext = { version = "1", optional = true, features = ["unstable"] }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
thiserror = { version = "2", optional = true }

[dev-dependencies]
zerodds-dcps = { path = "../dcps" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# The keyed-topic e2e test builds a small CompleteTypeObject in-process
# (instead of shipping a binary fixture) via the reflective IDL -> AST path,
# the same probe crates/dcps/src/serialized_type.rs's own test uses.
zerodds-wire-probe = { path = "../wire-probe" }
zenoh-ext = { version = "1", features = ["unstable"] }
zerodds-test-domains = { path = "../test-domains" }
zerodds-test-vendor-reader = { path = "../test-vendor-reader" }

[[bin]]
name = "zerodds-zenoh-bridged"
path = "src/bin/zerodds-zenoh-bridged.rs"
required-features = ["daemon"]
