[package]
name = "zerodds-zenoh-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bidirectional bridge between ZeroDDS DCPS and Eclipse Zenoh: topic mapping + QoS translation + optional live runtime via the `zenoh-runtime` feature."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-zenoh-bridge"
readme = "README.md"
keywords = ["dds", "zenoh", "bridge", "iot", "pub-sub"]
categories = ["network-programming", "no-std"]
publish = true

[lints]
workspace = true

[features]
# Default without zenoh — the crate builds as a skeleton (topic map, mapping logic)
# for workspace CI without an external dep. The real Zenoh bridge path with
# `--features zenoh-runtime` (pulls zerodds-dcps + zenoh + tokio).
default = ["std"]
std = []
zenoh-runtime = [
    "dep:zenoh",
    "dep:tokio",
    "dep:thiserror",
    "dep:zerodds-dcps",
]

[dependencies]
zerodds-qos = { version = "1.0.0-rc.5", path = "../qos" }

# Optional, active only with zenoh-runtime.
zerodds-dcps = { version = "1.0.0-rc.5", path = "../dcps", optional = true }
zenoh = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }
thiserror = { version = "2", optional = true }

[dev-dependencies]
zerodds-dcps = { path = "../dcps" }
