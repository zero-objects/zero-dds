[package]
name = "rmw-zerodds-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ROS 2 rmw_zerodds shim — C-FFI wrapper around zerodds-ros2-rmw + zerodds-c-api"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/rmw-zerodds-shim"
readme = "README.md"
keywords = ["dds", "ros2", "rmw", "shim"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
name = "rmw_zerodds"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

# Spec `zerodds-ros2-bridge-1.0` §2 — diagnostics CLI (no daemon).
[[bin]]
name = "zerodds-ros2-shim"
path = "src/bin/zerodds-ros2-shim.rs"

[dependencies]
zerodds-ros2-rmw = { version = "1.0.0-rc.7", path = "../ros2-rmw" }
# Note: zerodds-c-api exports via `[lib] name = "zerodds"`.
# The rmw shim uses `use zerodds::*` (`ZeroDdsRuntime`, `ZeroDdsWriter`,
# `zerodds_runtime_create`, `zerodds_writer_*`, `zerodds_reader_*`) >40 times,
# so the crate is referenced productively despite the `name` drift.
zerodds-c-api = { version = "1.0.0-rc.7", path = "../zerodds-c-api" }
# The layered configuration of the diagnostics CLI (--config, --set,
# --check-config) and the runtime report of `--check-config`.
zerodds-config = { version = "1.0.0-rc.7", path = "../config" }
# Content filters of ROS subscriptions (rmw_subscription_set_content_filter).
zerodds-sql-filter = { version = "1.0.0-rc.7", path = "../sql-filter" }
# C2(2): `rt` on by default — ROS 2 real-time control loops are the
# canonical `threads.recv_policy=fifo` deployment (Sprint D.5d lever C was
# built for exactly this). Also enabled transitively through
# `zerodds-c-api`'s own default `rt`; named explicitly here too so this
# direct edge does not silently depend on that crate's default staying on.
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps", default-features = false, features = ["std", "rt"] }
# Service endpoints: sample identities and vendor ids (`src/services.rs`).
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps", default-features = false, features = ["std"] }
# `dynamic` (on by default; named explicitly so the ROS 2 Jazzy dynamic
# typesupport in `src/dynamic.rs` does not silently depend on that
# default staying on): DynamicType/DynamicData, the reflective half
# `rosidl_dynamic_typesupport_zerodds` is built on.
zerodds-types = { version = "1.0.0-rc.7", path = "../types", default-features = false, features = ["alloc", "dynamic"] }
# The AST `src/dynamic.rs` walks directly to graft one builder's type
# graph into another's (see that module's doc) — the same low-level API
# `zerodds-types::dynamic::builder` itself is written against.
zerodds-ast = { version = "1.0.0-rc.7", path = "../ast", default-features = false }
zerodds-ast-core = { version = "1.0.0-rc.7", path = "../ast-core", default-features = false }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../ast-layout" }
# The plan executor: `encode`/`decode`/`default_of_type` for
# `DynamicData`, the same crate `zerodds-dcps`'s own `SerializedTypeSupport`
# runs a `DynamicData` through.
zerodds-wire-codec = { version = "1.0.0-rc.7", path = "../wire-codec", default-features = false }
# `long double`/`float128`: DynamicData::LongDouble's own type, and the
# x87-extended / true-binary128 host bridges `src/dynamic.rs` uses for
# `dynamic_data_{get,set,insert}_float128_value`.
zerodds-float128 = { version = "1.0.0-rc.7", path = "../float128", default-features = false }
# REP-2009 type hash via SHA-256.
sha2 = { workspace = true, features = ["std"] }
# Diagnostics-CLI observability: catalog/metrics/OTLP for `catalog`/`metrics`/
# `selftest` subcommands (the CLI is exempt from the SIGTERM watcher §9.2).
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", default-features = false, features = ["std"] }
zerodds-observability-otlp = { version = "1.0.0-rc.7", path = "../observability-otlp" }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos", default-features = false, features = ["alloc"] }
# C2(6) — the opt-in `ros2.spatial_bridge` content-translation mode
# (`src/spatial_bridge.rs`): SpatialDDS <-> ROS 2 message conversion + naming.
zerodds-spatial-dds = { version = "1.0.0-rc.7", path = "../spatial-dds" }
zerodds-spatial-ros2 = { version = "1.0.0-rc.7", path = "../spatial-ros2" }
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire" }
zerodds-foundation = { version = "1.0.0-rc.7", path = "../foundation" }

[dev-dependencies]
# One DDS domain per test process, host-wide — the spatial_bridge in-process
# e2e test's own participant.
zerodds-test-domains = { path = "../test-domains" }
# `src/dynamic.rs`'s graft test measures the composed type's wire bytes
# against the identical declaration written in IDL, resolved, and
# encoded directly with zerodds-wire-codec — the independent reference a
# type built only through this crate's own graft path cannot contradict
# on its own.
zerodds-idl-parse = { version = "1.0.0-rc.7", path = "../idl-parse" }
zerodds-idl-lower = { version = "1.0.0-rc.7", path = "../idl-lower" }

[features]
default = ["flatdata-loan"]
# C7 "secure by default" ROS: build with `--features security` so
# rmw_zerodds_init loads an SROS2 enclave from `ZERODDS_SECURITY_DIR`
# (pulls the DDS-Security crypto stack via zerodds-c-api/security). Default
# rmw builds stay lean (plain participant).
security = ["zerodds-c-api/security"]
# Same-host zero-copy message loaning (delivery mode `RawSameHost`,
# zerodds-delivery-modes-1.0): the bridge calls the c-api SHM loan surface
# (`zerodds_writer_enable_shm_loan` / `_loan_message` / `_commit_loan`,
# `zerodds_reader_enable_shm` / `_take_shm` / `_release_shm`). On by default;
# without it the loan path stays `Portable`-only (serialized, interop-safe).
flatdata-loan = ["zerodds-c-api/flatdata-loan"]
# Cross-stack same-host delivery via Eclipse iceoryx2 (delivery mode `Iceoryx`,
# §3.3). Pulls the iceoryx2 runtime through zerodds-c-api. Off by default
# (heavy dep + needs the iceoryx2 runtime); `ZERODDS_DELIVERY_MODE=iceoryx`
# falls back to `Portable` when the shim is built without it.
delivery-iceoryx = ["flatdata-loan", "zerodds-c-api/delivery-iceoryx"]

[build-dependencies]
cbindgen = "0.29"
