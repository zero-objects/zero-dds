language = "C"
include_guard = "RMW_ZERODDS_H_"
header = """/* SPDX-License-Identifier: Apache-2.0
 * rmw_zerodds — ROS 2 RMW implementation backed by ZeroDDS.
 * Generated by cbindgen — do not edit. */"""
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
includes = []
documentation = true
documentation_style = "doxy"
cpp_compat = true

[parse]
parse_deps = false

[export]
prefix = "rmw_zerodds_"
include = []
exclude = []
item_types = ["functions", "structs", "enums", "typedefs", "opaque"]

[fn]
prefix = ""
