[package]
name = "zerodds-transport-udp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "UDP/IP-PSM für ZeroDDS — DDSI-RTPS 2.5 §9.6.1: UDPv4 Unicast + Multicast (Discovery), SO_REUSE, Multicast-TTL."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-transport-udp"
readme = "README.md"
keywords = ["dds", "rtps", "udp", "multicast", "transport"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
# PDE Reality Inspector Hook-Up — Tap-Dispatch im UDP-Send-Pfad.
# Default OFF (R-034).
inspect = ["dep:zerodds-inspect-endpoint", "zerodds-inspect-endpoint/inspect"]
# Opt-2 (Spec `zerodds-zero-copy-1.0` §9): Linux-`recvmmsg`-Batch-Recv.
# Reduziert Per-Datagram-Syscall-Overhead um Faktor 8-10x. Default an
# auf Linux (siehe target-dependent dep unten); aufruf via
# `UdpTransport::recv_batch(&mut Vec<ReceivedDatagram>, max)`. Wenn
# Feature deaktiviert ist, faellt die Methode auf eine Schleife
# einzelner `recv()`-Calls zurueck.
recvmmsg-batch = ["dep:libc"]

[dependencies]
zerodds-rtps = { version = "1.0.0-rc.1", path = "../rtps" }
zerodds-transport = { version = "1.0.0-rc.1", path = "../transport" }
zerodds-monitor = { version = "1.0.0-rc.1", path = "../monitor", default-features = false, features = ["std"] }
socket2 = { workspace = true }
# Linux-only: libc::recvmmsg + struct mmsghdr fuer Batch-Recv.
# Opt-2 / Feature `recvmmsg-batch`.
libc = { workspace = true, optional = true }
# Inspect-Endpoint Tap-Hooks (PDE Reality Inspector). Optional.
zerodds-inspect-endpoint = { version = "1.0.0-rc.1", path = "../inspect-endpoint", optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "vectored_send"
harness = false
