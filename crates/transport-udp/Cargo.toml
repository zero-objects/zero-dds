[package]
name = "zerodds-transport-udp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "UDP/IP PSM for ZeroDDS — DDSI-RTPS 2.5 §9.6.1: UDPv4 unicast + multicast (discovery), SO_REUSE, multicast TTL."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-transport-udp"
readme = "README.md"
keywords = ["dds", "rtps", "udp", "multicast", "transport"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (internal/safety-flag-drift.md)
default = ["std", "recvmmsg-batch"]
std = ["alloc", "dep:if-addrs", "dep:socket2", "dep:zerodds-monitor", "zerodds-rtps/std", "zerodds-rtps/metrics", "zerodds-transport/std"]
alloc = ["zerodds-rtps/alloc", "zerodds-transport/alloc"]
# PDE Reality Inspector hook-up — tap dispatch in the UDP send path.
# Default OFF (R-034).
inspect = ["dep:zerodds-inspect-endpoint", "zerodds-inspect-endpoint/inspect"]
# Opt-2 (spec `zerodds-zero-copy-1.0` §9): Linux `recvmmsg` batch recv,
# reached through `Transport::recv_batch`. In the default set: the module
# behind it is `#[cfg(target_os = "linux")]`, so on every other platform the
# feature compiles to nothing and the trait default (one `recv()`) applies —
# which is why it can be on unconditionally instead of per target.
recvmmsg-batch = []

[dependencies]
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps", default-features = false }
zerodds-transport = { version = "1.0.0-rc.7", path = "../transport", default-features = false }
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", default-features = false, features = ["std"], optional = true }
socket2 = { workspace = true, optional = true }
# #27: eligible interface enumeration, cross-platform. std-only (pulled by
# the `std` feature). Pcap-free (uses getifaddrs / GetAdaptersAddresses) —
# unlike pnet_datalink it needs no Npcap Packet.lib, so it links on Windows.
if-addrs = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
# libc for setsockopt(SO_DONTROUTE) configuration (a Cyclone DDS
# parallel, loopback-routing skip) and the Linux recvmmsg batch under
# feature `recvmmsg-batch`. Default-active on Unix (Linux, macOS, BSD).
libc = { workspace = true }
# Inspect-endpoint tap hooks (PDE Reality Inspector). Optional.
zerodds-inspect-endpoint = { version = "1.0.0-rc.7", path = "../inspect-endpoint", optional = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "vectored_send"
harness = false
