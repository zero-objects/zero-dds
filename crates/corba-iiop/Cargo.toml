[package]
name = "zerodds-corba-iiop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG CORBA 3.3 Part 2 §14 + §15.7 + §15.9 — full IIOP-TCP transport stack: ProfileBody (all 4 versions 1.0-1.3 incl. TaggedComponents), Connection / Connector / Acceptor with thread-safe connection reuse, bidirectional GIOP. no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-corba-iiop"
readme = "README.md"
keywords = ["dds", "corba", "iiop", "giop"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc", "dep:zerodds-corba-ccm", "zerodds-corba-giop/std"]
alloc = ["zerodds-corba-giop/alloc"]
# SSLIOP — IIOP over TLS (rustls). Requires std.
tls = ["std", "dep:rustls", "dep:rustls-pemfile", "dep:rustls-pki-types"]

[dependencies]
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire" }
zerodds-corba-giop = { version = "1.0.0-rc.7", path = "../corba-giop", default-features = false }
# SSLIOP transport (feature `tls`): rustls 0.23 + PEM loader + PKI types.
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
# Spec §16 Portable Interceptors wire-up — InterceptorRegistry +
# ClientInterceptionPoint/ServerInterceptionPoint are walked in the
# connection send/receive path. corba-ccm has no dependency on
# corba-iiop, so this is cycle-free. The connection wire-up is std-only
# (TCP); the default features (`std`) are sufficient.
zerodds-corba-ccm = { version = "1.0.0-rc.7", path = "../corba-ccm", optional = true }

[dev-dependencies]
# Self-signed test certs for the SSLIOP roundtrip (feature `tls`).
rcgen = "0.13"
