[package]
name = "zerodds-opcua-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG DDS-OPCUA Gateway 1.0 (formal/2020-01-01) type system + AddressSpace mapping"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-opcua-gateway"
readme = "README.md"
keywords = ["dds", "opcua", "gateway", "iiot"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
# `roxmltree` is std-only, and so is the `xml` module it serves
# (`#[cfg(feature = "std")] pub mod xml`). Declaring it unconditionally made
# the crate — and with it the three that depend on it — impossible to build
# for a target without std, which is what `categories = ["no-std"]` promises.
std = ["alloc", "dep:roxmltree"]
alloc = []

[dependencies]
zerodds-foundation = { version = "1.0.0-rc.7", path = "../foundation", default-features = false }
# Read-only XML parser for the §10 configuration schema loader.
# Same dep as crates/xml + crates/security-permissions — no second XML
# backend in the workspace.
roxmltree = { workspace = true, optional = true, features = ["std", "positions"] }
