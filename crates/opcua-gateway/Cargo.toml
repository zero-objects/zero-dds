[package]
name = "zerodds-opcua-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG DDS-OPCUA Gateway 1.0 (formal/2020-01-01) type system + AddressSpace mapping"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-opcua-gateway"
readme = "README.md"
keywords = ["dds", "opcua", "gateway", "iiot"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
# Read-only XML parser for the §10 configuration schema loader.
# Same dep as crates/xml + crates/security-permissions — no
# zweites XML-Backend im Workspace.
roxmltree = { workspace = true }
