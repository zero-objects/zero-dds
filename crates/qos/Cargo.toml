[package]
name = "zerodds-qos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DDS QoS policies (DDS 1.4 §2.2.3) + Request/Offered Compatibility-Matrix + PL_CDR_LE PID-Wire-Codec (DDSI-RTPS §9.6.3.2). Pure-Rust no_std + alloc."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-qos"
readme = "README.md"
keywords = ["dds", "qos", "policy", "wire-format", "no-std"]
categories = ["network-programming", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/safety-flag-drift.md)
default = ["std"]
# `alloc` is mandatory (zerodds-qos needs String/Vec for Partition,
# GenericData, ResourceLimits). The feature is kept for consistency
# with the other ZeroDDS crates.
std = ["alloc"]
alloc = []
[dependencies]
zerodds-cdr = { version = "1.0.0-rc.3", path = "../cdr", default-features = false, features = ["alloc"] }

[dev-dependencies]
