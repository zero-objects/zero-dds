[package]
name = "zerodds-routing-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Standalone DDS routing service: forwards samples between DDS domains, topics, QoS profiles and partitions within the DDS bus (RTI Routing Service equivalent). Type-agnostic byte forwarding, content filtering, keyed-instance + lifecycle propagation, multi-hop loop guard, and XTypes DynamicData transformation."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-routing-service"
readme = "README.md"
keywords = ["dds", "routing", "bridge", "daemon"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
name = "zerodds_routing_service"
path = "src/lib.rs"

[[bin]]
name = "zerodds-router"
path = "src/bin/zerodds-router.rs"

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.5", path = "../dcps" }
zerodds-qos = { version = "1.0.0-rc.5", path = "../qos" }
zerodds-rtps = { version = "1.0.0-rc.5", path = "../rtps" }
zerodds-cdr = { version = "1.0.0-rc.5", path = "../cdr" }
zerodds-types = { version = "1.0.0-rc.5", path = "../types" }
zerodds-sql-filter = { version = "1.0.0-rc.5", path = "../sql-filter" }
zerodds-monitor = { version = "1.0.0-rc.5", path = "../monitor" }
roxmltree = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ctrlc = { workspace = true }

[dev-dependencies]
