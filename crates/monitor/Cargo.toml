[package]
name = "zerodds-monitor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Observability substrate for ZeroDDS (zerodds-monitor-1.1): metric registry (Counter/Gauge/Histogram) + Prometheus text exporter + W3C trace-context PID + standard span schema."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-monitor"
readme = "README.md"
keywords = ["dds", "monitoring", "prometheus", "opentelemetry", "tracing"]
categories = ["network-programming", "development-tools::profiling"]
publish = true

[lints]
workspace = true

[features]
default = ["std", "prometheus-server"]
std = ["alloc"]
alloc = []
prometheus-server = ["std"]

[dependencies]
zerodds-foundation = { version = "1.0.0-rc.5", path = "../foundation", default-features = false, features = ["std"] }

[dev-dependencies]
