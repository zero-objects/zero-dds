[package]
name = "zerodds-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OMG XTypes 1.3 type system: TypeIdentifier + TypeObject (Minimal/Complete) + Assignability + DynamicType + TypeLookup. Pure-Rust no_std + alloc."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-types"
readme = "README.md"
keywords = ["dds", "xtypes", "type-system", "schema", "no-std"]
categories = ["network-programming", "data-structures", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (internal/safety-flag-drift.md)
default = ["std"]
std = ["alloc"]
alloc = []
[dependencies]
zerodds-cdr = { version = "1.0.0-rc.4", path = "../cdr", default-features = false, features = ["alloc"] }
# MD5 is spec-conformant for EquivalenceHash + NameHash (XTypes §7.3.1.2.1,
# §7.3.4.5). Foundation provides a pure-Rust no_std MD5.
zerodds-foundation = { version = "1.0.0-rc.4", path = "../foundation", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = { workspace = true }
