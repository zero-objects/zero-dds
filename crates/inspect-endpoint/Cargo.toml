[package]
name = "zerodds-inspect-endpoint"
description = "ZeroDDS Inspect-Endpoint — God-Mode Debug-Pfad fuer PDE Reality Inspector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Aktivieren mit `--features inspect-endpoint/inspect`. Default OFF
# (R-034 / R-070): Production-Builds enthalten keinen Debug-Code.
#
# Wenn `inspect` aus, ist die public API leer (alle pub fns sind
# `#[cfg(feature = "inspect")]`-gated) — das Crate compiliert weiter,
# der DDS-Stack zieht keine Logik daraus, kein Hot-Path-Branch.

[features]
default = []
inspect = ["dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0"
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
