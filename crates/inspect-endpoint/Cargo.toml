[package]
name = "zerodds-inspect-endpoint"
description = "ZeroDDS inspect endpoint — feature-gated tap hooks + wire frame + cert.d auth for the external PDE Reality Inspector. Default-OFF (R-099/C-021): no hot-path branch in the production build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-inspect-endpoint"
readme = "README.md"
keywords = ["dds", "debug", "inspect", "tap", "observability"]
categories = ["development-tools::debugging", "network-programming"]
publish = true

[lints]
workspace = true

# Enable with `--features inspect-endpoint/inspect`. Default OFF
# (R-034 / R-070): production builds contain no debug code.
#
# When `inspect` is off, the public API is empty (all pub fns are
# `#[cfg(feature = "inspect")]`-gated) — the crate still compiles,
# the DDS stack draws no logic from it, no hot-path branch.

[features]
default = []
inspect = ["dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0"
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
