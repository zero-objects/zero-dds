[package]
name = "zerodds-inspect-endpoint"
description = "ZeroDDS Inspect-Endpoint — feature-gated Tap-Hooks + Wire-Frame + cert.d-Auth fuer den externen PDE Reality Inspector. Default-OFF (R-099/C-021): kein Hot-Path-Branch im Production-Build."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-inspect-endpoint"
readme = "README.md"
keywords = ["dds", "debug", "inspect", "tap", "observability"]
categories = ["development-tools::debugging", "network-programming"]
publish = true

[lints]
workspace = true

# Aktivieren mit `--features inspect-endpoint/inspect`. Default OFF
# (R-034 / R-070): Production-Builds enthalten keinen Debug-Code.
#
# Wenn `inspect` aus, ist die public API leer (alle pub fns sind
# `#[cfg(feature = "inspect")]`-gated) — das Crate compiliert weiter,
# der DDS-Stack zieht keine Logik daraus, kein Hot-Path-Branch.

[features]
default = []
inspect = ["dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "1.0"
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
