[package]
name = "zerodds-dlrl-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DLRL code-generation helpers (DDS 1.4 Annex B.4): object and home classes for C++, C#, Java and TypeScript from the DLRL pragmas."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-dlrl-codegen"
readme = "README.md"
keywords = ["dds", "dlrl", "codegen", "omg"]
categories = ["development-tools", "network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["zerodds-dlrl/std"]

[dependencies]
zerodds-dlrl = { version = "1.0.0-rc.7", path = "../dlrl", default-features = false }
