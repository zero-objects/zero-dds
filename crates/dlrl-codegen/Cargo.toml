[package]
name = "zerodds-dlrl-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DLRL code-gen helpers: emits home/object boilerplate for cpp/csharp/java/ts"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-dlrl-codegen"
readme = "README.md"
keywords = ["dds", "dlrl", "codegen", "idl"]
categories = ["development-tools"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
zerodds-dlrl = { version = "1.0.0-rc.7", path = "../dlrl" }
