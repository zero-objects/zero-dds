[package]
name = "zerodds-mqtt-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MQTT v5.0 (OASIS Standard) Wire-Codec + Broker + Topic-Filter + Keep-Alive + DDS-Bridge — no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-mqtt-bridge"
readme = "README.md"
keywords = ["dds", "mqtt", "mqtt5", "broker", "no-std"]
categories = ["network-programming", "encoding", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "daemon"]
std = ["alloc"]
alloc = []
# `daemon` enables the `zerodds-mqtt-bridged` binary + DDS pump.
# Pulls in `std` and path deps on zerodds-dcps/qos/types/rtps.
daemon = [
    "std",
    "dep:zerodds-dcps",
    "dep:zerodds-rtps",
    "dep:zerodds-qos",
    "dep:zerodds-types",
    "dep:zerodds-bridge-security",
    "dep:rustls",
    "dep:zerodds-monitor",
    "dep:zerodds-observability-otlp",
    "dep:signal-hook",
]
# Cross-vendor interop tests against Mosquitto (Spec §10 + §12.3); requires `mosquitto_pub`/`mosquitto_sub` binaries.
cross-vendor-tests = ["daemon"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.4", path = "../dcps", optional = true, default-features = false, features = ["std"] }
zerodds-rtps = { version = "1.0.0-rc.4", path = "../rtps", optional = true, default-features = false, features = ["std"] }
zerodds-qos = { version = "1.0.0-rc.4", path = "../qos", optional = true, default-features = false, features = ["alloc"] }
zerodds-types = { version = "1.0.0-rc.4", path = "../types", optional = true, default-features = false, features = ["alloc"] }
# Bridge-Security-Substrat (Bridge-Spec §7.1 TLS / §7.2 Auth / §7.3 ACL).
zerodds-bridge-security = { version = "1.0.0-rc.4", path = "../bridge-security", optional = true }
rustls = { workspace = true, optional = true }
# Cross-Cutting Daemon-Observability: §8.2 Prometheus + §8.3 OTLP + §9.2 Graceful Shutdown.
zerodds-monitor = { version = "1.0.0-rc.4", path = "../monitor", optional = true, default-features = false, features = ["std", "prometheus-server"] }
zerodds-observability-otlp = { version = "1.0.0-rc.4", path = "../observability-otlp", optional = true }
signal-hook = { workspace = true, optional = true }

[[bin]]
name = "zerodds-mqtt-bridged"
path = "src/bin/zerodds-mqtt-bridged.rs"
required-features = ["daemon"]

[dev-dependencies]
# Self-signed certs + PEM loader for §7.1 TLS tests in
# `tests/security_e2e.rs`. Per-crate, no workspace edit.
rcgen = "0.13"
rustls-pemfile = { workspace = true }
