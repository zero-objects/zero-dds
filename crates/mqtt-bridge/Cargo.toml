[package]
name = "zerodds-mqtt-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MQTT v5.0 (OASIS Standard) Wire-Codec + Broker + Topic-Filter + Keep-Alive + DDS-Bridge — no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-mqtt-bridge"
readme = "README.md"
keywords = ["dds", "mqtt", "mqtt5", "broker"]
categories = ["network-programming", "encoding"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "daemon", "ring-backend"]
# The crypto backend of bridge-security (JWT verify and the rustls TLS
# provider): `ring-backend` (default) or `aws-lc` (aws-lc-rs, FIPS 140-3
# validatable). A FIPS build: `--no-default-features --features <the
# default list without ring-backend>,aws-lc`; with both, aws-lc is used.
ring-backend = ["zerodds-bridge-security?/ring-backend"]
aws-lc = ["zerodds-bridge-security?/aws-lc"]
std = ["alloc"]
alloc = []
# The WebSocket listener of the broker server (MQTT 5.0 §6, RFC 6455): the
# frame codec and the opening handshake of zerodds-websocket-bridge.
websocket = ["std", "dep:zerodds-websocket-bridge"]
# The TLS listeners of the broker server (`mqtts`, and `wss` with
# `websocket`) over rustls with the provider of bridge-security; it needs
# one crypto backend, `ring-backend` or `aws-lc` (bridge-security refuses
# to build without one).
tls =["std", "dep:zerodds-bridge-security", "dep:rustls"]
# `daemon` enables the `zerodds-mqtt-bridged` binary + DDS pump.
# Pulls in `std` and path deps on zerodds-dcps/qos/types/rtps.
daemon = [
    "dep:zerodds-config",
    "std",
    "dep:zerodds-dcps",
    "dep:zerodds-rtps",
    "dep:zerodds-qos",
    "dep:zerodds-types",
    "tls",
    "websocket",
    "dep:zerodds-monitor",
    "dep:zerodds-observability-otlp",
    "dep:zerodds-foundation",
    "dep:getrandom",
    "dep:signal-hook",
]
# Cross-vendor interop tests against Mosquitto (Spec §10 + §12.3); requires `mosquitto_pub`/`mosquitto_sub` binaries.
cross-vendor-tests = ["daemon"]
# C2(2): passthrough for `zerodds-dcps/rt` (`threads.*` real-time scheduling
# + CPU affinity via `zerodds-rt-linux`). Off by default; build with
# `--features rt` so a `threads.recv_policy=fifo`-style config on this
# daemon applies instead of refusing with "feature missing". Implies
# `daemon` (`zerodds-dcps` is only linked under it).
rt = ["daemon", "zerodds-dcps/rt"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps", optional = true, default-features = false, features = ["std"] }
zerodds-config = { version = "1.0.0-rc.7", path = "../config", optional = true }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps", optional = true, default-features = false, features = ["std"] }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos", optional = true, default-features = false, features = ["alloc"] }
# `qos::ExtensibilityForRepr`: the framing a DDS writer gives a PUBLISH's
# CDR bytes, named by its encapsulation header (DDS-XTypes 1.3 Table 60).
zerodds-types = { version = "1.0.0-rc.7", path = "../types", optional = true, default-features = false, features = ["alloc"] }
# Bridge-Security-Substrat (Bridge-Spec §7.1 TLS / §7.2 Auth / §7.3 ACL).
zerodds-bridge-security = { version = "1.0.0-rc.7", path = "../bridge-security", optional = true, default-features = false, features = ["std"] }
rustls = { workspace = true, optional = true }
# RFC 6455 frame codec and the handshakes for the ws:// and wss:// broker
# schemes and the WebSocket listener of the broker server (MQTT 5.0 §6);
# only the codec, not the WebSocket daemon.
zerodds-websocket-bridge = { version = "1.0.0-rc.7", path = "../websocket-bridge", optional = true, default-features = false, features = ["std"] }
# Cross-Cutting Daemon-Observability: §8.2 Prometheus + §8.3 OTLP + §9.2 Graceful Shutdown.
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", optional = true, default-features = false, features = ["std", "prometheus-server"] }
zerodds-observability-otlp = { version = "1.0.0-rc.7", path = "../observability-otlp", optional = true }
# The span types of §8.3 (`zerodds_foundation::tracing`) and the random
# trace identifiers of the spans.
zerodds-foundation = { version = "1.0.0-rc.7", path = "../foundation", optional = true, default-features = false, features = ["std"] }
getrandom = { version = "0.2", optional = true }
signal-hook = { workspace = true, optional = true }

[[bin]]
name = "zerodds-mqtt-bridged"
path = "src/bin/zerodds-mqtt-bridged.rs"
required-features = ["daemon"]

[dev-dependencies]
# Self-signed certs + PEM loader for §7.1 TLS tests in
# `tests/security_e2e.rs`. Per-crate, no workspace edit.
rcgen = "0.13"
rustls-pemfile = { workspace = true }
# DDS domains of the daemon tests, leased from the host's share of the band.
zerodds-test-domains = { path = "../test-domains" }
# The server side of SCRAM-SHA-256 (RFC 5802 §3) in the test broker of
# `tests/enhanced_auth.rs`: PBKDF2, HMAC, SHA-256, base64.
ring = { workspace = true }
base64 = { workspace = true }
# Reads the JSON log lines of Spec §8.1 back in the tests.
serde_json = "1"

# The contract with zerodds-dcps (internal/release/rc8-test-suite.md, "Crate
# tier"): this crate reaches zerodds-dcps only with `daemon`.
[[test]]
name = "contract_dcps"
path = "tests/contract_dcps.rs"
required-features = ["daemon"]

# The contract with zerodds-websocket-bridge (internal/release/rc8-test-suite.md,
# "Crate tier"): this crate reaches zerodds-websocket-bridge only with
# `websocket` (the server's listener; `daemon` enables it for the client).
[[test]]
name = "contract_websocket_bridge"
path = "tests/contract_websocket_bridge.rs"
required-features = ["websocket"]

# The contract with zerodds-types (internal/release/rc8-test-suite.md, "Crate
# tier"): this crate reaches zerodds-types only with `daemon`.
[[test]]
name = "contract_types"
path = "tests/contract_types.rs"
required-features = ["daemon"]

# The contract with zerodds-bridge-security (internal/release/rc8-test-suite.md,
# "Crate tier"): this crate reaches zerodds-bridge-security only with `tls`
# (the server's TLS listeners; `daemon` enables it for its security layer).
[[test]]
name = "contract_bridge_security"
path = "tests/contract_bridge_security.rs"
required-features = ["tls"]
