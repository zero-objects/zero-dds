[package]
name = "zerodds-security-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Security-Gate: Governance-driven RTPS-Submessage-Wrap/Unwrap, Peer-Capabilities-Cache, Built-in DataTagging, Anti-Squatter, Heterogeneous-Mesh-Gateway-Bridge."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-runtime"
readme = "README.md"
keywords = ["dds", "security", "runtime", "governance", "gate"]
categories = ["network-programming", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/safety-flag-drift.md)
default = ["std"]
std = []

[dependencies]
zerodds-qos = { version = "1.0.0-rc.3.1", path = "../qos" }
zerodds-rtps = { version = "1.0.0-rc.3.1", path = "../rtps", default-features = false, features = ["alloc"] }
zerodds-security = { version = "1.0.0-rc.3.1", path = "../security" }
zerodds-security-crypto = { version = "1.0.0-rc.3.1", path = "../security-crypto" }
zerodds-security-permissions = { version = "1.0.0-rc.3.1", path = "../security-permissions" }
# DelegationChain im PeerCapabilities-Cache + Wire-Codec.
zerodds-security-pki = { version = "1.0.0-rc.3.1", path = "../security-pki" }
zerodds-security-rtps = { version = "1.0.0-rc.3.1", path = "../security-rtps" }

[dev-dependencies]
zerodds-discovery = { path = "../discovery" }
# Test-Keys + Delegation-Wire-Test.
ring = { workspace = true }
# Conformance matrix test needs the production logging builtin.
zerodds-security-logging = { path = "../security-logging" }
