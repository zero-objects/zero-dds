[package]
name = "zerodds-security-runtime"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Security-Gate: Governance-driven RTPS-Submessage-Wrap/Unwrap, Peer-Capabilities-Cache, Built-in DataTagging, Anti-Squatter, Heterogeneous-Mesh-Gateway-Bridge."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-runtime"
readme = "README.md"
keywords = ["dds", "security", "runtime", "governance", "gate"]
categories = ["network-programming", "cryptography"]
publish = true

[lints]
workspace = true

# The crate tier runs the tests of this crate with its default features and
# once more with each of these (internal/release/rc8-test-suite.md, "Crate
# tier"): the `pkcs11:` identity material is behind a feature no default
# build has. Its SoftHSM test runs in the integration job
# `integration-security`.
[package.metadata.crate-tier]
feature-runs = ["pkcs11"]

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/architecture/04_safety_by_architecture.md §3)
default = ["std", "ring-backend"]
std = []
# The security deps are pulled `default-features = false`, so the backend is
# chosen here and fans out — that lets `fips` build with NO ring at all.
# `ring-backend` (default) selects the ring primitives across the whole stack.
ring-backend = [
    "zerodds-security-crypto/ring-backend",
    "zerodds-security-crypto/std",
    "zerodds-security-crypto/metrics",
    "zerodds-security-permissions/ring-backend",
    "zerodds-security-permissions/std",
    "zerodds-security-pki/ring-backend",
    "zerodds-security-pki/std",
]
# FIPS umbrella: one knob that swaps the whole DDS-Security crypto stack to
# `aws-lc-rs` (AWS-LC, FIPS-140-3-validatable) and, with --no-default-features,
# pulls in NO ring at all. Fans `aws-lc` out (permissions → pki → keyexchange +
# crypto). Build: `--no-default-features --features std,fips`.
fips = [
    "std",
    "zerodds-security-crypto/aws-lc",
    "zerodds-security-permissions/aws-lc",
    "zerodds-security-pki/aws-lc",
]
# wolfCrypt umbrella: swaps the whole DDS-Security crypto stack to wolfSSL/
# wolfCrypt (FIPS-ready, DO-178/embedded heritage) via the ring-API-compatible
# shim. Fans `wolfcrypt` out (permissions → pki → keyexchange + crypto). The
# primitive surface (AEAD/HMAC/HKDF/ECDH/signing) is wolfCrypt; X.509 cert-chain
# verify keeps the webpki `ring` provider (no wolfCrypt provider upstream).
# Build: `--no-default-features --features std,wolfcrypt` (needs libwolfssl or
# WOLFSSL_SRC pointing at a wolfSSL 5.9.x source tree).
wolfcrypt = [
    "std",
    "zerodds-security-crypto/wolfcrypt",
    "zerodds-security-permissions/wolfcrypt",
    "zerodds-security-pki/wolfcrypt",
]
# PKCS#11 token access for the `pkcs11:` URIs DDS-Security 1.2 §9.3.1
# Table 44 allows for the identity and §9.4.1.2 Table 46 for the
# Access-Control material (RFC 7512). Optional: default builds stay
# unchanged, and a `pkcs11:` value then refuses naming this feature.
pkcs11 = ["std", "dep:cryptoki", "dep:sha2"]

[dependencies]
zerodds-qos = { version = "1.0.0-rc.7.2", path = "../qos" }
# The `;base64` form of a `data:` URI (RFC 2397), which DDS-Security 1.2
# Table 50 names for every identity and access-control property.
base64 = { workspace = true }
zerodds-rtps = { version = "1.0.0-rc.7.2", path = "../rtps", default-features = false, features = ["alloc"] }
zerodds-security = { version = "1.0.0-rc.7.2", path = "../security" }
zerodds-security-crypto = { version = "1.0.0-rc.7.2", path = "../security-crypto", default-features = false }
zerodds-security-permissions = { version = "1.0.0-rc.7.2", path = "../security-permissions", default-features = false }
# DelegationChain in the PeerCapabilities cache + wire codec.
zerodds-security-pki = { version = "1.0.0-rc.7.2", path = "../security-pki", default-features = false }
zerodds-security-rtps = { version = "1.0.0-rc.7.2", path = "../security-rtps" }

# `pkcs11:` URIs (RFC 7512, DDS-Security 1.2 §9.3.1 Table 44). Optional
# behind the `pkcs11` feature. `default-features = false` uses the
# pre-generated bindings and loads the module through `libloading` at
# runtime, so no PKCS#11 library is needed to build.
cryptoki = { version = "0.12", optional = true, default-features = false }
# SHA-256 for the ECDSA digest `CKM_ECDSA` signs: the token signs the
# pre-computed digest, not the message.
sha2 = { workspace = true, optional = true }

[dev-dependencies]
zerodds-discovery = { path = "../discovery" }
# Test-Keys + Delegation-Wire-Test.
ring = { workspace = true }
# Conformance matrix test needs the production logging builtin.
zerodds-security-logging = { path = "../security-logging" }
# cyclone_live_security_caps: a leased domain, and the SPDP port shared with
# the local Cyclone (SO_REUSEADDR).
zerodds-test-domains = { path = "../test-domains" }
socket2 = { workspace = true }
