[package]
name = "zerodds-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Transport trait + Locator re-export + abstract send/receive interface for RTPS state machines. Pure-Rust no_std + alloc."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-transport"
readme = "README.md"
keywords = ["dds", "transport", "rtps", "no-std"]
categories = ["network-programming", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/safety-flag-drift.md)
default = ["std"]
std = ["alloc"]
alloc = []
[dependencies]
zerodds-rtps = { version = "1.0.0-rc.3", path = "../rtps", default-features = false }

[dev-dependencies]
