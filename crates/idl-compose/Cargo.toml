[package]
name = "zerodds-idl-compose"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared IDL composition pipeline (preprocess -> parse -> vendor key-pragmas -> default-extensibility -> TypeObject lowering) extracted from zerodds-idlc so build-time consumers (zerodds-build, CMake, future build-graph integrations) get CLI-feature-equivalent output without shelling out."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idl-compose"
readme = "README.md"
keywords = ["idl", "dds", "xtypes", "build", "codegen"]
categories = ["development-tools", "development-tools::build-utils"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Built-in default extensibility for an un-annotated aggregate when the
# caller does not pass one explicitly (XTypes 1.3 SS7.3.3.1 leaves it
# implementation-defined). Mirrors zerodds-idlc's `ext-default-*` features
# so a build-crate consumer and the CLI agree on the same default.
default = ["ext-default-appendable"]
ext-default-appendable = []
ext-default-final = []
ext-default-mutable = []

[dependencies]
zerodds-idl = { version = "1.0.0-rc.6", path = "../idl" }
