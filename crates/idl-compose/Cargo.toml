[package]
name = "zerodds-idl-compose"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The shared IDL composition pipeline: include paths, preprocess, parse, lower and register type objects — one call for every build-time consumer."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idl-compose"
readme = "README.md"
keywords = ["dds", "idl", "build", "codegen", "omg"]
categories = ["development-tools::build-utils"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zerodds-ast = { version = "1.0.0-rc.7.2", path = "../ast" }
zerodds-idl-cst = { version = "1.0.0-rc.7.2", path = "../idl-cst" }
zerodds-idl-lower = { version = "1.0.0-rc.7.2", path = "../idl-lower" }
zerodds-idl-parse = { version = "1.0.0-rc.7.2", path = "../idl-parse" }
zerodds-ast-layout = { version = "1.0.0-rc.7.2", path = "../ast-layout" }
zerodds-types = { version = "1.0.0-rc.7.2", path = "../types" }
