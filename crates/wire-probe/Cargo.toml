[package]
name = "zerodds-wire-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Turns one IDL type and one JSON value into wire bytes, for the interop suite"
homepage = "https://zerodds.org"
keywords = ["dds", "xcdr", "cdr", "wire", "diagnostics"]
categories = ["encoding", "development-tools::debugging"]

[[bin]]
name = "wireprobe-zerodds"
path = "src/main.rs"

[lib]
name = "zerodds_wire_probe"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
zerodds-float128 = { path = "../float128", version = "1.0.0-rc.7" }
zerodds-ast = { path = "../ast", version = "1.0.0-rc.7" }
zerodds-ast-core = { path = "../ast-core", version = "1.0.0-rc.7" }
zerodds-ast-layout = { path = "../ast-layout", version = "1.0.0-rc.7" }
zerodds-wire = { path = "../wire", version = "1.0.0-rc.7" }
zerodds-wire-codec = { path = "../wire-codec", version = "1.0.0-rc.7" }
zerodds-idl-parse = { path = "../idl-parse", version = "1.0.0-rc.7" }
zerodds-idl-compose = { version = "1.0.0-rc.7", path = "../idl-compose" }
zerodds-idl-cst = { path = "../idl-cst", version = "1.0.0-rc.7" }
zerodds-idl-lower = { path = "../idl-lower", version = "1.0.0-rc.7" }
# The value file is JSON because a probe has to be callable from a shell
# script and diffable by a human. No derive: the values are read against
# the model, not against a Rust type.
serde_json = "1.0"
