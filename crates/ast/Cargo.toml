[package]
name = "zerodds-ast"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Common AST for the ZeroDDS type system: source-neutral node space with per-source typed facets. Implements docs/specs/zerodds-ast-1.0.md."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zerodds-ast"
readme = "README.md"
keywords = ["dds", "idl", "ast", "compiler"]
categories = ["compilers", "parser-implementations"]

[dependencies]
zerodds-ast-core = { path = "../ast-core", version = "1.0.0-rc.7.2" }
# IDL 4.2 §7.4.1.4.2: `long double` constant arithmetic runs in binary128.
zerodds-float128 = { path = "../float128", version = "1.0.0-rc.7.2" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
