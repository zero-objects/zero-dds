[package]
name = "zerodds-coap-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CoAP (RFC 7252 / 7641 / 7959 / 6690) Wire-Codec + Reliability + Observe + Block-Wise + Discovery + DDS-Topic-Bridge — no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-coap-bridge"
readme = "README.md"
keywords = ["dds", "coap", "rfc7252", "iot"]
categories = ["network-programming", "embedded"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The crate tier runs the tests of this package once more with these
# features (internal/release/rc8-test-suite.md, "Crate tier"): DTLS (RFC 7252
# §9) and OSCORE (RFC 8613) are opt-in.
[package.metadata.crate-tier]
feature-runs = ["dtls,oscore"]

[features]
default = ["std", "daemon", "ring-backend"]
# The crypto backend of bridge-security (JWT verify and the rustls TLS
# provider): `ring-backend` (default) or `aws-lc` (aws-lc-rs, FIPS 140-3
# validatable). A FIPS build: `--no-default-features --features <the
# default list without ring-backend>,aws-lc`; with both, aws-lc is used.
ring-backend = ["zerodds-bridge-security?/ring-backend"]
aws-lc = ["zerodds-bridge-security?/aws-lc"]
std = ["alloc"]
alloc = []
# `daemon` enables the `zerodds-coap-bridged` binary + DDS pump.
daemon = [
    "dep:zerodds-config",
    "std",
    "dep:zerodds-dcps",
    "dep:zerodds-rtps",
    "dep:zerodds-qos",
    "dep:zerodds-bridge-security",
    "dep:zerodds-monitor",
    "dep:zerodds-observability-otlp",
    "dep:zerodds-foundation",
    "dep:signal-hook",
    "dep:socket2",
    "dep:nix",
    "dep:getrandom",
    "dep:zerodds-types",
    "zerodds-types/dynamic",
    "dep:zerodds-idl-compose",
    "dep:zerodds-wire-codec",
    "dep:zerodds-ast-layout",
    "dep:serde_json",
    "dep:ciborium",
]
# OSCORE (RFC 8613) object security — HKDF-SHA-256 key derivation + COSE.
# no_std + alloc; pulls only RustCrypto hmac/sha2 (AEAD layer adds `ccm`).
oscore = ["alloc", "dep:hmac", "dep:sha2", "dep:ccm", "dep:aes"]
# DTLS 1.2 (RFC 6347) for coaps:// (RFC 7252 §9) on OpenSSL 3.2 or later
# (`zerodds-dtls-openssl`): pre-shared keys, raw public keys (RFC 7250) and
# certificates. Opt-in, NOT in `default`: it links libssl. See ADR 0014.
dtls = ["std", "dep:zerodds-dtls-openssl"]
# OpenSSL built from source for `dtls` on a host without OpenSSL 3.2.
dtls-vendored-openssl = ["dtls", "zerodds-dtls-openssl/vendored"]
# Cross-vendor interop tests against libcoap (Spec §10 + §12.3); requires the `coap-client` binary.
cross-vendor-tests = ["daemon"]
# C2(2): passthrough for `zerodds-dcps/rt` (`threads.*` real-time scheduling
# + CPU affinity via `zerodds-rt-linux`). Off by default; build with
# `--features rt` so a `threads.recv_policy=fifo`-style config on this
# daemon applies instead of refusing with "feature missing". Implies
# `daemon` (`zerodds-dcps` is only linked under it).
rt = ["daemon", "zerodds-dcps/rt"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps", optional = true, default-features = false, features = ["std"] }
zerodds-config = { version = "1.0.0-rc.7", path = "../config", optional = true }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps", optional = true, default-features = false, features = ["std"] }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos", optional = true, default-features = false, features = ["alloc"] }
# Bridge-security substrate (Bridge-Spec §7.2 Auth / §7.3 Topic-ACL).
# §7.1 DTLS for coaps:// is behind the opt-in `dtls` feature
# (`zerodds-dtls-openssl`, DTLS 1.2 on OpenSSL) — see ADR 0014.
zerodds-bridge-security = { version = "1.0.0-rc.7", path = "../bridge-security", optional = true, default-features = false, features = ["std"] }
# Cross-cutting daemon observability: §8.2 Prometheus + §8.3 OTLP + §9.2 Graceful Shutdown.
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", optional = true, default-features = false, features = ["std", "prometheus-server"] }
zerodds-observability-otlp = { version = "1.0.0-rc.7", path = "../observability-otlp", optional = true }
# The spans of §8.3 (`Span`, `SpanContext`, the attributes).
zerodds-foundation = { version = "1.0.0-rc.7", path = "../foundation", optional = true, default-features = false, features = ["std"] }
signal-hook = { workspace = true, optional = true }
# An IPv6-only socket next to an IPv4 one for the IPv6 multicast groups
# (RFC 7252 §8).
socket2 = { workspace = true, optional = true }
# Random tokens and message IDs of the proxy (RFC 7252 §5.3.1).
getrandom = { version = "0.2", optional = true }
# The type of a topic from its `idl_file` (spec §4.5, §5.2): the model
# (`zerodds-idl-compose`, `zerodds-types`), its samples in the five forms
# of §4.5 (`zerodds-wire-codec`, the encodings of `zerodds-ast-layout`),
# JSON (`serde_json`) and CBOR (`ciborium`, RFC 8949).
zerodds-types = { version = "1.0.0-rc.7", path = "../types", optional = true, default-features = false, features = ["alloc"] }
zerodds-idl-compose = { version = "1.0.0-rc.7", path = "../idl-compose", optional = true }
zerodds-wire-codec = { version = "1.0.0-rc.7", path = "../wire-codec", optional = true }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../ast-layout", optional = true }
serde_json = { version = "1", optional = true }
ciborium = { version = "0.2", optional = true }
# OSCORE (RFC 8613) crypto — HKDF-SHA-256 via HMAC. no_std + alloc.
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ccm = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
# DTLS 1.2 (feature `dtls`) on OpenSSL for coaps://, blocking, a thread
# per session.
zerodds-dtls-openssl = { version = "1.0.0-rc.7", path = "../dtls-openssl", optional = true }

[dev-dependencies]
# Generates the cert/key PEM pairs the Spec §7.1 cert-mode + SIGHUP-rotation
# e2e writes to disk.
rcgen = "0.13"
# DDS domains of the daemon tests, leased from the host's share of the band.
zerodds-test-domains = { path = "../test-domains" }

[[bin]]
name = "zerodds-coap-bridged"
path = "src/bin/zerodds-coap-bridged.rs"
required-features = ["daemon"]

# The contract with zerodds-dcps (internal/release/rc8-test-suite.md, "Crate
# tier"): this crate reaches zerodds-dcps only with `daemon`.
[[test]]
name = "contract_dcps"
path = "tests/contract_dcps.rs"
required-features = ["daemon"]

# The contract with zerodds-dtls-openssl (internal/release/rc8-test-suite.md,
# "Crate tier"): this crate reaches zerodds-dtls-openssl only with `dtls`.
[[test]]
name = "contract_dtls_openssl"
path = "tests/contract_dtls_openssl.rs"
required-features = ["dtls"]

# The contract with zerodds-bridge-security (internal/release/rc8-test-suite.md,
# "Crate tier"): this crate reaches zerodds-bridge-security only with `daemon`.
[[test]]
name = "contract_bridge_security"
path = "tests/contract_bridge_security.rs"
required-features = ["daemon"]

# The contracts with the crates of a topic's type (internal/release/
# rc8-test-suite.md, "Crate tier"): this crate reaches them only with
# `daemon`.
[[test]]
name = "contract_types"
path = "tests/contract_types.rs"
required-features = ["daemon"]

[[test]]
name = "contract_idl_compose"
path = "tests/contract_idl_compose.rs"
required-features = ["daemon"]

[[test]]
name = "contract_wire_codec"
path = "tests/contract_wire_codec.rs"
required-features = ["daemon"]

[[test]]
name = "contract_ast_layout"
path = "tests/contract_ast_layout.rs"
required-features = ["daemon"]

# The destination address of a received datagram, IP_PKTINFO and
# IPV6_RECVPKTINFO (RFC 3542; RFC 7252 §8.1, §11.3), without unsafe code.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", optional = true, default-features = false, features = ["socket", "uio", "net"] }
