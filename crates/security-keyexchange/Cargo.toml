[package]
name = "zerodds-security-keyexchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ephemeral Diffie-Hellman key agreement (X25519 + P-256 ECDH) for the DDS-Security 1.1 authentication handshake (spec §8.3.2)."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-keyexchange"
readme = "README.md"
keywords = ["dds", "security", "x25519", "ecdh", "key-agreement"]
categories = ["network-programming", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/safety-flag-drift.md)
default = ["std"]
std = []

[dependencies]
zerodds-security = { version = "1.0.0-rc.3", path = "../security" }
ring = { workspace = true }
