[package]
name = "zerodds-security-keyexchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ephemeral Diffie-Hellman key agreement (X25519 + P-256 ECDH) for the DDS-Security 1.1 authentication handshake (spec §8.3.2)."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-keyexchange"
readme = "README.md"
keywords = ["dds", "security", "x25519", "ecdh", "key-agreement"]
categories = ["network-programming", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (internal/safety-flag-drift.md)
default = ["std", "ring-backend"]
std = []
# Crypto primitive backend (pick one) — see lib.rs. `ring-backend` (default,
# no_std) or `aws-lc` (aws-lc-rs / AWS-LC, FIPS-140-3-validatable; implies std).
ring-backend = ["dep:ring"]
aws-lc = ["dep:aws-lc-rs", "std"]
# Third backend: wolfSSL/wolfCrypt via the ring-API-compatible shim. It shares
# aws-lc-rs' API (4-arg `agree_ephemeral`), so it follows the `aws-lc` code path.
wolfcrypt = ["dep:wolfcrypt-compat", "std"]

[dependencies]
zerodds-security = { version = "1.0.0-rc.5", path = "../security" }
ring = { workspace = true, optional = true }
aws-lc-rs = { version = "1", optional = true }
# wolfCrypt backend — its `[lib] name` is `ring`, so it MUST be renamed here to
# avoid colliding with the real `ring` crate's extern name.
wolfcrypt-compat = { package = "wolfcrypt-ring-compat", version = "1", optional = true }
