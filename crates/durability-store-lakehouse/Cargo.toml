[package]
name = "zerodds-durability-store-lakehouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DuckDB lakehouse cold adapter for the ZeroDDS Durability-Service: in-process SQL (warehouse) + Parquet export (lake). Implements zerodds-durability-store::DurabilityStore."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-durability-store-lakehouse"
readme = "README.md"
keywords = ["dds", "durability", "duckdb", "parquet"]
categories = ["network-programming", "database"]
# Source-only (NOT on crates.io): this adapter links the *system* libduckdb,
# so it cannot build in the clean `cargo publish` verify env (cannot find
# -lduckdb) — and shipping it would hand that link error to every crates.io
# consumer. The DuckDB lakehouse is an *optional* durability backend; the
# self-contained backends (durability-store-sqlite / -file) cover crates.io.
# Build this one from the repo with libduckdb present.
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# DuckDB is an OPTIONAL backend (default OFF) so the whole workspace builds
# without the system `libduckdb` present. The entire crate is gated behind
# this feature (`#![cfg(feature = "duckdb")]` in lib.rs): with it off the
# crate is an empty placeholder that links nothing native. Enable it
# (`--features duckdb`, or via the daemon's `lakehouse` feature) to get the
# real adapter — that build needs `libduckdb`.
default = []
duckdb = ["dep:duckdb"]

[dependencies]
zerodds-durability-store = { version = "1.0.0-rc.7", path = "../durability-store" }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos" }
duckdb = { workspace = true, optional = true }

[dev-dependencies]
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos" }
