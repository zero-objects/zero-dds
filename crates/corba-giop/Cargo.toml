[package]
name = "zerodds-corba-giop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG CORBA 3.3 Part 2 §15 GIOP (General Inter-ORB Protocol) wire codec — all 8 message types for GIOP 1.0/1.1/1.2 incl. bidirectional GIOP. no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-corba-giop"
readme = "README.md"
keywords = ["dds", "corba", "giop", "iiop", "no-std"]
categories = ["network-programming", "no-std", "encoding"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
# CDR-1 marshalling (GIOP uses CDR for header + body encoding).
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire" }

[dev-dependencies]
# The end-to-end test drives a transactional invocation over a real TCP
# connection: the GIOP framing here, the `TransactionService` service
# context from the OTS crate, the `RTCorbaPriority` one from the CORBA
# runtime. Neither depends on this crate, so the edge is one way.
zerodds-corba-cos-transactions = { path = "../corba-cos-transactions" }
zerodds-corba-rt = { path = "../corba-rt" }
