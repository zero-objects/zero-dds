[package]
name = "zerodds-codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDS topic types defined in Rust: derive(DdsType) and derive(WireRepr), the codec they drive, and the IDL a C or C++ peer is built from."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-codec"
readme = "README.md"
keywords = ["dds", "xcdr", "derive", "idl", "serialization"]
categories = ["encoding", "network-programming"]
publish = true

[lints]
workspace = true

[dependencies]
zerodds-ast = { version = "1.0.0-rc.7", path = "../ast" }
zerodds-ast-core = { version = "1.0.0-rc.7", path = "../ast-core" }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../ast-layout" }
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps" }
zerodds-derive = { version = "1.0.0-rc.7", path = "../derive" }
zerodds-idl-compose = { version = "1.0.0-rc.7", path = "../idl-compose" }
zerodds-types = { version = "1.0.0-rc.7", path = "../types" }
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire", features = ["std"] }


[dev-dependencies]
zerodds-test-domains = { path = "../test-domains" }
