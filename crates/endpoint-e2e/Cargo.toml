[package]
name = "zerodds-endpoint-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Live cross-language ping-pong E2E: native endpoint apps (idlc-generated types + endpoint SDK) exchange typed samples with a Rust XRCE peer."
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# The wire codec. `crates/cdr` was demolished with the IDL transplant
# (d045e43ea86); `BufferReader`/`BufferWriter` are `Reader`/`Writer` here.
zerodds-wire = { path = "../wire" }
zerodds-xrce = { path = "../xrce" }
# The IDL frontend and the one code generator. The fifteen per-language
# `crates/idl-<lang>` generators this crate used to name are gone: the
# same transplant replaced them with the rule layer below, reached
# through `generate::source(&ast, Language::<L>, key)` — one entry point
# for every column, the same one `tools/idlc` and
# `crates/lang-rules/tests/generate_contract.rs` take.
#
# A dependency and not a dev-dependency: `gen::source` is what the
# fourteen language tests call, and one generator bound once beats the
# same four-step pipeline copied into fourteen test files.
zerodds-idl-parse = { path = "../idl-parse" }
zerodds-idl-lower = { path = "../idl-lower" }
zerodds-ast-layout = { path = "../ast-layout" }
zerodds-lang-cst = { path = "../lang-cst" }
zerodds-lang-rules = { path = "../lang-rules" }

[dev-dependencies]
zerodds-dotnet-build-lock = { path = "../dotnet-build-lock" }
# The Rust endpoint SDK, so `tests/xrce_write_framing.rs` can hand its
# `WRITE_DATA` frame straight to the `zerodds-xrce` decoder without a
# subprocess — the Rust column of the same gate every other language takes.
zerodds-endpoint-rust = { path = "../../endpoints/rust" }
