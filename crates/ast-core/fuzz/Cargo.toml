[package]
name = "zerodds-ast-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zerodds-ast-core = { path = ".." }

# Fuzz crates are their own workspace root; cargo-fuzz drives them
# directly, not through the parent workspace.
[workspace]

[[bin]]
name = "snapshot_reader"
path = "fuzz_targets/snapshot_reader.rs"
test = false
doc = false
bench = false
