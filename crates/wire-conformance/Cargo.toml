[package]
name = "zerodds-wire-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Compiles the code the generator produces and checks its bytes against the wire vectors. The gate that catches what a name comparison cannot."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
zerodds-wire = { path = "../wire", version = "1.0.0-rc.7" }

[dev-dependencies]
# The tests assert byte offsets that the PL_CDR1 header form decides,
# and that form is a dialect answer. They name the dialect rather than
# taking the offsets on trust, which needs the layout crate here as well
# as in the build script.
zerodds-ast-layout = { path = "../ast-layout", version = "1.0.0-rc.7" }

[build-dependencies]
zerodds-ast = { path = "../ast", version = "1.0.0-rc.7" }
zerodds-ast-core = { path = "../ast-core", version = "1.0.0-rc.7" }
zerodds-ast-layout = { path = "../ast-layout", version = "1.0.0-rc.7" }
zerodds-idl-parse = { path = "../idl-parse", version = "1.0.0-rc.7" }
zerodds-idl-lower = { path = "../idl-lower", version = "1.0.0-rc.7" }
zerodds-lang-cst = { path = "../lang-cst", version = "1.0.0-rc.7" }
zerodds-lang-render = { path = "../lang-render", version = "1.0.0-rc.7" }
zerodds-lang-rules = { path = "../lang-rules", version = "1.0.0-rc.7" }

[lints]
workspace = true
