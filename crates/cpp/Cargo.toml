[package]
name = "zerodds-cpp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "C++17 RAII wrapper headers (zerodds/dds.hpp) over the zerodds-c-api interface plus smoke examples. Cargo container for C++ artifacts, no Rust runtime."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-cpp"
readme = "README.md"
keywords = ["dds", "cpp", "ffi", "raii", "binding"]
categories = ["network-programming", "external-ffi-bindings"]
# Cargo container for C++ headers + examples; the Rust library stub
# intentionally exposes no public API. crates.io publish stays
# disabled because the distribution path for C++ artifacts is a
# dedicated header tarball from include/ (described in the mainline docs
# §08-Release), not crates.io.
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
safety = []

[dependencies]

[dev-dependencies]
