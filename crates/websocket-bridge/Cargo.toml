[package]
name = "zerodds-websocket-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WebSocket (RFC 6455) complete stack set: base framing + handshake + permessage-deflate (RFC 7692) + URI + UTF-8 validator + DDS bridge — no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-websocket-bridge"
readme = "README.md"
keywords = ["dds", "websocket", "rfc6455", "rfc7692"]
categories = ["network-programming", "web-programming::websocket"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "daemon", "ring-backend"]
# The crypto backend of bridge-security (JWT verify and the rustls TLS
# provider): `ring-backend` (default) or `aws-lc` (aws-lc-rs, FIPS 140-3
# validatable). A FIPS build: `--no-default-features --features <the
# default list without ring-backend>,aws-lc`; with both, aws-lc is used.
ring-backend = ["zerodds-bridge-security?/ring-backend"]
aws-lc = ["zerodds-bridge-security?/aws-lc"]
std = ["alloc"]
alloc = []
# `daemon` enables the `zerodds-ws-bridged` binary + DDS pump module.
# Pulls in `std` and a path dep on `zerodds-dcps`. Production
# binaries are built with `--features daemon`; the library stays
# `no_std + alloc`-compatible by default.
daemon = [
    "std",
    "dep:zerodds-dcps",
    "dep:zerodds-config",
    "dep:zerodds-rtps",
    "dep:zerodds-qos",
    "dep:zerodds-types",
    "dep:zerodds-monitor",
    "dep:zerodds-observability-otlp",
    "dep:signal-hook",
    "dep:zerodds-bridge-security",
    "dep:rustls",
    "zerodds-types/dynamic",
    "dep:zerodds-idl-compose",
    "dep:zerodds-wire-codec",
    "dep:zerodds-ast-layout",
    "dep:serde_json",
]
# Cross-vendor interop tests against external WebSocket clients (Spec §10 + §12.3).
cross-vendor-tests = ["daemon"]
# C2(2): passthrough for `zerodds-dcps/rt` (`threads.*` real-time scheduling
# + CPU affinity via `zerodds-rt-linux`). Off by default; build with
# `--features rt` so a `threads.recv_policy=fifo`-style config on this
# daemon applies instead of refusing with "feature missing". Implies
# `daemon` (`zerodds-dcps` is only linked under it).
rt = ["daemon", "zerodds-dcps/rt"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps", optional = true, default-features = false, features = ["std"] }
zerodds-config = { version = "1.0.0-rc.7", path = "../config", optional = true }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps", optional = true, default-features = false, features = ["std"] }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos", optional = true, default-features = false, features = ["alloc"] }
# `qos::ExtensibilityForRepr`: the framing a DDS writer gives a binary
# frame's CDR bytes, named by its encapsulation header (DDS-XTypes 1.3
# Table 60).
zerodds-types = { version = "1.0.0-rc.7", path = "../types", optional = true, default-features = false, features = ["alloc"] }
# Cross-cutting daemon observability: §8.2 Prometheus + §8.3 OTLP spans +
# §9.2 graceful shutdown. Per-daemon wireup (no workspace edit);
# all three are enclosed by the `daemon` feature gate so that the
# `no_std` library layer stays intact.
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", optional = true, default-features = false, features = ["std", "prometheus-server"] }
zerodds-observability-otlp = { version = "1.0.0-rc.7", path = "../observability-otlp", optional = true }
signal-hook = { workspace = true, optional = true }
# Bridge security substrate (bridge spec §7.1 TLS, §7.2 auth modes,
# §7.3 topic ACL). Per-crate dep, no workspace edit.
zerodds-bridge-security = { version = "1.0.0-rc.7", path = "../bridge-security", optional = true, default-features = false, features = ["std"] }
# The JSON text frames of spec §4.3: a topic's type from its `idl_file`
# (`zerodds-idl-compose`), its samples between CDR and JSON
# (`zerodds-wire-codec`, the encodings of `zerodds-ast-layout`).
zerodds-idl-compose = { version = "1.0.0-rc.7", path = "../idl-compose", optional = true }
zerodds-wire-codec = { version = "1.0.0-rc.7", path = "../wire-codec", optional = true }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../ast-layout", optional = true }
serde_json = { version = "1", optional = true }
# rustls directly for ServerConnection wrapping around TcpStream in the
# accept loop. `bridge-security` exports the config; the wireup
# uses rustls::ServerConnection + Stream<'a>.
rustls = { workspace = true, optional = true }

[[bin]]
name = "zerodds-ws-bridged"
path = "src/bin/zerodds-ws-bridged.rs"
required-features = ["daemon"]

[dev-dependencies]
# Self-signed certs + PEM loader for the `tests/security_e2e.rs`
# §7.1 TLS handshake tests. Per-crate (no workspace dep edit).
rcgen = "0.13"
rustls-pemfile = { workspace = true }
# RS256-signed JWTs for the `auth.mode: jwt` test in `tests/security_e2e.rs`.
ring = { workspace = true }
base64 = { workspace = true, features = ["std"] }
# DDS domains of the daemon tests, leased from the host's share of the band.
zerodds-test-domains = { path = "../test-domains" }

# The contract with zerodds-dcps (internal/release/rc8-test-suite.md, "Crate
# tier"): this crate reaches zerodds-dcps only with `daemon`.
[[test]]
name = "contract_dcps"
path = "tests/contract_dcps.rs"
required-features = ["daemon"]

# The contract with zerodds-types (internal/release/rc8-test-suite.md, "Crate
# tier"): this crate reaches zerodds-types only with `daemon`.
[[test]]
name = "contract_types"
path = "tests/contract_types.rs"
required-features = ["daemon"]

# The contract with zerodds-bridge-security (internal/release/rc8-test-suite.md,
# "Crate tier"): this crate reaches zerodds-bridge-security only with `daemon`.
[[test]]
name = "contract_bridge_security"
path = "tests/contract_bridge_security.rs"
required-features = ["daemon"]

# The contracts with the crates the JSON text frames use
# (internal/release/rc8-test-suite.md, "Crate tier"): this crate reaches them
# only with `daemon`.
[[test]]
name = "contract_idl_compose"
path = "tests/contract_idl_compose.rs"
required-features = ["daemon"]

[[test]]
name = "contract_wire_codec"
path = "tests/contract_wire_codec.rs"
required-features = ["daemon"]

[[test]]
name = "contract_ast_layout"
path = "tests/contract_ast_layout.rs"
required-features = ["daemon"]
