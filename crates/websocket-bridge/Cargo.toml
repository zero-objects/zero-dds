[package]
name = "zerodds-websocket-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WebSocket (RFC 6455) complete stack set: base framing + handshake + permessage-deflate (RFC 7692) + URI + UTF-8 validator + DDS bridge — no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-websocket-bridge"
readme = "README.md"
keywords = ["dds", "websocket", "rfc6455", "rfc7692", "no-std"]
categories = ["network-programming", "web-programming::websocket", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "daemon"]
std = ["alloc"]
alloc = []
# `daemon` enables the `zerodds-ws-bridged` binary + DDS pump module.
# Pulls in `std` and a path dep on `zerodds-dcps`. Production
# binaries are built with `--features daemon`; the library stays
# `no_std + alloc`-compatible by default.
daemon = [
    "std",
    "dep:zerodds-dcps",
    "dep:zerodds-rtps",
    "dep:zerodds-qos",
    "dep:zerodds-types",
    "dep:zerodds-monitor",
    "dep:zerodds-observability-otlp",
    "dep:signal-hook",
    "dep:zerodds-bridge-security",
    "dep:rustls",
]
# Cross-vendor interop tests against external WebSocket clients (Spec §10 + §12.3).
cross-vendor-tests = ["daemon"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.6", path = "../dcps", optional = true, default-features = false, features = ["std"] }
zerodds-rtps = { version = "1.0.0-rc.6", path = "../rtps", optional = true, default-features = false, features = ["std"] }
zerodds-qos = { version = "1.0.0-rc.6", path = "../qos", optional = true, default-features = false, features = ["alloc"] }
zerodds-types = { version = "1.0.0-rc.6", path = "../types", optional = true, default-features = false, features = ["alloc"] }
# Cross-cutting daemon observability: §8.2 Prometheus + §8.3 OTLP spans +
# §9.2 graceful shutdown. Per-daemon wireup (no workspace edit);
# all three are enclosed by the `daemon` feature gate so that the
# `no_std` library layer stays intact.
zerodds-monitor = { version = "1.0.0-rc.6", path = "../monitor", optional = true, default-features = false, features = ["std", "prometheus-server"] }
zerodds-observability-otlp = { version = "1.0.0-rc.6", path = "../observability-otlp", optional = true }
signal-hook = { workspace = true, optional = true }
# Bridge security substrate (bridge spec §7.1 TLS, §7.2 auth modes,
# §7.3 topic ACL). Per-crate dep, no workspace edit.
zerodds-bridge-security = { version = "1.0.0-rc.6", path = "../bridge-security", optional = true }
# rustls directly for ServerConnection wrapping around TcpStream in the
# accept loop. `bridge-security` exports the config; the wireup
# uses rustls::ServerConnection + Stream<'a>.
rustls = { workspace = true, optional = true }

[[bin]]
name = "zerodds-ws-bridged"
path = "src/bin/zerodds-ws-bridged.rs"
required-features = ["daemon"]

[dev-dependencies]
# Self-signed certs + PEM loader for the `tests/security_e2e.rs`
# §7.1 TLS handshake tests. Per-crate (no workspace dep edit).
rcgen = "0.13"
rustls-pemfile = { workspace = true }
