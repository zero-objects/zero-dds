[package]
name = "zerodds-corba-poa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG CORBA 3.3 Part 1 §11 POA (Portable Object Adapter) — all 7 policies in all modes, POAManager state machine, active object map, ServantManager. no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-corba-poa"
readme = "README.md"
keywords = ["dds", "corba", "poa", "object-adapter"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc", "zerodds-corba-ir/std", "zerodds-corba-giop/std"]
alloc = ["zerodds-corba-ir/alloc", "zerodds-corba-giop/alloc"]

[dependencies]
zerodds-corba-ir = { version = "1.0.0-rc.7", path = "../corba-ir", default-features = false }
# `Endianness` in `Servant::dispatch_object_operation`'s signature, and
# `object_ops`'s CDR encode/decode of the six `CORBA::Object` operations
# (CORBA 3.3 Part 2 §15.4.2) it dispatches into.
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire" }
zerodds-corba-giop = { version = "1.0.0-rc.7", path = "../corba-giop", default-features = false }
