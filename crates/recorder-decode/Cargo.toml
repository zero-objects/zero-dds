[package]
name = "zerodds-recorder-decode"
# Published on crates.io as 1.0.0-rc.7.5 (GitHub #62 to #64, the recorder's
# TRANSIENT_LOCAL reader, discovery's routing answers); `version.workspace = true`
# again with RC8.
version = "1.0.0-rc.7.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Decode DDS samples to typed JSON + SQLite for zerodds-spy/-record: IDL→DynamicType type source, DynamicData→JSON, per-topic relational SQLite sink."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-recorder-decode"
readme = "README.md"
keywords = ["dds", "decode", "dynamic", "sqlite", "json"]
categories = ["network-programming", "encoding"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zerodds-types = { version = "1.0.0-rc.7.4", path = "../types" }
zerodds-ast = { version = "1.0.0-rc.7", path = "../ast" }
zerodds-idl-parse = { version = "1.0.0-rc.7", path = "../idl-parse" }
zerodds-idl-compose = { version = "1.0.0-rc.7", path = "../idl-compose" }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../ast-layout" }
serde_json = "1"
rusqlite = { workspace = true }

[dev-dependencies]
# The test modules encode samples to decode; the crate itself does not.
zerodds-wire-codec = { version = "1.0.0-rc.7.3", path = "../wire-codec" }
