[package]
name = "zerodds-transport-shm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ZeroDDS-SHM-Transport — Cross-Process Shared-Memory-Transport via POSIX shm_open/mmap, Lock-free SpSc-Ringbuffer, Crash-Recovery."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-transport-shm"
readme = "README.md"
keywords = ["dds", "shared-memory", "ipc", "transport"]
categories = ["network-programming", "memory-management"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
zerodds-rtps = { version = "1.0.0-rc.6", path = "../rtps" }
zerodds-transport = { version = "1.0.0-rc.6", path = "../transport" }
# POSIX shared-memory segment management (shm_open/mmap + Windows
# CreateFileMapping). We wrap only the primitives; the ring-buffer
# protocol on top is our own. Pinning 0.12 for the stable API.
shared_memory = "0.12"
# libc for POSIX advisory flock (race protection on owner-create).
# Transitive dep via shared_memory, explicitly pinned for stability.
libc = { workspace = true, features = ["std"] }

# Windows: LockFileEx for the owner-create race protection (the flock
# equivalent). Auto-released on handle close / process death, like flock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3"
