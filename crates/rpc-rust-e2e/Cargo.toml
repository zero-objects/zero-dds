[package]
name = "zerodds-rpc-rust-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Compiles and runs the DDS-RPC 1.0 Rust binding `zerodds-idlc generate --lang rust` writes, over a real DcpsRuntime on loopback. The gate a name comparison of crates/rpc's own tests cannot be."
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
zerodds-dcps = { path = "../dcps", version = "1.0.0-rc.7" }
zerodds-rpc = { path = "../rpc", version = "1.0.0-rc.7" }
zerodds-wire = { path = "../wire", version = "1.0.0-rc.7" }

[dev-dependencies]
# Domain leasing so this crate's own real-participant test does not
# collide with every other suite's, on the one host all of them share.
zerodds-test-domains = { path = "../test-domains", version = "1.0.0-rc.7" }
# tests/wire_bytes_match_cpp.rs generates the C++ column's header for
# the same Calculator.add call, the same way crates/rpc/tests/
# cpp_rpc_runtime.rs does, to hold the two columns' octets against each
# other.
zerodds-idl-parse = { path = "../idl-parse", version = "1.0.0-rc.7" }
zerodds-idl-lower = { path = "../idl-lower", version = "1.0.0-rc.7" }
zerodds-lang-rules = { path = "../lang-rules", version = "1.0.0-rc.7" }
zerodds-lang-render = { path = "../lang-render", version = "1.0.0-rc.7" }
# tests/wire_bytes_match_columns.rs names the Java column of the generator.
zerodds-lang-cst = { path = "../lang-cst", version = "1.0.0-rc.7" }
zerodds-ast = { path = "../ast", version = "1.0.0-rc.7" }
# tests/java_peer.rs gives a Rust participant `wire.type_lookup_encoding`.
zerodds-types = { path = "../types", version = "1.0.0-rc.7" }

[build-dependencies]
zerodds-ast = { path = "../ast", version = "1.0.0-rc.7" }
zerodds-ast-layout = { path = "../ast-layout", version = "1.0.0-rc.7" }
zerodds-idl-parse = { path = "../idl-parse", version = "1.0.0-rc.7" }
zerodds-idl-lower = { path = "../idl-lower", version = "1.0.0-rc.7" }
zerodds-lang-cst = { path = "../lang-cst", version = "1.0.0-rc.7" }
zerodds-lang-rules = { path = "../lang-rules", version = "1.0.0-rc.7" }

[lints]
workspace = true
