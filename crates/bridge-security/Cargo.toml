[package]
name = "zerodds-bridge-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared security layer for ZeroDDS bridge daemons (ws/mqtt/coap/amqp/grpc/corba): §7.1 TLS (rustls), §7.2 auth modes (none/bearer/jwt/mtls/sasl), §7.3 per-topic ACL."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-bridge-security"
readme = "README.md"
keywords = ["dds", "tls", "auth", "acl", "bridge"]
categories = ["network-programming", "authentication", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = []

[dependencies]
# §7.1 TLS — rustls 0.23 with ring backend (no aws-lc-rs dep), pure Rust.
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
# §7.2 JWT — RS256 validation via `ring` (same dep as security-pki).
ring = { workspace = true }
# Base64 for JWT header/payload/signature.
base64 = { version = "0.22", default-features = false, features = ["std"] }

[dev-dependencies]
# Self-signed test certs.
rcgen = "0.13"
