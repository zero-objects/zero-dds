[package]
name = "zerodds-bridge-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared security layer for ZeroDDS bridge daemons (ws/mqtt/coap/amqp/grpc/corba): §7.1 TLS (rustls), §7.2 auth modes (none/bearer/jwt/mtls/sasl), §7.3 per-topic ACL."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-bridge-security"
readme = "README.md"
keywords = ["dds", "tls", "auth", "acl", "bridge"]
categories = ["network-programming", "authentication", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "ring-backend"]
std = []
# Crypto primitive backend (pick one) — see lib.rs. Swaps both the JWT-RS256
# verify primitives AND the rustls TLS provider. `ring-backend` (default) or
# `aws-lc` (aws-lc-rs / AWS-LC, FIPS-140-3-validatable; implies std).
ring-backend = ["dep:ring", "rustls/ring"]
aws-lc = ["dep:aws-lc-rs", "rustls/aws_lc_rs", "std"]

[dependencies]
# §7.1 TLS — rustls 0.23. Provider follows the backend feature (ring | aws-lc-rs).
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rustls-pki-types = { workspace = true }
# §7.2 JWT — RS256 validation. Swappable: `ring` (default) or `aws-lc-rs` (FIPS).
ring = { workspace = true, optional = true }
aws-lc-rs = { version = "1", optional = true }
# Base64 for JWT header/payload/signature.
base64 = { version = "0.22", default-features = false, features = ["std"] }

[dev-dependencies]
# Self-signed test certs.
rcgen = "0.13"
