[package]
name = "zerodds-security"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDS-Security 1.2 (§9) plugin SPI for ZeroDDS: Authentication / AccessControl / Cryptographic / Logging / DataTagging trait definitions + generic-message topics + token data model."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security"
readme = "README.md"
keywords = ["dds", "security", "spi", "rtps", "no-std"]
categories = ["network-programming", "no-std", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
safety = []

[dependencies]

[dev-dependencies]
zerodds-idl-parse = { version = "1.0.0-rc.7.2", path = "../idl-parse" }
