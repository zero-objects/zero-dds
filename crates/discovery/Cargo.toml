[package]
name = "zerodds-discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DDSI-RTPS-Discovery für ZeroDDS — SPDP (§8.5.3), SEDP (§8.5.4), TypeLookup-Service (XTypes 1.3 §7.6.3.3.4), DDS-Security Builtin-Endpoints. Pure-Rust no_std + alloc."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-discovery"
readme = "README.md"
keywords = ["dds", "rtps", "discovery", "spdp", "sedp"]
categories = ["network-programming", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "metrics"]
std = ["alloc"]
alloc = []
# Hook-Points fuer zerodds-monitor-1.0 §2.4 (Discovery-Domain). Default an.
metrics = ["std", "dep:zerodds-monitor"]

[dependencies]
zerodds-rtps = { version = "0.0.0", path = "../rtps", default-features = false, features = ["alloc"] }
zerodds-types = { version = "0.0.0", path = "../types", default-features = false, features = ["alloc"] }
zerodds-qos = { version = "0.0.0", path = "../qos", default-features = false, features = ["alloc"] }
zerodds-cdr = { version = "0.0.0", path = "../cdr", default-features = false, features = ["alloc"] }
# C3.4-c: Security-Builtin-Endpoint-Slots (DCPSParticipantStatelessMessage +
# DCPSParticipantVolatileMessageSecure). Wir reimplementieren den
# CDR-Encapsulation-Wrap inline (codec.rs), damit kein Cargo-Zyklus mit
# `zerodds-security-runtime` (welches `zerodds-discovery` als dev-dep nutzt) entsteht.
zerodds-security = { version = "0.0.0", path = "../security", default-features = false, features = ["alloc"] }
# Hook-Points fuer zerodds-monitor-1.0 §2.4. Optional.
zerodds-monitor = { version = "0.0.0", path = "../monitor", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
zerodds-transport = { version = "0.0.0", path = "../transport" }
zerodds-transport-udp = { version = "0.0.0", path = "../transport-udp" }

[[example]]
name = "spdp_demo"
path = "examples/spdp_demo.rs"
required-features = ["std"]

[[example]]
name = "dump_spdp_beacon"
path = "examples/dump_spdp_beacon.rs"
required-features = ["std"]
