[package]
name = "zerodds-xrce-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDS-XRCE agent state machine: client registry, object slots, pull queues, no DDS participant of its own; `daemon` feature adds the zerodds-xrce-agentd binary wiring it to zerodds-dcps"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-xrce-agent"
readme = "README.md"
keywords = ["dds", "xrce", "agent"]
categories = ["embedded", "network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc", "zerodds-xrce/std"]
alloc = ["zerodds-xrce/alloc"]
safety = []
# `daemon` enables the `zerodds-xrce-agentd` binary: it wires this crate's
# session/object-slot state machine to `zerodds-dcps` so that XRCE clients
# reach the DDS data space. Off by default so the embeddable, no-DDS-side
# state machine (used e.g. from `no_std` bridges) never pulls in the DCPS
# stack — same split as `crates/coap-bridge`'s `daemon` feature.
daemon = [
    "std",
    "dep:zerodds-config",
    "dep:zerodds-dcps",
    "dep:zerodds-rtps",
    "dep:zerodds-qos",
    "dep:zerodds-types",
    "dep:zerodds-wire",
    "dep:zerodds-monitor",
    "dep:zerodds-observability-otlp",
    "dep:zerodds-xml",
    "dep:zerodds-sql-filter",
    "dep:signal-hook",
    "zerodds-xrce/xml-config",
]
# Real serial-port I/O for the daemon's serial transport listener (spec
# item 2). Separate from `daemon` because it pulls a hardware-facing dep
# (`serialport`) that a socket-only build (e.g. a container image with no
# TTY) does not need.
serial = ["daemon", "dep:serialport"]
# DTLS 1.2 and TLS listeners (DDS-XRCE 1.0 §11.2, §11.3): the agent
# authenticates with a certificate and the messages, the ClientKey among
# them (§8.3.2.4), travel encrypted. Separate from `daemon` because they pull
# the TLS stacks (rustls, webrtc-dtls, tokio) a deployment on a VPN does not
# need.
dtls = ["daemon", "zerodds-xrce/dtls"]
tls = ["daemon", "zerodds-xrce/tls"]

[dependencies]
zerodds-xrce = { version = "1.0.0-rc.7", path = "../xrce", default-features = false }
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps", optional = true, default-features = false, features = ["std"] }
zerodds-config = { version = "1.0.0-rc.7", path = "../config", optional = true }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps", optional = true, default-features = false, features = ["std"] }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos", optional = true, default-features = false, features = ["alloc"] }
zerodds-types = { version = "1.0.0-rc.7", path = "../types", optional = true, default-features = false, features = ["alloc"] }
# The XCDR2 reader of the binary representations (DDS-XRCE 1.0 §7.7.3.1.3).
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire", optional = true, default-features = false }
# The daemon's own CREATE-body parsing (topic name/type_name/domain_id/
# topic_ref attributes out of the XML an XRCE client sends) — a direct dep
# because `zerodds-xrce`'s `xml_config` module does not re-export the
# underlying `zerodds_xml::parse_xml_tree`/`XmlElement`.
zerodds-xml = { version = "1.0.0-rc.7", path = "../xml", optional = true, default-features = false, features = ["std"] }
# Cross-cutting daemon observability: Prometheus + OTLP + graceful shutdown,
# same as `crates/coap-bridge`'s daemon feature.
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", optional = true, default-features = false, features = ["std", "prometheus-server"] }
zerodds-observability-otlp = { version = "1.0.0-rc.7", path = "../observability-otlp", optional = true }
# READ_DATA's ReadSpecification.content_filter_expression (spec §7.7.14):
# parses and evaluates the OMG DDS 1.4 §B.2.1 filter grammar against a
# topic's SerializedTypeSupport-decoded fields.
zerodds-sql-filter = { version = "1.0.0-rc.7", path = "../sql-filter", optional = true, default-features = false, features = ["alloc"] }
signal-hook = { workspace = true, optional = true }
# Real serial-port I/O (feature `serial`) — the wire crate's own serial
# codec (`zerodds_xrce::transport_serial`) is I/O-free by design (see its
# module doc); this is where a real device gets attached to it.
# Without default features: the default `libudev` feature serves only
# `available_ports()`'s USB details, which the agent does not call — it opens
# the device it is given — and it needs the system's libudev to build.
serialport = { version = "4", optional = true, default-features = false }

[dev-dependencies]
zerodds-test-domains = { path = "../test-domains" }
zerodds-xrce-client = { path = "../xrce-client" }
# Builds real CompleteTypeObject bytes from IDL text for
# dcps_bridge.rs's SerializedTypeSupport-wiring test — the same helper
# crates/dcps's own serialized_type.rs tests use.
zerodds-wire-probe = { path = "../wire-probe" }
zerodds-types = { path = "../types", default-features = false, features = ["alloc"] }
# Certificates for the TLS and DTLS listener tests (feature `tls`, `dtls`).
rcgen = "0.13"

[[bin]]
name = "zerodds-xrce-agentd"
path = "src/bin/zerodds-xrce-agentd.rs"
required-features = ["daemon"]
