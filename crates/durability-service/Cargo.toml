[package]
name = "zerodds-durability-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Standalone DDS Durability-Service daemon (ADR 0009): ingests TRANSIENT/PERSISTENT topics over RTPS and replays them to late-joiners, surviving writer death and service restart."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-durability-service"
readme = "README.md"
keywords = ["dds", "durability", "persistence", "daemon"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# C2(2): passthrough for `zerodds-dcps/rt` (`threads.*` real-time scheduling
# + CPU affinity via `zerodds-rt-linux`). Off by default; build with
# `--features rt` so a `threads.recv_policy=fifo`-style config on this
# daemon applies instead of refusing with "feature missing".
rt = ["zerodds-dcps/rt"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps" }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos" }
zerodds-types = { version = "1.0.0-rc.7", path = "../types" }
zerodds-durability-store = { version = "1.0.0-rc.7", path = "../durability-store" }
# `wire_types::{Guid, EntityKind, TopicKind}` — deriving a discovered
# writer's keyedness from its RTPS entityKind octet (Spec §9.3.1.2).
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps" }

[dev-dependencies]
# One DDS domain per test process, host-wide (the domain number is the UDP port).
zerodds-test-domains = { path = "../test-domains" }
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps" }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos" }
zerodds-types = { version = "1.0.0-rc.7", path = "../types" }
zerodds-durability-store-sqlite = { version = "1.0.0-rc.7", path = "../durability-store-sqlite" }
zerodds-durability-store-file = { version = "1.0.0-rc.7", path = "../durability-store-file" }
