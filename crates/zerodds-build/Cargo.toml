[package]
name = "zerodds-build"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A build.rs helper for ZeroDDS IDL: one Rust module per .idl, with #include dependency tracking so cargo re-runs when a header changes."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-build"
readme = "README.md"
keywords = ["dds", "idl", "build", "codegen", "omg"]
categories = ["development-tools::build-utils"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zerodds-ast = { version = "1.0.0-rc.7.2", path = "../ast" }
zerodds-ast-core = { version = "1.0.0-rc.7.2", path = "../ast-core" }
zerodds-ast-layout = { version = "1.0.0-rc.7.2", path = "../ast-layout" }
zerodds-idl-compose = { version = "1.0.0-rc.7.2", path = "../idl-compose" }
zerodds-idl-parse = { version = "1.0.0-rc.7.2", path = "../idl-parse" }
zerodds-lang-cst = { version = "1.0.0-rc.7.2", path = "../lang-cst" }
zerodds-lang-render = { version = "1.0.0-rc.7.2", path = "../lang-render" }
zerodds-lang-rules = { version = "1.0.0-rc.7.2", path = "../lang-rules" }
zerodds-types = { version = "1.0.0-rc.7.2", path = "../types" }

[dev-dependencies]
tempfile = "3"
zerodds-wire = { version = "1.0.0-rc.7.2", path = "../wire" }
