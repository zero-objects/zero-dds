[package]
name = "zerodds-dlrl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDS Data Local Reconstruction Layer (DLRL) — DDS 1.2 §8 and Annex B"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-dlrl"
readme = "README.md"
keywords = ["dds", "dlrl", "object-cache", "data-modeling"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "dcps", "model-tags"]
std = ["alloc", "zerodds-sql-filter/std"]
alloc = []
# The run-time entities of DDS 1.2 §8.1.6 (CacheFactory, Cache,
# CacheAccess, ObjectHome, ObjectRoot, the listeners) over
# `zerodds-dcps`: one Publisher and one Subscriber per Cache, one topic,
# DataWriter and DataReader per DCPS table of the mapping, samples as
# DynamicData of a type built from the mapping's topic description.
dcps = ["std", "dep:zerodds-dcps", "dep:zerodds-types"]
# The model tags of the generation process (DDS 1.2 §8.2.2.3, an XML
# document under the DTD of §8.2.2.3.1) and the generator that applies
# them to the model description (§8.2.2.1).
model-tags = ["std", "dep:zerodds-xml"]

[dependencies]
# The object cache's sequence counter and the transaction ids are 64-bit
# atomics; thumbv7em has none. portable-atomic passes through to
# core::sync::atomic where the target has them.
portable-atomic = { version = "1.7", default-features = false, features = ["fallback"] }
# The grammar of DDS 1.2 Annex B (DLRL queries and filters) is the
# Dlrl12 grammar of the shared filter-expression parser.
zerodds-sql-filter = { version = "1.0.0-rc.7", path = "../sql-filter", default-features = false }
zerodds-dcps = { version = "1.0.0-rc.7", path = "../dcps", optional = true }
zerodds-xml = { version = "1.0.0-rc.7", path = "../xml", optional = true }
zerodds-types = { version = "1.0.0-rc.7", path = "../types", optional = true }

[dev-dependencies]
# One DDS domain per test that puts two participants on one bus.
zerodds-test-domains = { path = "../test-domains" }
# The other side of tests/fixed_dcps_model.rs: a DCPS type from IDL text,
# built without the mapping (§8.1.4.5).
zerodds-wire-probe = { path = "../wire-probe" }
# The IDL of the generic DLRL entities (idl/dds_dlrl.idl, DDS 1.2
# §8.2.1.2.1) through the IDL frontend, against the Rust items
# (tests/psm.rs).
zerodds-idl-compose = { path = "../idl-compose" }
zerodds-ast = { path = "../ast" }
zerodds-ast-core = { path = "../ast-core" }
