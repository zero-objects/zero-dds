[package]
name = "zerodds-lang-render"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Renders a language CST to text. Decides nothing: every decision sits in a rule and is therefore visible."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zerodds-lang-render"
readme = "README.md"
keywords = ["dds", "idl", "codegen"]
categories = ["compilers", "development-tools"]

[dependencies]
zerodds-lang-cst = { path = "../lang-cst", version = "1.0.0-rc.7.2" }

[lints]
workspace = true
