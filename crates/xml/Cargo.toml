[package]
name = "zerodds-xml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-xml"
readme = "README.md"
keywords = ["dds", "xml", "qos", "psm"]
categories = ["parsing", "network-programming"]
authors.workspace = true
description = "OMG DDS-XML 1.0 parser + QoS profile loader + building-block foundation for ZeroDDS."
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
# Read-only XML parser. Apache-2.0 / MIT. Pure-Rust, lightweight.
# Same dep as `crates/security-permissions/` — no second
# XML backend in the workspace.
roxmltree = { workspace = true }

# Data model for QoS profiles (DDS-XML 1.0 §7.3.2). `zerodds-xml`
# may have `zerodds-qos` as a dep (natural data-model source), but
# NOT `zerodds-dcps` (layer inversion).
zerodds-qos = { version = "1.0.0-rc.5", path = "../qos", default-features = false, features = ["alloc"] }

# XTypes-1.3 TypeObject/TypeIdentifier — XML→TypeObject bridge.
# zerodds-types does not depend on zerodds-xml — no circular edge.
zerodds-types = { version = "1.0.0-rc.5", path = "../types", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "parse_hotpaths"
harness = false
