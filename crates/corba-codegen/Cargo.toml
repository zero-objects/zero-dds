[package]
name = "zerodds-corba-codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The CORBA 3.3 Annex A.1 special types and the stub and skeleton mappings, over the common AST: which of the thirteen a model type is, and what each language PSM calls it."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-corba-codegen"
readme = "README.md"
keywords = ["dds", "corba", "idl", "codegen", "no-std"]
categories = ["development-tools", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zerodds-ast = { path = "../ast", version = "1.0.0-rc.7" }
zerodds-ast-core = { path = "../ast-core", version = "1.0.0-rc.7" }
zerodds-lang-cst = { path = "../lang-cst", version = "1.0.0-rc.7" }
zerodds-lang-render = { path = "../lang-render", version = "1.0.0-rc.7" }

[dev-dependencies]
zerodds-idl-parse = { path = "../idl-parse", version = "1.0.0-rc.7" }
zerodds-idl-lower = { path = "../idl-lower", version = "1.0.0-rc.7" }
