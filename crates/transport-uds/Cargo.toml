[package]
name = "zerodds-transport-uds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ZeroDDS-Unix-Domain-Socket-Transport — Container-IPC via SOCK_DGRAM, Abstract-Namespace-Support (Linux)."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-transport-uds"
readme = "README.md"
keywords = ["dds", "uds", "ipc", "transport", "container"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
zerodds-rtps = { version = "1.0.0-rc.7", path = "../rtps" }
zerodds-transport = { version = "1.0.0-rc.7", path = "../transport" }
# socket2 for SOCK_SEQPACKET + raw sockaddr_un construction
# (abstract namespace, macOS fallback to DGRAM).
socket2 = { workspace = true }
# libc only for sockaddr_un layout constants. shared_memory brings
# it in transitively, we declare it explicitly.
libc = { workspace = true, features = ["std"] }

[dev-dependencies]
tempfile = "3"
