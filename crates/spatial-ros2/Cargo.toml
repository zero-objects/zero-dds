[package]
name = "zerodds-spatial-ros2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "SpatialDDS <-> ROS 2 semantic mapping: converts the ZeroDDS SpatialDDS profile types to/from the ROS 2 common-interfaces messages (geometry_msgs/sensor_msgs/vision_msgs/tf2_msgs/geographic_msgs), with rmw-compatible topic + type naming."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
keywords = ["dds", "ros2", "spatial", "robotics", "rmw"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[dependencies]
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire" }
zerodds-spatial-dds = { version = "1.0.0-rc.7", path = "../spatial-dds" }

[build-dependencies]
zerodds-ast = { version = "1.0.0-rc.7", path = "../ast" }
zerodds-ast-core = { version = "1.0.0-rc.7", path = "../ast-core" }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../ast-layout" }
zerodds-idl-parse = { version = "1.0.0-rc.7", path = "../idl-parse" }
zerodds-idl-lower = { version = "1.0.0-rc.7", path = "../idl-lower" }
zerodds-lang-cst = { version = "1.0.0-rc.7", path = "../lang-cst" }
zerodds-lang-render = { version = "1.0.0-rc.7", path = "../lang-render" }
zerodds-lang-rules = { version = "1.0.0-rc.7", path = "../lang-rules" }
