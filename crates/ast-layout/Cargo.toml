[package]
name = "zerodds-ast-layout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Wire layout planning over the common AST: XCDR1/XCDR2 member plans, length codes, key holders. Computes the plan; codecs execute it."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zerodds-ast-layout"
readme = "README.md"
keywords = ["dds", "idl", "xcdr", "layout", "compiler"]
categories = ["compilers", "encoding"]

[features]
default = ["std"]
# The observer-facing cache wrapper needs a Mutex, which lives in std.
std = []

[dependencies]
zerodds-ast-core = { path = "../ast-core", version = "1.0.0-rc.7" }
zerodds-ast = { path = "../ast", version = "1.0.0-rc.7" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
