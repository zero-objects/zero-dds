[package]
name = "zerodds-ami4ccm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG AMI4CCM 1.1 (formal/2015-08-03) — asynchronous method invocation for CCM: implied-IDL transformation (§7.3 + §7.5), ReplyHandler/ExceptionHolder model (§7.4), pragma parsing (§7.7). no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-ami4ccm"
readme = "README.md"
keywords = ["dds", "corba", "ccm", "ami4ccm", "no-std"]
categories = ["network-programming", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
zerodds-idl = { version = "1.0.0-rc.3", path = "../idl" }
