[package]
name = "zerodds-idl-lower"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lowers the IDL CST into the common AST: scopes, name binding, resolution, completion by specification rule, and IDL validation."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zerodds-idl-lower"
readme = "README.md"
keywords = ["dds", "idl", "compiler", "ast"]
categories = ["compilers"]

[dependencies]
zerodds-ast = { path = "../ast", version = "1.0.0-rc.7.2" }
zerodds-ast-core = { path = "../ast-core", version = "1.0.0-rc.7.2" }
zerodds-idl-cst = { path = "../idl-cst", version = "1.0.0-rc.7.2" }
zerodds-idl-parse = { path = "../idl-parse", version = "1.0.0-rc.7.2" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
