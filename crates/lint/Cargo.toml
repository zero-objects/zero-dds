[package]
name = "zerodds-lint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Custom Lints und Projekt-Regeln fuer ZeroDDS (dds_no_panic_in_safe, dds_require_safety_comment, dds_no_dyn_in_safe, ...)"
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "zerodds-lint"
path = "src/bin/zerodds-lint.rs"

[features]
default = []

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
cargo_metadata = "0.18"
walkdir = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
