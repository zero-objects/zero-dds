[package]
name = "zerodds-idl-csharp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idl-csharp"
readme = "README.md"
keywords = ["dds", "idl", "codegen", "csharp"]
categories = ["development-tools"]
authors.workspace = true
description = "OMG IDL4 → C# 10 code generator (idl4-csharp-1.0) for ZeroDDS."
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (internal/safety-flag-drift.md)
default = ["std"]
std = []

[dependencies]
zerodds-idl = { version = "1.0.0-rc.7", path = "../idl" }
zerodds-rpc = { version = "1.0.0-rc.7", path = "../rpc" }

[dev-dependencies]
insta = { workspace = true }
tempfile = "3"
zerodds-dotnet-build-lock = { path = "../dotnet-build-lock" }
# #24 cross-binding parity: assert the C#-emitted TypeObject bytes yield the
# same TypeIdentifier hash that `idl-rust` advertises for the same IDL.
zerodds-idl-rust = { version = "1.0.0-rc.7", path = "../idl-rust" }
zerodds-foundation = { version = "1.0.0-rc.7", path = "../foundation" }
