[package]
name = "zerodds-durability-service-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Standalone ZeroDDS Durability-Service daemon binary (zerodds-durability-svc): one process per domain, pluggable store adapter (sqlite/file/lakehouse), auto-discovery of TRANSIENT/PERSISTENT topics."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-durability-service-bin"
readme = "README.md"
keywords = ["dds", "durability", "daemon", "persistence"]
categories = ["network-programming", "command-line-utilities"]
# Source-only (NOT on crates.io): the durability-svc daemon transitively links
# the *system* libduckdb (via the lakehouse adapter), so it cannot build in the
# clean `cargo publish` verify env, cannot ship as a portable cargo-dist
# archive, and the `bundled` source build was dropped (OOM/+1h). The DuckDB
# lakehouse is an optional backend; build this daemon from the repo with
# libduckdb present. The self-contained durability paths stay on crates.io.
publish = false

[package.metadata.dist]
dist = false

[lints]
workspace = true

[[bin]]
name = "zerodds-durability-svc"
path = "src/main.rs"

[features]
# sqlite + file are always-compiled cold-store backends (pure Rust, no native
# lib). `lakehouse` is the OPT-IN DuckDB backend: it pulls in the lakehouse
# adapter and its system `libduckdb` link, so a default build of the daemon
# needs no DuckDB. Build with `--features lakehouse` to enable it.
default = []
lakehouse = [
    "dep:zerodds-durability-store-lakehouse",
    "zerodds-durability-store-lakehouse/duckdb",
]

[dependencies]
zerodds-durability-service = { version = "1.0.0-rc.4", path = "../durability-service" }
zerodds-durability-store = { version = "1.0.0-rc.4", path = "../durability-store" }
zerodds-durability-store-sqlite = { version = "1.0.0-rc.4", path = "../durability-store-sqlite" }
zerodds-durability-store-file = { version = "1.0.0-rc.4", path = "../durability-store-file" }
zerodds-durability-store-lakehouse = { version = "1.0.0-rc.4", path = "../durability-store-lakehouse", optional = true }
ctrlc = { workspace = true }

[dev-dependencies]
zerodds-dcps = { version = "1.0.0-rc.4", path = "../dcps" }
zerodds-qos = { version = "1.0.0-rc.4", path = "../qos" }
