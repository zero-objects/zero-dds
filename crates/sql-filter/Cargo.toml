[package]
name = "zerodds-sql-filter"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG DDS 1.4 §B.2.1 ContentFilteredTopic filter-expression parser + evaluator (SQL-92 subset with %N parameters, BETWEEN, LIKE)."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-sql-filter"
readme = "README.md"
keywords = ["dds", "content-filter", "sql-92", "parser", "no-std"]
categories = ["parser-implementations", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/architecture/04_safety_by_architecture.md §3)
default = ["std"]
std = ["alloc"]
alloc = []
