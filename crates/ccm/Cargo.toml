[package]
name = "zerodds-ccm"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG CCM 4.0 (formal/06-04-01) §6 Component Model — Equivalent-IDL-Transformation (Component/Home/EventType), Components::* Core-Types, Lightweight-CCM-Profile (§13). no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-ccm"
readme = "README.md"
keywords = ["dds", "corba", "ccm", "lightweight-ccm"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
zerodds-ast = { version = "1.0.0-rc.7.2", path = "../ast" }
zerodds-ast-core = { version = "1.0.0-rc.7.2", path = "../ast-core" }

[dev-dependencies]
zerodds-idl-parse = { path = "../idl-parse" }
zerodds-idl-lower = { path = "../idl-lower" }
