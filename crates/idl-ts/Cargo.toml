[package]
name = "zerodds-idl-ts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idl-ts"
readme = "README.md"
keywords = ["dds", "idl", "codegen", "typescript"]
categories = ["development-tools"]
authors.workspace = true
description = "OMG IDL4 → TypeScript code generator (browser + Node.js targets) for ZeroDDS."
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
zerodds-idl = { version = "1.0.0-rc.7", path = "../idl" }

[dev-dependencies]
insta = { workspace = true }
tempfile = "3"
# TS TypeObject post-pass (`render_ts`) lives in the shared compose crate, not
# in this emitter. The compile-check test appends it to the emitter output to
# prove the *combined* CLI output (`zerodds-idlc generate --ts`) type-checks —
# that combination is where the P0-8 enum/bitmask redeclaration surfaced.
# Dev-only; idl-compose does not depend on idl-ts, so there is no cycle.
zerodds-idl-compose = { path = "../idl-compose" }

