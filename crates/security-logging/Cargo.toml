[package]
name = "zerodds-security-logging"
# Published on crates.io with the other crates GitHub #33 needs, ahead
# of RC8; `version.workspace = true` again once they are out.
version = "1.0.0-rc.7.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Security logging backends for DDS-Security 1.2 §9.6/§10.6: stderr + JSON-lines + RFC-5424 UDP syslog + FanOut."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-logging"
readme = "README.md"
keywords = ["dds", "security", "logging", "syslog", "audit"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (docs/architecture/04_safety_by_architecture.md §3)
default = ["std"]
std = []

[dependencies]
zerodds-security = { version = "1.0.0-rc.7.2", path = "../security" }
