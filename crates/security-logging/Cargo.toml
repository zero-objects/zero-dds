[package]
name = "zerodds-security-logging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Security logging backends for DDS-Security 1.2 §9.6/§10.6: stderr + JSON-lines + RFC-5424 UDP syslog + FanOut."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-logging"
readme = "README.md"
keywords = ["dds", "security", "logging", "syslog", "audit"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

# The merge lane also runs the crate with `time-service` (the audit sink of
# the OMG Time Service administration, src/time_audit.rs).
[package.metadata.crate-tier]
feature-runs = ["time-service"]

[features]
safety = []  # empty marker for safe-profile lints (docs/architecture/04_safety_by_architecture.md §3)
default = ["std"]
std = []
# `JsonLinesLoggingPlugin` as the `AuditSink` of an administered OMG Time
# Service (Time Service 1.1 App. B.1), module `time_audit`.
time-service = ["std", "dep:zerodds-time-service"]

[dependencies]
zerodds-security = { version = "1.0.0-rc.7", path = "../security" }
zerodds-time-service = { version = "1.0.0-rc.7", path = "../time-service", default-features = false, features = ["std"], optional = true }
