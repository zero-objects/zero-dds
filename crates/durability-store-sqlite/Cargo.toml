[package]
name = "zerodds-durability-store-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "sqlite-WAL cold adapter for the ZeroDDS Durability-Service: ACID PERSISTENT storage, the default backend. Implements zerodds-durability-store::DurabilityStore."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-durability-store-sqlite"
readme = "README.md"
keywords = ["dds", "durability", "persistence", "sqlite"]
categories = ["network-programming", "database"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
zerodds-durability-store = { version = "1.0.0-rc.7", path = "../durability-store" }
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos" }
rusqlite = { workspace = true }

[dev-dependencies]
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos" }
