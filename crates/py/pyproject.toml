[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "zerodds"
# Maturin liest die Version aus crates/py/Cargo.toml (= workspace
# Cargo.toml ueber version.workspace = true), damit PyPI- und
# Rust-Crate-Version garantiert synchron sind.
dynamic = ["version"]
description = "Python bindings for ZeroDDS — pure-Rust DDS 1.4 / RTPS 2.5 / XTypes 1.3 implementation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0 OR MIT" }
authors = [
    { name = "Sandra Kessler" },
]
keywords = ["dds", "rtps", "middleware", "pubsub", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 4 - Beta",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://zerodds.org"
Documentation = "https://zerodds.org/docs/"
Repository = "https://github.com/zero-objects/zero-dds"
Issues = "https://github.com/zero-objects/zero-dds/issues"
Changelog = "https://github.com/zero-objects/zero-dds/blob/main/crates/py/CHANGELOG.md"

[tool.maturin]
# Cargo-Paket-Name ist `zerodds-py`, aber der Python-Extension-Module heisst
# `zerodds_py` (via #[pymodule]-Name im ffi.rs).
features = ["extension-module"]
# Das `zerodds`-Python-Package liegt in python/ und re-exportiert aus
# _core (= der Rust cdylib).
python-source = "python"
module-name = "zerodds._core"
