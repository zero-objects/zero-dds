[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "zerodds"
# Maturin reads the version from crates/py/Cargo.toml (= workspace
# Cargo.toml via version.workspace = true), so that the PyPI and
# Rust crate versions are guaranteed to be in sync.
#
# NOTE: this only works for SemVer versions that are also valid PEP 440.
# `1.0.0-rc.3.1` (a *dotted* SemVer prerelease) is NOT representable in
# PEP 440, so maturin cannot build a wheel for it — the rc.3.1 cycle skips
# PyPI (the pyo3 0.29 migration ships on crates.io as zerodds-py 1.0.0-rc.3.1
# and reaches PyPI with the next PEP-440-valid release, e.g. 1.0.0-rc.4 →
# 1.0.0rc4). A static `version = "..."` here does NOT help: maturin still
# parses the Cargo.toml version for metadata and fails before applying it.
dynamic = ["version"]
description = "Python bindings for ZeroDDS — pure-Rust DDS 1.4 / RTPS 2.5 / XTypes 1.3 implementation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0 OR MIT" }
authors = [
    { name = "Sandra Kessler" },
]
keywords = ["dds", "rtps", "middleware", "pubsub", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 4 - Beta",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://zerodds.org"
Documentation = "https://zerodds.org/docs/"
Repository = "https://github.com/zero-objects/zero-dds"
Issues = "https://github.com/zero-objects/zero-dds/issues"
Changelog = "https://github.com/zero-objects/zero-dds/blob/main/crates/py/CHANGELOG.md"

[tool.maturin]
# The Cargo package name is `zerodds-py`, but the Python extension module is
# named `zerodds_py` (via the #[pymodule] name in ffi.rs).
features = ["extension-module"]
# The `zerodds` Python package lives in python/ and re-exports from
# _core (= the Rust cdylib).
python-source = "python"
module-name = "zerodds._core"
