[package]
name = "zerodds-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for the ZeroDDS DCPS API"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-py"
readme = "README.md"
keywords = ["dds", "python", "pyo3", "binding"]
categories = ["network-programming", "external-ffi-bindings"]
publish = true

[lints]
workspace = true

[lib]
name = "zerodds_py"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# pyo3 ist opt-in: ohne das Feature kompiliert das Crate als reines
# Platzhalter-Lib (fuer Workspace-Checks ohne Python-Headers).
# Mit `--features extension-module` (oder dem maturin-Default)
# entsteht der Python-Extension-Module.
default = []
std = ["alloc"]
alloc = []
safety = []
extension-module = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.1", path = "../dcps" }
zerodds-qos = { version = "1.0.0-rc.1", path = "../qos" }
pyo3 = { version = "0.24", features = ["abi3-py38"], optional = true }

[dev-dependencies]
