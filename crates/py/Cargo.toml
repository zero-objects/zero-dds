[package]
name = "zerodds-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for the ZeroDDS DCPS API"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-py"
readme = "README.md"
keywords = ["dds", "python", "pyo3", "binding"]
categories = ["network-programming", "external-ffi-bindings"]
publish = true

[lints]
workspace = true

[lib]
name = "zerodds_py"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# pyo3 is opt-in: without the feature the crate compiles as a pure
# placeholder lib (for workspace checks without Python headers).
# With `--features extension-module` (or the maturin default)
# the Python extension module is produced.
default = []
std = ["alloc"]
alloc = []
safety = []
extension-module = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.3.1", path = "../dcps" }
zerodds-qos = { version = "1.0.0-rc.3.1", path = "../qos" }
pyo3 = { version = "0.29", features = ["abi3-py38"], optional = true }

[dev-dependencies]
