[package]
name = "zerodds-py"
# Pinned (not workspace `version.workspace = true`) because maturin parses this
# version into PEP 440, and the workspace SemVer `1.0.0-rc.3.1` (dotted
# prerelease) is not PEP-440-representable. `1.0.0-rc.3` → maturin `1.0.0rc3`
# on PyPI (rc3 was never on PyPI — natural rc2→rc3 step, carries all rc3+rc3.1
# changes incl. the pyo3 0.29 migration). Bump in lockstep with the workspace
# on the next PEP-440-valid release (e.g. 1.0.0-rc.4) and consider restoring
# `version.workspace = true`.
version = "1.0.0-rc.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PyO3 bindings for the ZeroDDS DCPS API"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-py"
readme = "README.md"
keywords = ["dds", "python", "pyo3", "binding"]
categories = ["network-programming", "external-ffi-bindings"]
publish = true

[lints]
workspace = true

[lib]
name = "zerodds_py"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
# pyo3 is opt-in: without the feature the crate compiles as a pure
# placeholder lib (for workspace checks without Python headers).
# With `--features extension-module` (or the maturin default)
# the Python extension module is produced.
default = []
std = ["alloc"]
alloc = []
safety = []
extension-module = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.3.1", path = "../dcps" }
zerodds-qos = { version = "1.0.0-rc.3.1", path = "../qos" }
pyo3 = { version = "0.29", features = ["abi3-py38"], optional = true }

[dev-dependencies]
