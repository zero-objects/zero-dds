[package]
name = "zerodds-amqp-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OASIS AMQP 1.0 Wire-Codec — no_std + alloc Type-System + Frame-Format + Performatives + Message-Sections + Codec-/Codec-Lite-Profile-Marker."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-amqp-bridge"
readme = "README.md"
keywords = ["dds", "amqp", "amqp-1-0", "oasis", "no-std"]
categories = ["network-programming", "encoding", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

# DDS-AMQP 1.0 §2.4 — Codec-Lite-Profile marker (strict subset of the
# Codec profile, only primitives + `data` body section). Compound types
# (list/map/array beyond data) are out of scope in the Lite profile. The
# feature does not affect the code path, only the conformance claim via
# `codec_profile::active_profile`.
codec-lite = []

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "decode_hotpaths"
harness = false
