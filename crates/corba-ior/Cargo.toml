[package]
name = "zerodds-corba-ior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG CORBA 3.3 Part 2 §13.6 — full IOR stack: IOR struct, all standard profile tags incl. IIOP ProfileBody, all 32 standard TaggedComponents incl. CSIv2 CompoundSecMechList, stringified IOR (IOR:hex), corbaloc:/corbaname: URL parser. no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-corba-ior"
readme = "README.md"
keywords = ["dds", "corba", "ior", "iiop"]
categories = ["network-programming"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc", "zerodds-corba-csiv2/std", "zerodds-corba-iiop/std"]
alloc = ["zerodds-corba-csiv2/alloc", "zerodds-corba-iiop/alloc"]

[dependencies]
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire" }
zerodds-corba-csiv2 = { version = "1.0.0-rc.7", path = "../corba-csiv2", default-features = false }
zerodds-corba-iiop = { version = "1.0.0-rc.7", path = "../corba-iiop", default-features = false }
