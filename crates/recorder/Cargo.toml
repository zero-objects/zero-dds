[package]
name = "zerodds-recorder"
# Published on crates.io as 1.0.0-rc.7.5 (GitHub #62 to #64, the recorder's
# TRANSIENT_LOCAL reader, discovery's routing answers); `version.workspace = true`
# again with RC8.
version = "1.0.0-rc.7.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic record/replay service for DDS sessions (.zddsrec v1.0): header-once wire format + RecordWriter + RecordReader + RecordingSession."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-recorder"
readme = "README.md"
keywords = ["dds", "recording", "replay", "session", "capture"]
categories = ["network-programming", "encoding"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []
safety = []

[dependencies]

[dev-dependencies]
