[package]
name = "zerodds-rtps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DDSI-RTPS 2.5 wire stack for ZeroDDS — submessages, writer/reader state machines, reliable + fragmentation, inline QoS, ParameterList, BuiltinTopicData. Pure-Rust no_std + alloc."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-rtps"
readme = "README.md"
keywords = ["dds", "rtps", "wire-protocol", "no-std"]
categories = ["network-programming", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (internal/safety-flag-drift.md)
default = ["std", "metrics"]
std = ["alloc", "zerodds-foundation/std"]
alloc = []
# PDE Reality Inspector Hook-Up — Tap-Dispatch im RTPS-HistoryCache.
# Default OFF (R-034): production builds contain no tap code.
inspect = ["dep:zerodds-inspect-endpoint", "zerodds-inspect-endpoint/inspect"]
# zerodds-monitor hook points (zerodds-monitor-1.1 §2.2). Default on;
# no_std builds (`default-features = false, features = ["alloc"]`)
# disable the feature and fall back to no-op counter stubs.
metrics = ["std", "dep:zerodds-monitor"]

[dependencies]
zerodds-qos = { version = "1.0.0-rc.7", path = "../qos", default-features = false, features = ["alloc"] }
zerodds-foundation = { version = "1.0.0-rc.7", path = "../foundation", default-features = false, features = ["alloc"] }
# F-TYPES-3 wire-up: PublicationBuiltinTopicData / SubscriptionBuiltinTopicData
# carry an optional `TypeIdentifier` (XTypes §7.3.4.2) so that
# reader-writer matching can become XTypes-aware.
zerodds-types = { version = "1.0.0-rc.7", path = "../types", default-features = false, features = ["alloc"] }
zerodds-wire = { version = "1.0.0-rc.7", path = "../wire" }
# Inspect-endpoint tap hooks (Reality Inspector). Optional.
zerodds-inspect-endpoint = { version = "1.0.0-rc.7", path = "../inspect-endpoint", optional = true }
# Hook points for zerodds-monitor-1.1 §2.2. Optional.
zerodds-monitor = { version = "1.0.0-rc.7", path = "../monitor", optional = true, default-features = false, features = ["std"] }
# portable-atomic: polyfill for 64-bit atomics on Cortex-M (thumbv7em
# has no native AtomicI64/AtomicU64). On x86_64/aarch64 pass-through
# to native core::sync::atomic via the `fallback` mechanism.
portable-atomic = { version = "1.7", default-features = false, features = ["fallback"] }

[dev-dependencies]
# `tests/dialect_no_drift.rs` only. `RtpsDialect` (discovery behaviour) and
# `zerodds_ast_layout::Dialect` (wire format) are deliberately two lists —
# an implementation can occupy an axis in one and none in the other — so the
# drift between their vendor spellings and versions needs a test rather than
# a merge. A dev-dependency keeps the check next to the code without putting
# the AST/IDL layer into this crate's dependency graph.
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../ast-layout" }
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "writer_dispatch"
harness = false

[[bench]]
name = "decode_hotpaths"
harness = false
