[package]
name = "zerodds-security-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "AES-GCM / HMAC `CryptographicPlugin` fuer DDS-Security 1.1 §8.5: AES-128-GCM + AES-256-GCM + HMAC-SHA256 + Receiver-Specific-MACs + HW-Capabilities-Detection."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-security-crypto"
readme = "README.md"
keywords = ["dds", "security", "aes-gcm", "hmac", "cryptographic-plugin"]
categories = ["network-programming", "cryptography"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std", "metrics"]
std = []
# Hook-Points fuer zerodds-monitor-1.0 §2.5 (Security-Domain). Default an.
metrics = ["std", "dep:zerodds-monitor"]

[dependencies]
zerodds-security = { version = "0.0.0", path = "../security" }
# AEAD + HMAC-Primitives. ISC. Wird bereits transitiv von
# `zerodds-security-pki` (rustls-webpki) gezogen — kein zusaetzlicher
# Fussabdruck.
ring = "0.17"
# Hook-Points fuer zerodds-monitor-1.0 §2.5. Optional.
zerodds-monitor = { version = "0.0.0", path = "../monitor", optional = true, default-features = false, features = ["std"] }
