[package]
name = "zerodds-opcua-uacp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "OPC-UA Connection Protocol (UACP, Part 6 §7.1): the opc.tcp message framing (Hello/Acknowledge/Error + message chunk + sequence headers) — the wire foundation for an OPC-UA Client/Server stack. Pure-Rust no_std + alloc."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-opcua-uacp"
readme = "README.md"
keywords = ["opcua", "uacp", "opc-tcp", "no-std"]
categories = ["network-programming", "encoding", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc", "zerodds-opcua-pubsub/std", "zerodds-opcua-gateway/std"]
alloc = ["zerodds-opcua-pubsub/alloc", "zerodds-opcua-gateway/alloc"]
# SecureChannel crypto (Part 6 §6.7 secured SecurityPolicies). no_std-capable
# (RustCrypto), independent of `std`.
crypto = ["dep:aes", "dep:cbc", "dep:hmac", "dep:sha2", "dep:rsa", "dep:sha1"]

[dependencies]
# Reuses the OPC-UA Part-6 binary codec (UaReader/UaWriter) from the PubSub
# crate — the same encoding the Client/Server services use. (The codec may be
# extracted to a shared `opcua-binary` crate later.)
zerodds-opcua-pubsub = { version = "1.0.0-rc.4", path = "../opcua-pubsub", default-features = false }
# OPC-UA type model (NodeId/ExtensionObject/Guid/…) — same types the codec
# encodes; the Client/Server service messages reference them.
zerodds-opcua-gateway = { version = "1.0.0-rc.4", path = "../opcua-gateway", default-features = false }

# SecureChannel crypto (Feature `crypto`). RustCrypto, no_std + alloc.
aes = { version = "0.8", default-features = false, optional = true }
cbc = { version = "0.1", default-features = false, features = ["alloc", "block-padding"], optional = true }
hmac = { version = "0.12", default-features = false, optional = true }
# `oid` gives Sha256 the AssociatedOid needed by RSA-PKCS#1-v1.5 (DigestInfo).
sha2 = { version = "0.10", default-features = false, features = ["oid"], optional = true }
sha1 = { version = "0.10", default-features = false, optional = true }
rsa = { version = "0.9", default-features = false, optional = true }
