[package]
name = "zerodds-corba-cosnaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG CosNaming 1.3 (formal/2004-10-03) — voller NamingService: NamingContext + NamingContextExt In-Memory-Impl, alle 5 Exception-Klassen, Stringified-Name + corbaname-URL-Unterstuetzung. no_std + alloc."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-corba-cosnaming"
readme = "README.md"
keywords = ["dds", "corba", "cosnaming", "naming", "no-std"]
categories = ["network-programming", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
zerodds-cdr = { version = "1.0.0-rc.1", path = "../cdr" }
zerodds-corba-ior = { version = "1.0.0-rc.1", path = "../corba-ior" }
