[package]
name = "zerodds-cdr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "XCDR1/XCDR2 encoder/decoder + KeyHash + PL_CDR1 helpers. Implements OMG XTypes 1.3 §7.4 wire format. Pure-Rust no_std + alloc."
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-cdr"
readme = "README.md"
keywords = ["dds", "cdr", "xcdr2", "wire-format", "no-std"]
categories = ["network-programming", "encoding", "no-std"]
publish = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
safety = []  # empty marker for safe-profile lints (internal/safety-flag-drift.md)
default = ["std"]
std = ["alloc"]
alloc = []
# Optional bridge to serde — adds From<T: Serialize> and From<&[u8]> for
# T: DeserializeOwned via JSON-like wrapper. Pull-in `serde` + `serde_json`.
# Spec: zerodds-xcdr2-rust §11.3.
serde-bridge = ["dep:serde", "dep:serde_json", "std"]

[dependencies]
# KeyHash computation (XTypes 1.3 §7.6.8 Step 5.2 — MD5 fallback when
# KeyHolder max_size > 16 byte). Foundation provides pure-Rust no_std MD5.
zerodds-foundation = { version = "1.0.0-rc.6", path = "../foundation", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "encode_decode_hotpaths"
harness = false
