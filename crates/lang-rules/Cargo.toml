[package]
name = "zerodds-lang-rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Maps the common AST onto the language CSTs through rules that are data, not code: seesaw v2 rule specifications, comparable and checkable."
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/zerodds-lang-rules"
readme = "README.md"
keywords = ["dds", "idl", "codegen", "xcdr"]
categories = ["compilers", "development-tools"]

[dependencies]
zerodds-ast = { path = "../ast", version = "1.0.0-rc.7" }
zerodds-ast-core = { path = "../ast-core", version = "1.0.0-rc.7" }
zerodds-lang-cst = { path = "../lang-cst", version = "1.0.0-rc.7" }
zerodds-lang-render = { path = "../lang-render", version = "1.0.0-rc.7" }
zerodds-ast-layout = { path = "../ast-layout", version = "1.0.0-rc.7" }
# The HASH of DDS-RPC 1.0 §7.5.1.1.2, which decides a union's case
# labels. The same function `crates/rpc/src/rpc_hash.rs` calls, so the
# generator and the runtime cannot compute two different labels for one
# operation.
zerodds-types = { path = "../types", version = "1.0.0-rc.7" }
# The positive, NAC-free rule layer, released. A version dependency
# rather than a path: a path built only on the machine that wrote it,
# which is not a dependency, it is a local setting.
seesaw-tgg = "2.0.0"
serde_json = "1"

[dev-dependencies]
serde_json = "1"
zerodds-idl-compose = { path = "../idl-compose", version = "1.0.0-rc.7" }
zerodds-idl-parse = { path = "../idl-parse", version = "1.0.0-rc.7" }
zerodds-idl-lower = { path = "../idl-lower", version = "1.0.0-rc.7" }
zerodds-wire = { path = "../wire", version = "1.0.0-rc.7" }

[lints]
workspace = true
