# Toolchain pinning.
#
# Bootstrap and proof era: stable Rust 1.88.0, see
# 04_safety_by_architecture.md §5.
# In the expansion era (Track B) this is switched to a Ferrocene
# channel. The switch is isolated as a 1-line config change in this
# file.
#
# ### Why 1.88.0?
#
# 1.88.0 is the rustc version on which **Ferrocene 25.08.0** is based
# (qualified ISO 26262 ASIL-D / IEC 61508 SIL-3 / IEC 62304). This
# keeps the Track B switch a 1-line change; no backward
# MSRV migration needed.
#
# The previous pin was 1.85 (chosen before the Ferrocene 25.05 release) —
# upstream crates (`home@0.5.12`, `icu_*@2.2.0`) have since raised MSRV
# to 1.86/1.88, hence the bump to the nearest
# Ferrocene-aligned channel.
#
# ### Ferrocene release map (as of 2026-05)
#
# Source: https://public-docs.ferrocene.dev/main/release-notes/
#
# | Ferrocene | rustc          | Status                  |
# |-----------|----------------|-------------------------|
# | 26.02.0   | 1.91 + 1.92    | qualified (latest)      |
# | 25.11.0   | 1.89 + 1.90    | qualified               |
# | 25.08.0   | 1.87 + **1.88**| qualified ← us          |
# | 25.05.0   | 1.86           | qualified               |
# | 25.02.0   | 1.82 + 1.83    | qualified               |
# | 24.11.0   | older          | qualified (LTS-style)   |
#
# ### Ferrocene 25.08.0 — qualified compilation targets
#
# Source: https://public-docs.ferrocene.dev/main/user-manual/targets/
#
# **Qualified (ISO 26262 ASIL-D / IEC 61508 SIL-3 / IEC 62304):**
#   * `aarch64-unknown-none`        — Armv8-A bare-metal hard-float
#   * `aarch64-unknown-linux-gnu`   — Armv8-A Linux glibc (Host)
#   * `aarch64-rhivos2-linux-gnu`   — Armv8-A RHIVOS 2 Linux glibc
#   * `aarch64-unknown-nto-qnx710`  — Armv8-A QNX Neutrino 7.1
#   * `thumbv7em-none-eabi`         — Armv7E-M bare-metal soft-float
#   * `thumbv7em-none-eabihf`       — Armv7E-M bare-metal hard-float
#   * `x86_64-unknown-linux-gnu`    — x86-64 Linux glibc (Host)
#   * `x86_64-pc-nto-qnx710`        — x86-64 QNX Neutrino 7.1
#
# **Quality Managed (host-only, not safety-certified):**
#   * `aarch64-apple-darwin`        — Apple Silicon macOS (dev hosts)
#
# The ZeroDDS target list below contains only those we actively
# build / test against. The `rt-linux` crate (RT scheduler) is built on x86_64+aarch64
# Linux, the `no-std` smoke test on thumbv7em-none-eabihf, the
# workspace default is x86_64-unknown-linux-gnu.

[toolchain]
channel = "1.88.0"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools-preview"]
targets = [
    # Qualified Linux hosts (Ferrocene 25.08.0).
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    # Qualified embedded — no-std smoke test + future embedded builds.
    "thumbv7em-none-eabihf",
]
# Minimal profile — do not sync rust-docs/rust-analyzer/etc. as well.
# Saves ~30 s per job in CI (the image preinstalls exactly this
# toolchain with an identical profile, hence no rustup resync
# on the first `rustc --version` call). Local dev setups that
# need rust-docs offline can load them with
# `rustup component add rust-docs`.
profile = "minimal"
