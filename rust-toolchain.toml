# Toolchain pinning.
#
# Bootstrap and proof era: stable Rust 1.97.1, see
# 04_safety_by_architecture.md §5.
# In the expansion era (Track B) this is switched to a Ferrocene
# channel. The switch is isolated as a 1-line config change in this
# file.
#
# ### Why 1.97.1?
#
# 1.97.1 is the rustc version on which **Ferrocene 26.08** is based
# (qualified ISO 26262 ASIL D / IEC 61508 SIL 3 / IEC 62304 Class C).
# Branch `release/1.97` of github.com/ferrocene/ferrocene carries
# `src/version` 1.97.1 and `ferrocene/version` 26.08.1. This keeps the
# Track B switch a 1-line change; no backward MSRV migration needed.
#
# ### Ferrocene release map
#
# Source: the release notes in `ferrocene/doc/release-notes/src/` on
# branch `release/1.97` (https://public-docs.ferrocene.dev/main/release-notes/).
# Each release contains the upstream Rust changes of the listed range.
#
# | Ferrocene | rustc           |
# |-----------|-----------------|
# | 26.08.0   | 1.96.0 – 1.97.1 | ← us
# | 26.05.0   | 1.93.0 – 1.95.0 |
# | 26.02.0   | 1.91.0 – 1.92.0 |
# | 25.11.0   | 1.89.0 – 1.90.0 |
# | 25.08.0   | 1.87.0 – 1.88.0 |
#
# ### Ferrocene 26.08 — compilation targets
#
# Source: `ferrocene/doc/user-manual/src/targets/index.rst` and
# `ferrocene/doc/release-notes/src/26.08.0.rst` on branch `release/1.97`
# (https://public-docs.ferrocene.dev/main/user-manual/targets/).
#
# **Qualified (ISO 26262 ASIL D / IEC 61508 SIL 3 / IEC 62304 Class C):**
#   * `x86_64-unknown-linux-gnu`    — x86-64 Linux glibc (host platform)
#   * `aarch64-unknown-none`        — Armv8-A bare-metal  ┐ only when
#   * `armv7r-none-eabihf`          — Armv7-R bare-metal  │ cross-compiled
#   * `thumbv7em-none-eabi`         — Armv7E-M soft-float │ from
#   * `thumbv7em-none-eabihf`       — Armv7E-M hard-float ┘ x86_64-unknown-linux-gnu
#   * `aarch64-unknown-qnx`         — Armv8-A QNX
#   * `x86_64-pc-qnx`               — x86-64 QNX
#
# **Quality managed (production use, not qualified):**
#   * `aarch64-apple-darwin`        — Apple Silicon macOS (dev hosts)
#
# **Supported only:** `x86_64-pc-windows-msvc` among others.
#
# `aarch64-unknown-linux-gnu` is not in the Ferrocene 26.08 target list
# (neither qualified, quality managed nor supported). It stays in the
# list below because ZeroDDS builds for it with the upstream toolchain.
#
# The ZeroDDS target list below contains only those we actively
# build / test against. The `rt-linux` crate (RT scheduler) is built on x86_64+aarch64
# Linux, the `no-std` smoke test on thumbv7em-none-eabihf, the
# workspace default is x86_64-unknown-linux-gnu.

[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools-preview"]
targets = [
    # Ferrocene 26.08 qualified host.
    "x86_64-unknown-linux-gnu",
    # Not a Ferrocene 26.08 target; built with the upstream toolchain
    # (rt-linux, aarch64 cross build in CI).
    "aarch64-unknown-linux-gnu",
    # Qualified embedded (cross from x86_64 Linux) — no-std smoke test
    # + future embedded builds.
    "thumbv7em-none-eabihf",
]
# Minimal profile — do not sync rust-docs/rust-analyzer/etc. as well.
# Saves ~30 s per job in CI (the image preinstalls exactly this
# toolchain with an identical profile, hence no rustup resync
# on the first `rustc --version` call). Local dev setups that
# need rust-docs offline can load them with
# `rustup component add rust-docs`.
profile = "minimal"
