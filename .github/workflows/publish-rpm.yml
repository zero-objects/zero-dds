# cargo-dist publish-job for Fedora/RHEL .rpm packages.
# Spec: zerodds-deployment-1.0.md §2.2.2.
name: publish-rpm
on:
  workflow_call:
    inputs:
      source_ref:
        description: "Immutable release source commit selected by the caller"
        required: false
        type: string
        default: ""
      version:
        description: "Release version without the leading v (e.g. 1.0.0-rc.7), derived from the tag by release.yml"
        required: true
        type: string

# `shell: bash` runs a step with `-eo pipefail`; the default is `bash -e`,
# under which `cmd | tee log` reports tee's status and a failing cmd passes.
defaults:
  run:
    shell: bash

jobs:
  build-rpm:
    name: Build .rpm (${{ matrix.target }})
    # Each architecture builds natively on a runner of its own: Fedora's
    # aarch64 cross gcc has no glibc to link against, and ring-0.17 passed
    # -mbranch-protection to the x86_64 gcc.
    runs-on: ${{ matrix.runner }}
    container: fedora:40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-22.04
          - target: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install build deps
        # Fedora 40 ships rust 1.78; ZeroDDS needs 1.97+ → rustup.
        run: |
          dnf install -y rpm-build rpmdevtools pkgconfig \
              openssl-devel systemd-rpm-macros gnupg2 \
              gcc gcc-c++ make cmake curl patchelf
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- --default-toolchain 1.97.1 -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
          ln -sf "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc
      - name: Derive RPM version fields from the release version
        id: rpmver
        run: |
          set -eu
          # Single source: `version` comes from the tag via release.yml.
          # RPM has no pre-release field, so a SemVer pre-release is split:
          #   1.0.0-rc.7 -> Version 1.0.0, Release 0.rc7 (sorts BEFORE the
          #                 final release's Release 1, per Fedora packaging
          #                 guidelines for pre-release versions)
          #   1.0.0      -> Version 1.0.0, Release 1
          # The upstream archive + %prep dir keep the full SemVer string.
          FULL="${{ inputs.version }}"
          BASE="${FULL%%-*}"
          case "$FULL" in
            *-*) PREREL="${FULL#*-}" ;;
            *)   PREREL="" ;;
          esac
          if [ -n "$PREREL" ]; then
            # dots are legal in Release but "0.rc7" is the conventional form
            RPMREL="0.$(printf '%s' "$PREREL" | tr -d '.')"
          else
            RPMREL="1"
          fi
          {
            echo "full=$FULL"
            echo "base=$BASE"
            echo "prerel=$PREREL"
            echo "rpmrel=$RPMREL"
          } >> "$GITHUB_OUTPUT"
          echo "version=$BASE release=$RPMREL archive=zerodds-$FULL.tar.gz"
      - name: Stage source tarball
        run: |
          set -eu
          rpmdev-setuptree
          mkdir -p ~/rpmbuild/SOURCES
          # Name + prefix must match Source0's basename and %prep's
          # `%autosetup -n` in zerodds.spec, both built from zd_fullver.
          FULL="${{ steps.rpmver.outputs.full }}"
          tar --transform "s,^,zerodds-${FULL}/," \
              -czf ~/rpmbuild/SOURCES/zerodds-${FULL}.tar.gz \
              --exclude target --exclude .git .
      - name: Build RPMs
        # Explicit: the --define list is a bash array, so the sh fallback
        # GitHub uses when a container has no bash must not kick in.
        shell: bash
        run: |
          set -eu
          cp packaging/linux/rpm/zerodds.spec ~/rpmbuild/SPECS/
          # The spec carries no version of its own; it is defined here so the
          # tag stays the only place a release number is written down.
          DEFS=(--define "zd_version ${{ steps.rpmver.outputs.base }}"
                --define "zd_release ${{ steps.rpmver.outputs.rpmrel }}")
          if [ -n "${{ steps.rpmver.outputs.prerel }}" ]; then
            DEFS+=(--define "zd_prerel ${{ steps.rpmver.outputs.prerel }}")
          fi
          rpmbuild -ba --target ${{ matrix.target }} \
                   "${DEFS[@]}" \
                   ~/rpmbuild/SPECS/zerodds.spec
      # The RPM repositories are built on packages.zerodds.org by a pull
      # deploy (packaging/linux/repo-server/sync-zerodds-packages, cron every
      # 5 min), not pushed from CI. It takes the .rpm files from the release,
      # checks them against the minisign-signed SHA512SUMS, signs them with
      # the repository key and publishes them only when the signature
      # verifies against zerodds.gpg. This step runs the same signing with a
      # throwaway key and installs every package with gpgcheck=1 and
      # repo_gpgcheck=1 from a local repository before the release is made.
      - name: Install test (signed packages, gpgcheck=1)
        run: |
          set -euo pipefail
          dnf install -y createrepo_c rpm-sign
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          uid=ci-install-test@zerodds.invalid
          gpg --batch --passphrase '' --quick-gen-key "ZeroDDS CI install test <$uid>" rsa3072 sign 1d
          gpg --batch --export --armor "$uid" > "$RUNNER_TEMP/ci-key.asc"
          repo="$RUNNER_TEMP/ci-repo"
          mkdir -p "$repo"
          cp ~/rpmbuild/RPMS/${{ matrix.target }}/*.rpm "$repo/"
          rpmsign --addsign --define "_gpg_name $uid" \
            --define '_gpg_sign_cmd_extra_args --batch --pinentry-mode error' "$repo"/*.rpm
          createrepo_c "$repo"
          gpg --batch --yes --detach-sign --armor --local-user "$uid" \
            --output "$repo/repodata/repomd.xml.asc" "$repo/repodata/repomd.xml"
          printf '%s\n' '[zerodds-ci]' 'name=ZeroDDS CI install test' \
            "baseurl=file://$repo" 'enabled=1' 'gpgcheck=1' 'repo_gpgcheck=1' \
            "gpgkey=file://$RUNNER_TEMP/ci-key.asc" > /etc/yum.repos.d/zerodds-ci.repo
          mapfile -t names < <(rpm -qp --qf '%{NAME}\n' "$repo"/*.rpm | sort -u)
          dnf install -y "${names[@]}"
          # Every installed package carries a signature by the throwaway key.
          rpm -K "$repo"/*.rpm | tee "$RUNNER_TEMP/checksig.txt"
          if grep -v ': digests signatures OK$' "$RUNNER_TEMP/checksig.txt"; then
            echo "::error::package without a valid signature"; exit 1
          fi
          zerodds-admin --version
      - name: Upload artifacts (release attachments)
        uses: actions/upload-artifact@v7
        with:
          name: zerodds-rpm-${{ matrix.target }}
          if-no-files-found: error
          path: ~/rpmbuild/RPMS/${{ matrix.target }}/*.rpm
