# cargo-dist publish-job for Fedora/RHEL .rpm packages.
# Spec: zerodds-deployment-1.0.md §2.2.2.
name: publish-rpm
on:
  workflow_call:
    inputs:
      plan:
        description: "cargo-dist plan JSON"
        required: true
        type: string

jobs:
  build-rpm:
    name: Build .rpm (${{ matrix.target }})
    runs-on: ubuntu-22.04
    container: fedora:40
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64
          - aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        # Fedora 40 ships rust 1.78; ZeroDDS needs 1.88+ → rustup.
        run: |
          dnf install -y rpm-build rpmdevtools pkgconfig \
              openssl-devel systemd-rpm-macros gnupg2 \
              gcc gcc-c++ make curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- --default-toolchain 1.88.0 -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
          ln -sf "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc
      - name: Stage source tarball
        run: |
          rpmdev-setuptree
          mkdir -p ~/rpmbuild/SOURCES
          tar --transform 's,^,zerodds-1.0.0-rc.1/,' \
              -czf ~/rpmbuild/SOURCES/zerodds-1.0.0-rc.1.tar.gz \
              --exclude target --exclude .git .
      - name: Build RPMs
        run: |
          cp packaging/linux/rpm/zerodds.spec ~/rpmbuild/SPECS/
          rpmbuild -ba --target ${{ matrix.target }} ~/rpmbuild/SPECS/zerodds.spec
      # YUM-Repo wird auf packages.zerodds.org via Pull-Deploy
      # (nr3 cron alle 5 min) gebaut, nicht in CI gepusht. Hier nur
      # die .rpm-Files als GH-Release-Asset hochladen — der Pull-
      # Deploy zieht sie, verifiziert minisign + signiert lokal mit
      # dem Server-GPG-Key.
      - name: Upload artifacts (release attachments)
        uses: actions/upload-artifact@v4
        with:
          name: zerodds-rpm-${{ matrix.target }}
          path: ~/rpmbuild/RPMS/${{ matrix.target }}/*.rpm
