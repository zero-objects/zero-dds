# PyPI publish job for the `zerodds` Python package (crates/py).
# Spec: internal/packaging/language-binding-publish-followup.md (RC3-Pickup).
#
# Auth: Trusted Publisher (OIDC) — NO API token needed.
#
# Setup once (user action, not in CI):
#  1. Configure a PyPI Trusted Publisher:
#     https://pypi.org/manage/account/publishing/
#     "Add a new pending publisher" → GitHub tab → fields:
#       PyPI project name: zerodds
#       Owner:             zero-objects
#       Repository name:   zero-dds
#       Workflow name:     publish-pypi.yml
#       Environment name:  pypi
#  2. Same on test.pypi.org/manage/account/publishing/ — same values,
#     but Environment name: testpypi
#  3. Create "pypi" + "testpypi" as environments in the GitHub repo
#     (Repo → Settings → Environments → New Environment). Can stay
#     empty — their mere existence gates the job per approval policy
#     if you want to enable that.
#
# Trigger:
#  - workflow_dispatch: manually from the GitHub UI (with "test" flag for Test-PyPI)
#  - workflow_call: from release.yml on tag push v*.*.*

name: publish-pypi
on:
  workflow_dispatch:
    inputs:
      target_index:
        description: "Upload target"
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
  workflow_call:
    inputs:
      target_index:
        description: "Upload target (testpypi | pypi)"
        required: false
        type: string
        default: pypi

permissions:
  contents: read

jobs:
  # Build wheels — one job per target. abi3 makes one wheel per platform
  # work for all Pythons >= 3.8, so we don't need a separate
  # python-version matrix.
  build-wheels:
    name: Build wheel (${{ matrix.target.runner }} / ${{ matrix.target.id }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-x86_64
            runner: ubuntu-22.04
            maturin_target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - id: linux-aarch64
            runner: ubuntu-22.04
            maturin_target: aarch64-unknown-linux-gnu
            manylinux: '2014'
          - id: macos-arm64
            runner: macos-14   # Apple Silicon
            maturin_target: aarch64-apple-darwin
            manylinux: 'off'
          # macOS Intel (x86_64) as an RC3 item — the GitHub free-tier macos-13
          # runner queue is >10h today (2026-05-19). All modern Macs
          # are ARM. If an Intel wheel is needed: build locally + upload
          # manually afterwards, or use the GitHub paid tier.
          # - id: macos-x86_64
          #   runner: macos-13
          #   maturin_target: x86_64-apple-darwin
          #   manylinux: 'off'
          - id: windows-x86_64
            runner: windows-2022
            maturin_target: x86_64-pc-windows-msvc
            manylinux: 'off'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target.maturin_target }}
          args: --release --out dist --manifest-path crates/py/Cargo.toml
          manylinux: ${{ matrix.target.manylinux }}
          # Cross-compile for Linux aarch64 via Docker.
          # macOS / Windows build natively on their respective runners.
          docker-options: --user root

      - name: List built wheels
        shell: bash
        run: ls -la dist/

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target.id }}
          path: dist/*.whl
          if-no-files-found: error

  # sdist (source distribution) separately — if wheel install fails
  # pip can build from the sdist.
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/py/Cargo.toml
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Collect all artifacts + upload to PyPI (or Test-PyPI).
  # PyPI publish is atomic per version: it fails if the version
  # already exists. So on a tag re-push you must bump the version
  # beforehand.
  publish:
    name: Publish to ${{ inputs.target_index || 'pypi' }}
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-22.04
    # OIDC auth needs id-token: write. The Trusted Publisher on PyPI
    # exchanges the GitHub OIDC token for a short-lived upload token,
    # no stored secret needed.
    permissions:
      id-token: write
    environment:
      name: ${{ inputs.target_index || 'pypi' }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la dist/

      - name: Publish to Test-PyPI (OIDC Trusted Publisher)
        if: ${{ inputs.target_index == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

      - name: Publish to PyPI (OIDC Trusted Publisher)
        if: ${{ inputs.target_index != 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
