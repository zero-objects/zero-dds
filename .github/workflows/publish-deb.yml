# cargo-dist publish-job for Debian/Ubuntu .deb packages.
# Wired into [workspace.metadata.dist].publish-jobs in Cargo.toml.
# Spec: zerodds-deployment-1.0.md §2.2.1.
name: publish-deb
on:
  workflow_call:
    inputs:
      plan:
        description: "cargo-dist plan JSON"
        required: true
        type: string

jobs:
  build-deb:
    name: Build .deb (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential debhelper devscripts dpkg-dev fakeroot \
              pkg-config libssl-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            mkdir -p ~/.cargo
            {
              echo "[target.aarch64-unknown-linux-gnu]"
              echo 'linker = "aarch64-linux-gnu-gcc"'
            } >> ~/.cargo/config.toml
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV
          fi
      - name: cargo build (release)
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Assemble debs (per sub-package)
        run: |
          bash packaging/linux/deb/assemble-debs.sh \
               --target ${{ matrix.target }} \
               --version "$(echo '${{ github.ref_name }}' | sed 's/^v//')" \
               --out dist/
      # The APT repo is built on packages.zerodds.org via pull-deploy
      # (the server host's cron, every 5 min), not pushed from CI. Here we
      # only upload the .deb files as GH release assets — the
      # pull-deploy fetches them and signs them locally with the server GPG key.
      - name: Upload artifacts (release attachments)
        uses: actions/upload-artifact@v7
        with:
          name: zerodds-deb-${{ matrix.target }}
          path: dist/*.deb
