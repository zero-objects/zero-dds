# cargo-dist publish-job for Debian/Ubuntu .deb packages.
# Wired into [workspace.metadata.dist].publish-jobs in Cargo.toml.
# Spec: zerodds-deployment-1.0.md §2.2.1.
name: publish-deb
on:
  workflow_call:
    inputs:
      source_ref:
        description: "Immutable release source commit selected by the caller"
        required: false
        type: string
        default: ""
      version:
        description: "Release version without the leading v (e.g. 1.0.0-rc.7), derived from the tag by release.yml"
        required: true
        type: string

# `shell: bash` runs a step with `-eo pipefail`; the default is `bash -e`,
# under which `cmd | tee log` reports tee's status and a failing cmd passes.
defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build .deb (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential debhelper devscripts dpkg-dev fakeroot \
              pkg-config libssl-dev
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y --no-install-recommends \
                gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            mkdir -p ~/.cargo
            {
              echo "[target.aarch64-unknown-linux-gnu]"
              echo 'linker = "aarch64-linux-gnu-gcc"'
            } >> ~/.cargo/config.toml
            {
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
              echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            } >> "$GITHUB_ENV"
          fi
      - name: cargo build (release)
        # zerodds-naming-svc and zerodds-xrce-agentd need their package's
        # `daemon` feature, which is not a default feature.
        run: >-
          cargo build --release --workspace --target ${{ matrix.target }}
          --features zerodds-corba-cosnaming/daemon,zerodds-xrce-agent/daemon
      - name: Assemble debs (per sub-package)
        run: |
          # `github.ref_name` is the CALLER's ref: on a tag push that is the
          # tag, but on a workflow_dispatch re-run it is the branch name and
          # the .deb would be versioned "main". Take the version release.yml
          # derived from the tag instead.
          bash packaging/linux/deb/assemble-debs.sh \
               --target ${{ matrix.target }} \
               --version "${{ inputs.version }}" \
               --out dist/
      # The APT repo is built on packages.zerodds.org via pull-deploy
      # (the server host's cron, every 5 min), not pushed from CI. Here we
      # only upload the .deb files as GH release assets — the
      # pull-deploy fetches them and signs them locally with the server GPG key.
      - name: Upload artifacts (release attachments)
        uses: actions/upload-artifact@v7
        with:
          name: zerodds-deb-${{ matrix.target }}
          if-no-files-found: error
          path: dist/*.deb
