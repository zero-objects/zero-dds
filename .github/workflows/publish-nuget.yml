# NuGet publish job for ZeroDDS (crates/cs/csharp/ZeroDDS).
# Spec: internal/packaging/language-binding-publish-followup.md
#
# Setup once (user action, quick):
#  1. Create a nuget.org account (free):
#     https://www.nuget.org/users/account/LogOn
#     Microsoft or GitHub login accepted.
#  2. Generate an API key (nuget.org → Account → API Keys):
#     - Key Name: "zerodds-ci"
#     - Push Scope: "Push new packages and package versions"
#     - Glob Pattern: ZeroDDS*
#     - Expiration: 365 days (or less)
#     Save the token (shown only once).
#  3. Set the GitHub secret NUGET_API_KEY
#     Repo → Settings → Secrets → Actions → New repository secret
#
# Note: the main package `ZeroDDS` is the C# API + source generators.
# The native lib (libzerodds.so/dylib/dll) is NOT bundled — the
# user must install libzerodds via package manager / GitHub releases
# (see /bindings/csharp/). Phase 2: pack native libs as runtime/<rid>/native/
# files into a separate ZeroDDS.Native.Runtime nupkg.

name: publish-nuget
on:
  workflow_dispatch:
    inputs:
      target_index:
        description: "Upload target (nuget = nuget.org)"
        required: true
        type: choice
        default: nuget
        options:
          - nuget
      dry_run:
        description: "Pack only, no push"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      target_index:
        required: false
        type: string
        default: nuget
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Pack + push ZeroDDS to nuget.org
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # 9.0.x is locally verified. Otherwise setup-dotnet pulls the
          # newest preview (10.0.300 RC), which escalates NU5128 to an error.
          dotnet-version: '9.0.x'

      - name: Sync version from Cargo.toml workspace
        id: version
        run: |
          WS_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          # NuGet accepts SemVer pre-releases directly (1.0.0-rc.2).
          echo "Workspace version: $WS_VERSION"
          echo "version=$WS_VERSION" >> "$GITHUB_OUTPUT"

      - name: dotnet restore
        working-directory: crates/cs/csharp
        run: |
          # No .sln present, so restore per project.
          # ZeroDDS.Cdr.SourceGenerators: NU5017 build-task error after
          # pack (analyzer-only nupkg) — Phase 2 item, see followup.
          for proj in ZeroDDS/ZeroDDS.csproj ZeroDDS.Cdr/ZeroDDS.Cdr.csproj; do
            dotnet restore "$proj"
          done

      - name: dotnet build (Release)
        working-directory: crates/cs/csharp
        run: |
          for proj in ZeroDDS/ZeroDDS.csproj ZeroDDS.Cdr/ZeroDDS.Cdr.csproj; do
            dotnet build "$proj" -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}
          done

      - name: dotnet pack
        working-directory: crates/cs/csharp
        run: |
          # ZeroDDS + ZeroDDS.Cdr for this push.
          # SourceGenerators comes in Phase 2 (RC3 polish):
          # NU5017 fires in the NuGet pack analyzer even when the nupkg
          # is created successfully; NoWarn does not take effect. Workaround
          # still to be found, possibly with an explicit nuspec instead of
          # csproj-driven pack.
          for proj in ZeroDDS/ZeroDDS.csproj ZeroDDS.Cdr/ZeroDDS.Cdr.csproj; do
            dotnet pack "$proj" -c Release --no-build \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:IncludeSymbols=true \
              -p:SymbolPackageFormat=snupkg \
              -o ../../../dist/
          done
          ls -la ../../../dist/

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: dist/*.nupkg

      - name: Push to nuget.org
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret not set"
            exit 1
          fi
          dotnet nuget push 'dist/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
