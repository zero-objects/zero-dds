# npm publish job for @zerodds/node (crates/ts-node).
# Spec: internal/packaging/language-binding-publish-followup.md
#
# **Trusted Publishing (OIDC)** — no NPM_AUTH_TOKEN needed.
#
# Setup once (user action, not in CI):
#  1. Reserve the npm org `zerodds` (free): https://www.npmjs.com/signup
#     Then under Account → Organizations → "Create" → name=zerodds
#     so that the scope @zerodds/node is available.
#  2. Configure a Trusted Publisher on npmjs.com:
#     Package settings (@zerodds/node) → Trusted Publishers → "Add"
#     Publisher Type: GitHub Actions
#     Organization: zero-objects
#     Repository: zero-dds
#     Workflow: publish-npm.yml
#     Environment: (empty)
#     This establishes the OIDC trust and the workflow can
#     publish without a token. The provenance attestation is generated
#     automatically (Sigstore-signed, supply-chain-tracked).
#     The same publisher setup is separately required for @zerodds/wire.
#
# Not called from release.yml: npm validates the CALLING workflow's filename,
# not the one that runs `npm publish`. Through a `uses:` call from
# release.yml the claim would read release.yml while the Trusted Publisher
# above is registered for publish-npm.yml, and the publish would be refused.
# Wiring it into release.yml therefore requires changing the "Workflow" field
# of the Trusted Publisher on npmjs.com to release.yml first. Until then this
# workflow is started as a top-level workflow_dispatch run after a release.
#
# Note: @zerodds/node is pure-TS FFI (koffi against libzerodds.so/dylib/dll).
# There is NO native build in the npm tarball — the user must install libzerodds via
# package manager / GitHub releases (see /bindings/typescript-node/).
# The package published here is therefore small (~50 KB) and platform-neutral.

name: publish-npm
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (latest | beta | rc)"
        required: true
        type: choice
        default: rc
        options:
          - latest
          - beta
          - rc
      dry_run:
        description: "npm pack only, no push"
        required: false
        type: boolean
        default: false
      version_override:
        description: "Optional: override SemVer (otherwise Cargo.toml workspace.version)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
        default: rc
      dry_run:
        required: false
        type: boolean
        default: false
      version_override:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # OIDC token for npm Trusted Publishing (set up 2026-05-19).
  # Trust anchor in npmjs.com/package/@zerodds/node/access → Trusted Publishers.
  id-token: write

# `shell: bash` runs a step with `-eo pipefail`; the default is `bash -e`,
# under which `cmd | tee log` reports tee's status and a failing cmd passes.
defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build + publish @zerodds/node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # 24.x minimum for Trusted Publishing + provenance (npm CLI >= 11.5.1).
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from Cargo.toml workspace
        working-directory: crates/ts-node
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            WS_VERSION="$VERSION_OVERRIDE"
            echo "Using version_override: $WS_VERSION"
          else
            # workspace version: e.g. "1.0.0-rc.2"
            WS_VERSION=$(grep '^version = ' ../../Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
            echo "Using Cargo.toml version: $WS_VERSION"
          fi
          # npm accepts SemVer pre-releases directly (1.0.0-rc.2).
          npm version "$WS_VERSION" --no-git-tag-version --allow-same-version
          cd ../../runtime/typescript
          npm version "$WS_VERSION" --no-git-tag-version --allow-same-version
          echo "WS_VERSION=$WS_VERSION" >> "$GITHUB_ENV"

      - name: Build and pack canonical wire runtime
        working-directory: runtime/typescript
        run: |
          npm ci --ignore-scripts
          npm pack

      - name: Install deps
        working-directory: crates/ts-node
        run: npm ci

      - name: TypeScript build
        working-directory: crates/ts-node
        run: npm run build

      - name: Build native binding dependency
        # Build the ordinary native dependency before the binding tests.
        # rustup selects the checked-in rust-toolchain.toml for Cargo.
        # This is a build prerequisite, not an uploaded npm payload.
        working-directory: .
        run: cargo build --locked --release -p zerodds-c-api --jobs 1

      - name: Run native binding tests
        working-directory: crates/ts-node
        # A missing native runtime is a preparation failure, never a pass.
        run: npm test

      - name: npm pack (dry-run preview)
        working-directory: crates/ts-node
        # The repository resolves @zerodds/wire through
        # `file:../../runtime/typescript`; a package from the registry cannot.
        # The packed package.json names the version that the step
        # "Publish wire runtime" publishes instead.
        run: |
          npm pkg set "dependencies.@zerodds/wire=$WS_VERSION"
          npm pack --dry-run
          npm pack
          ls -la *.tgz

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: |
            crates/ts-node/*.tgz
            runtime/typescript/*.tgz
          if-no-files-found: error

      - name: Publish wire runtime
        if: ${{ !inputs.dry_run }}
        working-directory: runtime/typescript
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm publish ./*.tgz --provenance --access public --tag "$RELEASE_TAG"

      - name: npm publish (OIDC Trusted Publishing + Provenance)
        if: ${{ !inputs.dry_run }}
        working-directory: crates/ts-node
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        # No NODE_AUTH_TOKEN — OIDC via id-token + npmjs.com Trusted Publisher config.
        # --provenance generates a Sigstore attestation (supply-chain transparency log).
        run: |
          npm publish ./*.tgz --provenance --access public --tag "$RELEASE_TAG"
