# .github/workflows/release.yml
# cargo-dist driven release pipeline.
# Spec: zerodds-deployment-1.0.md §6.
# Triggers on git tag push v*.*.*, computes a release plan, builds per-target
# artefacts, then dispatches the platform-specific publish-jobs declared in
# [workspace.metadata.dist].publish-jobs.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.2.3 or v1.2.3-rc.4"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write   # OIDC for cosign keyless signing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  plan:
    name: cargo-dist plan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      source_ref: ${{ steps.plan.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.22.1 --locked
      - name: Plan
        id: plan
        # -eo pipefail; the workflow has no bash default, package-msi runs pwsh.
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          VERSION="${TAG#v}"
          {
            echo "source_ref=$(git rev-parse HEAD)"
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          # Single source of truth for every downstream job: the tag.
          # Jobs that cannot read the tag (npm/NuGet/Maven read
          # [workspace.package].version) must agree with it, otherwise a
          # release ships .deb/.rpm/Docker at one version and the language
          # packages at another. Fail loudly on drift instead of publishing
          # a mixed set.
          WS_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$WS_VERSION" != "$VERSION" ]; then
            echo "::error::tag $TAG implies version $VERSION, but Cargo.toml [workspace.package].version is $WS_VERSION"
            exit 1
          fi
          # The plan checks [workspace.metadata.dist]; no job reads it. It is
          # not a job output: GitHub refuses a job whose outputs exceed
          # 1 MiB, and the plan for this workspace is larger.
          cargo dist plan --output-format=json > "$RUNNER_TEMP/dist-plan.json"
          echo "cargo dist plan: $(wc -c < "$RUNNER_TEMP/dist-plan.json") bytes"

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
          # aarch64-unknown-linux-musl is deliberately absent: it was dropped
          # from [workspace.metadata.dist].targets in Cargo.toml (cross-musl
          # needs a real aarch64-musl gcc; the glibc-cross-gcc hack breaks on
          # libsqlite3-sys' FORTIFY headers). `cargo dist build --target` only
          # accepts targets from that list, so keeping it here produced a
          # build matrix entry that cannot succeed. ARM64 Linux ships via
          # aarch64-unknown-linux-gnu.
          # x86_64-apple-darwin is cross-compiled on the Apple Silicon
          # runner — `cargo --target x86_64-apple-darwin` is natively
          # supported by Apple tooling.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: aarch64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev musl-tools
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              # aarch64 cross-compile: needs the compiler PLUS multi-arch
              # libc headers (otherwise "bits/libc-header-start.h not found"
              # in ring's C builds via cc-rs).
              sudo apt-get install -y --no-install-recommends \
                  gcc-aarch64-linux-gnu libc6-dev-arm64-cross
              ;;
          esac
      - name: Configure cross-compile linker for aarch64
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          {
            echo "[target.aarch64-unknown-linux-gnu]"
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> ~/.cargo/config.toml
          {
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"
      # macOS code-signing: import the Developer ID Application + Installer
      # certs into an ad-hoc keychain. apple-actions/import-codesign-certs
      # dislikes two imports into the same keychain (set-key-partition-list
      # collides), so do it directly via /usr/bin/security.
      - name: Import Apple codesigning certs (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_P12:    ${{ secrets.APPLE_CERT_APP_BASE64 }}
          APP_PWD:    ${{ secrets.APPLE_CERT_APP_PASSWORD }}
          INST_P12:   ${{ secrets.APPLE_CERT_INSTALLER_BASE64 }}
          INST_PWD:   ${{ secrets.APPLE_CERT_INSTALLER_PASSWORD }}
        run: |
          set -e
          KC="zerodds-signing.keychain"
          KC_PWD=$(uuidgen)
          # 1) Create + unlock keychain + prepend to the search path.
          security create-keychain -p "$KC_PWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PWD" "$KC"
          keychains=()
          while IFS= read -r keychain; do
            keychains+=("$keychain")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          security list-keychains -d user -s "$KC" "${keychains[@]}"
          # 2) Import both P12s one after another (-A grants all tools access).
          echo "$APP_P12"  | base64 -D > /tmp/cert-app.p12
          echo "$INST_P12" | base64 -D > /tmp/cert-installer.p12
          security import /tmp/cert-app.p12       -k "$KC" -P "$APP_PWD"  -A -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          security import /tmp/cert-installer.p12 -k "$KC" -P "$INST_PWD" -A -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          # 3) Set the partition list once for both (Apple-tool access
          #    without a password prompt at runtime).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PWD" "$KC"
          # 4) Clean up p12 files.
          rm -f /tmp/cert-app.p12 /tmp/cert-installer.p12
          # 5) Verification.
          security find-identity -v -p codesigning "$KC"
      - name: Install cargo-dist
        run: cargo install cargo-dist --version 0.22.1 --locked
      - name: Build target
        run: cargo dist build --target ${{ matrix.target }}
      - name: Sign with minisign (Linux)
        if: runner.os == 'Linux'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PWD: ${{ secrets.MINISIGN_PASSWORD }}
        run: bash packaging/github-actions/sign-artifacts.sh target/distrib
      - name: Codesign + notarize + .pkg macOS binaries
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          # Apple cert naming convention (checked via security find-identity):
          # "Developer ID Application: <Common-Name> (<TEAMID>)" — external distribution + notarization
          # "Developer ID Installer:   <Common-Name> (<TEAMID>)" — .pkg-installer signing
          DEV_ID_APPLICATION: "Developer ID Application: Sandra Theresa Keler (YU6XNW6DG7)"
          DEV_ID_INSTALLER:   "Developer ID Installer: Sandra Theresa Keler (YU6XNW6DG7)"
          # Names + stamps zerodds-bundle-<version>-<target>.pkg. Derived from
          # the tag so the .pkg carries the same version as every other
          # artefact of the release (was hard-coded "1.0.0").
          ZERODDS_PKG_VERSION: ${{ needs.plan.outputs.version }}
          # The .pkg collects the binaries of this target; x86_64 is
          # cross-compiled on an arm64 runner.
          ZERODDS_TARGET: ${{ matrix.target }}
        run: bash packaging/github-actions/sign-macos.sh target/distrib
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.target }}
          path: target/distrib/
          if-no-files-found: error

  package-deb:
    name: Build .deb packages
    needs: [plan, build]
    uses: ./.github/workflows/publish-deb.yml
    secrets: inherit
    with:
      version: ${{ needs.plan.outputs.version }}
      source_ref: ${{ needs.plan.outputs.source_ref }}

  package-rpm:
    name: Build .rpm packages
    needs: [plan, build]
    uses: ./.github/workflows/publish-rpm.yml
    secrets: inherit
    with:
      version: ${{ needs.plan.outputs.version }}
      source_ref: ${{ needs.plan.outputs.source_ref }}

  package-docker:
    name: Build + push Docker images
    needs: [plan, build]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Daemons are service images (ENTRYPOINT-driven), runtimes are
        # sandbox environments for learner/demo workflows (Python/C/C++/
        # TS toolchain plus libzerodds.so + zerodds-idlc). Both are
        # published with the same tag scheme — consumers distinguish
        # via the image name (zerodds-cli vs. zerodds-py-runtime).
        image:
          - ws-bridged
          - mqtt-bridged
          - coap-bridged
          - amqp-bridged
          - grpc-bridged
          - corba-bridged
          - ros2-shim
          - cli
          - py-runtime
          - cpp-runtime
          - ts-node-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (${{ matrix.image }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fishermen21/zerodds-${{ matrix.image }}:${{ needs.plan.outputs.tag }}
            fishermen21/zerodds-${{ matrix.image }}:1.0
            ghcr.io/zero-objects/zerodds-${{ matrix.image }}:${{ needs.plan.outputs.tag }}
            ghcr.io/zero-objects/zerodds-${{ matrix.image }}:1.0
          # No GHA build cache: the `type=gha` exporter hits the GitHub Actions
          # cache backend, which returns `not_found` on export ("failed to solve:
          # not_found") across the parallel multi-image matrix — a cache-service
          # issue, not scope collision (per-image scope did not help; it whipsawed
          # to a different image each run). The images build + push fine; only the
          # cache export failed, and it was caching nothing anyway. Dropped for
          # reliability — builds are slower (no cross-run layer reuse) but green.

  package-msi:
    name: Build Windows MSI
    needs: [plan, build]
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-x86_64-pc-windows-msvc
          path: payload\
      - name: Reshape payload to flat bin/ dir
        shell: pwsh
        run: |
          # cargo-dist payload layout (verified on the CI runner with a
          # real download of artifact-x86_64-pc-windows-msvc): the .exes
          # live in payload\<binname>-x86_64-pc-windows-msvc\<binname>.exe.
          # IMPORTANT: separate payload-flat\ tree so Get-ChildItem
          # -Recurse does not see the just-copied files twice (race
          # with lazy iteration). Plus eager eval via @() before copy.
          New-Item -ItemType Directory -Force -Path payload-flat\bin | Out-Null
          $exes = @(Get-ChildItem -Path payload -Filter *.exe -Recurse -File)
          Write-Host "found $($exes.Count) .exe files in payload/"
          if ($exes.Count -eq 0) { throw "Required Windows executables are missing" }
          $exes | ForEach-Object { Copy-Item $_.FullName -Destination "payload-flat\bin\$($_.Name)" -Force }
          Write-Host "=== payload-flat\bin\ jetzt ==="
          Get-ChildItem payload-flat\bin | ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
      - name: Install WiX 4 + extensions
        run: |
          # Verified on the CI runner (gitlab branch wix-debug, pipeline 1001 = MSI built 749 KiB):
          # WiX 4 split the classic in-process extensions (Util, UI, Bal, ...)
          # into separate NuGet packages. We need Util + UI:
          #   - WixToolset.Util.wixext  for <util:ServiceConfig>
          #   - WixToolset.UI.wixext    for <ui:WixUI Id="WixUI_Mondo">
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.Util.wixext/4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5
      - name: Prepare LICENSE.rtf
        shell: pwsh
        run: |
          # The WixUI_Mondo dialog set shows a license-acceptance page; the
          # Apache-2.0 LICENSE only exists as plain text. Convert it to
          # minimal RTF so the WixUILicenseRtf variable has a valid
          # file path.
          $rtfHeader = '{\rtf1\ansi\ansicpg1252\deff0\nouicompat\deflang1031{\fonttbl{\f0\fnil\fcharset0 Calibri;}}'
          $rtfStart = '{\*\generator ZeroDDS-CI;}\viewkind4\uc1\pard\sa200\sl276\slmult1\f0\fs20\lang7'
          $body = (Get-Content -Path LICENSE -Raw) -replace '\\','\\' -replace '\{','\{' -replace '\}','\}' -replace "`r?`n",'\par '
          Set-Content -Path LICENSE.rtf -Value "$rtfHeader $rtfStart $body }"
      - name: Compile MSI
        run: |
          # MSI ProductVersion has three numeric fields, not SemVer prerelease
          # ordering. Retain the full release identity in name and filename.
          $core = ($env:RELEASE_VERSION -split '-')[0]
          $parts = $core.Split('.')
          if ([int]$parts[0] -gt 255 -or [int]$parts[1] -gt 255 -or [int]$parts[2] -gt 65535) { throw "Version exceeds MSI ProductVersion limits" }
          wix build -arch x64 `
                -ext WixToolset.Util.wixext `
                -ext WixToolset.UI.wixext `
                -d PayloadDir=payload-flat `
                -d ProductVersion=$core -d ReleaseVersion=$env:RELEASE_VERSION `
                packaging/windows/msi/zerodds.wxs -o "dist/zerodds-$env:RELEASE_VERSION-x64.msi"
      - name: Sign MSI (skipped if WIN_CERT not provided)
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PWD: ${{ secrets.WIN_CERT_PWD }}
        run: |
          if (-not $env:WIN_CERT_PFX) {
              Write-Host "WIN_CERT_PFX_BASE64 not set; shipping unsigned MSI."
              exit 0
          }
          [System.IO.File]::WriteAllBytes("cert.pfx",
              [Convert]::FromBase64String($env:WIN_CERT_PFX))
          signtool sign /f cert.pfx /p $env:WIN_CERT_PWD `
                   /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 `
                   "dist/zerodds-$env:RELEASE_VERSION-x64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: zerodds-msi
          path: dist/*.msi
          if-no-files-found: error

  publish-homebrew-tap:
    name: Update Homebrew tap
    needs: [plan, github-release]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          repository: zero-objects/homebrew-zerodds
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: tap
      - name: Checkout main repo
        uses: actions/checkout@v7
        with:
          path: main
          ref: ${{ needs.plan.outputs.source_ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*-apple-darwin
          path: main/target/distrib
          merge-multiple: true
      - name: Render formulae
        working-directory: main
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: bash packaging/github-actions/render-homebrew.sh ../tap/Formula
      - name: Commit + push
        working-directory: tap
        run: |
          git config user.name  "zerodds-release-bot"
          git config user.email "release@zerodds.org"
          git add Formula
          if ! git diff --cached --quiet; then
            git commit -m "release: ${{ needs.plan.outputs.tag }}"
            git push
          fi

  publish-distros:
    name: AUR and Scoop
    needs: [plan, github-release]
    uses: ./.github/workflows/publish-distros.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit

  github-release:
    name: Publish GitHub release
    # All declared platform artifacts are required, including MSI.
    needs: [plan, build, package-deb, package-rpm, package-docker, package-msi]
    if: |
      always()
      && needs.plan.result == 'success'
      && needs.build.result == 'success'
      && needs.package-deb.result == 'success'
      && needs.package-rpm.result == 'success'
      && needs.package-docker.result == 'success'
      && needs.package-msi.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_ref }}
          path: main
      - uses: actions/download-artifact@v8
        with: { path: dist }
      - name: Verify required release artifacts
        shell: bash
        run: |
          set -euo pipefail
          require_artifact() {
            test -d "$1" && test -n "$(find "$1" -type f -name "$2" -size +0c -print -quit)" || {
              echo "::error::Missing required artifact $1/$2"; exit 1;
            }
          }
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            require_artifact "dist/artifacts-$target" '*.tar.xz'
          done
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            require_artifact "dist/artifacts-$target" '*.zip'
          done
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            require_artifact "dist/artifacts-$target" '*.pkg'
          done
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            require_artifact "dist/zerodds-deb-$target" '*.deb'
          done
          require_artifact dist/zerodds-rpm-x86_64 '*.rpm'
          require_artifact dist/zerodds-msi '*.msi'
      - name: Build the Scoop bundles
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            bash main/packaging/github-actions/windows-bundle.sh \
              --dist "dist/artifacts-$target" --target "$target" \
              --version "${{ needs.plan.outputs.version }}" --out dist/windows-bundles
          done
      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          # Every build artifact carries a source.tar.gz; the Windows
          # checkout has CRLF line endings, so theirs differs. The release
          # takes the one of the x86_64 Linux build.
          cp dist/artifacts-x86_64-unknown-linux-gnu/source.tar.gz release/
          # The per-build SHA512SUMS of sign-artifacts.sh are not copied; one
          # SHA512SUMS over exactly the release files replaces them.
          find dist -type f \( -name '*.tar.xz' -o -name '*.tar.xz.sha512' \
              -o -name '*.zip' -o -name '*.zip.sha512' -o -name '*.deb' \
              -o -name '*.rpm' -o -name '*.msi' -o -name '*.pkg' \
              -o -name '*.pkg.sha512' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' f; do
              n=$(basename "$f")
              if [ -e "release/$n" ]; then
                cmp -s "$f" "release/$n" || { echo "::error::two different files named $n"; exit 1; }
              else
                cp "$f" release/
              fi
            done
          (cd release && LC_ALL=C sha512sum -- * > ../SHA512SUMS) && mv SHA512SUMS release/
          echo "$(find release -type f | wc -l) release files"
      - name: Create release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
          # The files are uploaded by the next step; publication follows them.
          draft: true
          body: |
            ## Installation

            ### macOS
            **Recommended:** `zerodds-bundle-*.pkg` (signed + notarized + stapled — Gatekeeper accepts it without a workaround).

            **Tarball variant** (`*.tar.xz`): Apple notarytool does not accept .tar.xz, so the tarball binary carries no notarization ticket. After unpacking:
            ```bash
            xattr -d com.apple.quarantine zerodds-* 2>/dev/null
            chmod +x zerodds-*
            ```

            ### Linux
            - **Arch**: `paru -S zerodds-bin` (precompiled) or `paru -S zerodds` (build from source)
            - **Debian/Ubuntu**: download `*.deb` + `sudo dpkg -i`
            - **Fedora/RHEL**: download `*.rpm` + `sudo dnf install`
            - **Generic**: `*.tar.xz` for whichever component you want

            ### Windows
            - **MSI installer**: `zerodds-${{ needs.plan.outputs.version }}-x64.msi` (unsigned when no Windows certificate is configured)
            - **Portable**: download `*.zip` + extract

            ### Docker
            Multi-arch (amd64/arm64) on ghcr.io and Docker Hub:
            ```bash
            docker pull ghcr.io/zero-objects/zerodds-cli:${{ needs.plan.outputs.tag }}
            docker pull fishermen21/zerodds-mqtt-bridged:${{ needs.plan.outputs.tag }}
            ```

            ### Crates.io
            ```bash
            cargo install zerodds-record zerodds-bench zerodds-monitor-cli zerodds-spy zerodds-snitch zerodds-pcap zerodds-mq
            ```

            ---
      - name: Upload release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # One file per request. The action's parallel upload of 486 files
          # got "exceeded a secondary rate limit" (run 41041528739).
          for f in release/*; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$f" --clobber --repo "${{ github.repository }}"; then
                break
              fi
              if [ "$attempt" = 5 ]; then
                echo "::error::upload of $(basename "$f") failed"
                exit 1
              fi
              sleep $((attempt * 60))
            done
          done
      - name: Publish successfully uploaded release
        if: success() && steps.gh_release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Idempotent: sets draft=false and prerelease according to the tag.
          PRERELEASE_FLAG=""
          case "${{ needs.plan.outputs.tag }}" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
            *)   PRERELEASE_FLAG="--latest" ;;
          esac
          for attempt in 1 2 3; do
            if gh release edit "${{ needs.plan.outputs.tag }}" \
                 --repo "${{ github.repository }}" \
                 --draft=false $PRERELEASE_FLAG; then
              echo "release published (attempt $attempt)"
              break
            fi
            echo "publish attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          # Verify
          N=$(find release -type f | wc -l)
          gh release view "${{ needs.plan.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --json isDraft,assets \
            --jq "if .isDraft or (.assets | length) != $N then error(\"release is unpublished or has \(.assets | length) of $N files\") else \"published with \(.assets | length) assets\" end"

  # ---------------------------------------------------------------------------
  # Language-ecosystem packages.
  #
  # These run AFTER github-release: the published nupkg/jar do not bundle
  # libzerodds — they point users at the GitHub release for the native
  # library, so the release must exist first. They are deliberately NOT in
  # `github-release.needs`, so a registry outage cannot block the release
  # itself.
  #
  # Only the two token-authenticated ecosystems are wired in here. npm
  # (publish-npm.yml) and PyPI (publish-pypi.yml) authenticate via OIDC
  # Trusted Publishing and must stay manual — see the block below.
  # ---------------------------------------------------------------------------
  package-nuget:
    name: Publish NuGet packages
    needs: [plan, github-release]
    # Version comes from [workspace.package].version, which the plan job has
    # already asserted to be equal to the tag.
    # Secret: NUGET_API_KEY, reaches the called workflow via `secrets: inherit`.
    uses: ./.github/workflows/publish-nuget.yml
    secrets: inherit
    with:
      target_index: nuget
      dry_run: false
      source_ref: ${{ needs.plan.outputs.source_ref }}

  package-maven:
    name: Publish Maven Central artifacts
    needs: [plan, github-release]
    # Secrets: SONATYPE_USERNAME/PASSWORD, MAVEN_GPG_PRIVATE_KEY,
    # MAVEN_GPG_PASSPHRASE — all reach the called workflow via
    # `secrets: inherit`.
    uses: ./.github/workflows/publish-maven.yml
    secrets: inherit
    with:
      dry_run: false
      source_ref: ${{ needs.plan.outputs.source_ref }}

  # NOT wired in — npm and PyPI, and why:
  #
  #   publish-pypi.yml — PyPI Trusted Publishing does not support reusable
  #     workflows at all ("Reusable workflows cannot currently be used as the
  #     workflow in a Trusted Publisher", docs.pypi.org/trusted-publishers/
  #     troubleshooting, warehouse#11096). A `uses:` call here would produce
  #     an OIDC token PyPI refuses, i.e. a job that is red on every release.
  #
  #   publish-npm.yml — npm Trusted Publishing does work through a reusable
  #     workflow, but npm validates the CALLING workflow's filename. The
  #     Trusted Publisher on npmjs.com for @zerodds/node is configured with
  #     `publish-npm.yml`; calling it from here would require changing that
  #     entry to `release.yml` first. That is a change on npmjs.com, not in
  #     this repo, so the job stays out until it is made.
  #
  # Both remain `workflow_dispatch` and are run by hand after the release.
  # A repo-side fix for either is possible but needs a PAT: the automatic
  # GITHUB_TOKEN cannot trigger a workflow_dispatch, so release.yml cannot
  # start them as top-level runs on its own.
