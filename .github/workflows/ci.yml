name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Lint & format — must pass before anything else runs.
  # Maps to docs/architecture/04_safety_by_architecture.md §3.2.
  # ---------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # NOTE: no `--all-features` here. `--all-features` activates the opt-in
      # `wolfcrypt` backend, whose `wolfcrypt-sys` build needs libwolfssl /
      # WOLFSSL_SRC — not present on the hosted GitHub runner (it panics:
      # "required wolfcrypt source not found"). wolfCrypt is an opt-in,
      # GPL-3.0/wolfSSL-commercial backend; the FULL `--all-features` clippy
      # (including wolfcrypt, aws-lc, fips) runs on the GitLab CI, whose ci-rust
      # image ships libwolfssl. This public mirror lints default features
      # (ring backend) + all targets, which is green without any system lib.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  silent-drop:
    name: silent-drop guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pure grep over the rebuilt crates, so no toolchain and no cache.
      # Fails on a site that produces a silent drop and is not in
      # tools/silent-drop-allowlist.tsv with a reason. The same script
      # runs in scripts/pre-commit.sh and the GitLab CI, so the gate
      # cannot drift between the three.
      - run: bash tools/silent-drop-guard.sh

  staged-tree:
    name: staged-tree guard (the committed tree builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds the tree that is committed rather than the tree that is
      # checked out. On a runner the two are the same, which is the
      # point: three commits this cycle shipped a module and left its
      # `pub mod` declaration unstaged, so HEAD did not build while
      # every developer who already had the files stayed green. This job
      # is the first thing that would have noticed. It also fails on a
      # workspace member whose Cargo.toml is not tracked —
      # `crates/lang-python` was dropped from the index by a commit
      # while staying on disk and in the member list.
      #
      # `--head` because a CI checkout has an index identical to HEAD
      # and `git write-tree` on a fresh clone would answer the same;
      # naming HEAD says which tree is meant. The same script runs in
      # scripts/pre-commit.sh and the GitLab CI, so the gate cannot
      # drift between the three.
      - run: bash tools/staged-tree-guard.sh --head

  # ---------------------------------------------------------------------------
  # interop corpus — the 316 IDL cases of tests/interop-corpus/, through the
  # reflective encoder in all four {xcdr1, xcdr2} x {le, be} combinations and
  # through all three vendor emitters, compared against the bytes each case's
  # README records.
  #
  # Why a job of its own rather than leaving it to build-test: it is the gate
  # the corpus never had. docs/codec-coverage-report.md measured the cost of
  # that — the C++ emitter at 0 of 846 regions under every harness in the tree,
  # `cargo test --workspace` included, while feeding the Fast DDS column of the
  # interop matrix. A corpus no pipeline runs is documentation.
  #
  # It is a plain `cargo test`, so it needs nothing the other jobs do not have,
  # and it takes well under a second: the walk is in process, not 1264
  # invocations of the probe binary.
  # ---------------------------------------------------------------------------
  interop-corpus:
    name: interop corpus (316 cases x 4 modes x 3 emitters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p zerodds-wire-probe --test interop_corpus

  # The result tree and the two tables generated from it: 3,350 rows,
  # twelve columns, 14,831 committed result binaries. Rebuilds every
  # column a machine with a Rust toolchain and nothing else can reach and
  # compares the whole tree, both tables and the ledger against what is
  # committed. The columns it cannot reach — RTI is licensed, the three
  # ORBs are hand-built, the two ROS 2 type supports need a ROS
  # installation — are named in the output with the row count they leave
  # unverified, never skipped silently and never a failure for being
  # absent. The same two commands run in .gitlab-ci.yml.
  interop-results:
    name: interop results (3,350 rows x 12 systems)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -q -p zerodds-interop-results --bin interop-results -- --verify
      - run: cargo test -p zerodds-interop-results
      # The record half is not run here — no vendor toolchain is
      # installed on a GitHub runner and none is going to be — but the
      # shape of it is checked, and that check needs nothing: no probe
      # template may decide a byte order or an encoding version before
      # its compiler runs, and no cache key may name one. Both are what
      # keep a re-record at one build per case instead of one per cell,
      # and neither is visible in any byte comparison. GitLab's
      # `interop-results-record` job runs the recording itself against
      # the three vendors in the pinned image.
      - run: cargo test -p zerodds-interop-results --test record_shape

  deny:
    name: cargo-deny (licenses, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins 1.88.0; the cargo-deny-action Docker image
      # only has 1.85.0-musl pre-installed. The rust-version input forces
      # the action to rustup-install the pinned version before cargo-deny.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: "1.88.0"

  # ---------------------------------------------------------------------------
  # jscpd — copy/paste-detection gate (catches code duplication).
  #
  # Why: a duplicate C# `ExtensibilityKind` enum slipped in and only surfaced
  # at a build break. jscpd is language-agnostic (Rust, C#, Java, Kotlin, TS,
  # Go, Zig, …) so it covers the WHOLE codebase, not just the Rust crates.
  #
  # Config lives in `.jscpd.json` at the repo root — `minTokens` (50), the
  # `ignore` globs (build/generated output, content mirrors like docs/website,
  # the release mirror, and intentional teaching duplication under
  # examples/tutorials), and the `threshold`: the max duplicated-LINES % over
  # all scanned files. The threshold (8.5) sits ~0.5pp above the measured
  # cleaned baseline (8.01% lines on main, 2026-07), so the gate is GREEN
  # today but trips on new large-scale copy-paste (a duplicated file / module
  # / enum block — the ExtensibilityKind failure class). It is a RATCHET:
  # lower it as the known real clones (crates/idl-* cross-backend emitters,
  # the coap/mqtt/websocket bridge daemons, crates/ts-node ↔ crates/ts-wasm
  # cdr code) get de-duplicated. Do NOT raise it to paper over new duplication.
  #
  # To whitelist a legitimate clone: add a narrow glob to `.jscpd.json`
  # `ignore`, or wrap the block in `jscpd:ignore-start` / `jscpd:ignore-end`
  # comments. `.jscpd.json` is auto-discovered; its `threshold` reporter exits
  # non-zero when duplication% exceeds the threshold.
  #
  # This job MUST stay in sync with the `jscpd` job in .gitlab-ci.yml (the
  # authoritative root/GitLab CI) — otherwise the mirror sync re-diverges the
  # gate.
  # ---------------------------------------------------------------------------
  jscpd:
    name: jscpd (copy/paste detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx --yes jscpd@5.4.0 .

  # ---------------------------------------------------------------------------
  # cpd — the SECOND, token-based copy/paste gate (PMD CPD), run alongside the
  # line-based `jscpd` job above. Two independent detectors on purpose: jscpd
  # tokenizes by lines, PMD CPD by language tokens, so each catches clones the
  # other misses (notably small same-language clones — the C#
  # `ExtensibilityKind` class — that a repo-wide line-% budget does not fail
  # on).
  #
  # All logic (per-language minimum-tokens + committed baselines, the shared
  # exclude list mirroring .jscpd.json) lives in ONE script,
  # scripts/cpd-gate.sh, called identically here and in the GitLab CI so the
  # gate can't drift. PMD 7.x is a JVM tool → setup-java; the script takes
  # PMD from PMD_BIN and downloads nothing, so the step below provisions the
  # same pinned distribution as the GitLab job (URL and SHA-256). To re-baseline:
  # `scripts/cpd-gate.sh --update-baseline` and copy the numbers into the file.
  #
  # This job MUST stay in sync with the `cpd` job in .gitlab-ci.yml (the
  # authoritative root/GitLab CI) — otherwise the mirror sync re-diverges it.
  # ---------------------------------------------------------------------------
  cpd:
    name: cpd (token-based copy/paste detection)
    runs-on: ubuntu-latest
    env:
      PMD_VERSION: "7.27.0"
      PMD_SHA256: "4ae396ffaf2b0d3ef0b73a10b2925e77066f73d57a4ce9078c60e7302bcddec9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Provision PMD
        run: |
          curl -fsSL -o /tmp/pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          echo "${PMD_SHA256}  /tmp/pmd.zip" | sha256sum -c -
          unzip -q /tmp/pmd.zip -d /tmp/pmd
          echo "PMD_BIN=/tmp/pmd/pmd-bin-${PMD_VERSION}/bin/pmd" >> "$GITHUB_ENV"
      - run: bash scripts/cpd-gate.sh

  # ---------------------------------------------------------------------------
  # Build & test matrix — Full profile on Linux x86_64 and ARM64.
  # Phase-0 scope per docs/architecture/06_roadmap.md §3.
  # Windows, macOS, QNX, and embedded targets land with later phases.
  # ---------------------------------------------------------------------------
  build-test:
    name: build & test (${{ matrix.target }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      # The workspace's debug test build needs more disk than a hosted runner
      # leaves free: the x86_64 test build and the coverage build ended in
      # "No space left on device". The SDKs removed here are not used by
      # this job; line tables instead of full debug info shrink the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            # Exclude iceoryx2-oracle-consumer from the cross build: it is a
            # publish=false, x86_64-Linux-only oracle tool that hard-depends on
            # the upstream iceoryx2 crate, whose iceoryx2-pal-posix runs bindgen
            # and fails to cross-compile for aarch64 (clang can't find stddef.h
            # in the cross sysroot). Not part of the shipped library and
            # meaningless on an aarch64 embedded target.
            cross build --workspace --exclude iceoryx2-oracle-consumer --target ${{ matrix.target }}
          else
            cargo build --workspace --target ${{ matrix.target }}
          fi
      # `--skip`: three test functions read recorded cells from the
      # zerodds-matrix repository, which is cloned beside this one where
      # they run. This job checks out this repository alone; the three
      # refuse with that reason rather than pass on nothing.
      - name: Test (non-DCPS workspace, parallel)
        if: ${{ !matrix.cross }}
        run: >-
          cargo test --workspace --exclude zerodds-dcps --target ${{ matrix.target }}
          -- --skip every_language_has_a_cell_generator
          --skip the_matrix_cells_are_the_recorded_rows
          --skip the_shape_with_no_storage_is_left_to_the_clause
      - name: Test (DCPS, serial — UDP multicast tests share one multicast group per binary)
        if: ${{ !matrix.cross }}
        run: cargo test -p zerodds-dcps --target ${{ matrix.target }} -- --test-threads=1

  # ---------------------------------------------------------------------------
  # tsn-live — live AF_PACKET transport (DDS-TSN 1.0 Annex A, EtherType
  # 0x88B5). The workspace test job builds WITHOUT the transport-tsn
  # `live` feature, so socket.rs (target_os=linux) and its frame logic
  # are otherwise never compiled/run. GitHub ubuntu runners allow
  # `sudo ip link add` (veth) + AF_PACKET, so unlike the internal GitLab
  # runner the real veth RTPS round trip executes here. See
  # internal/ci/tsn-live.md.
  # ---------------------------------------------------------------------------
  tsn-live:
    name: TSN live AF_PACKET transport
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build socket.rs + run live_frame unit tests
        run: cargo test -p zerodds-transport-tsn --features live
      # Built as the runner user, run as root: the hosted runner's sudo
      # ignores -E, so a cargo started under sudo finds neither the pinned
      # toolchain nor the user's CARGO_HOME, and a root-owned target/ would
      # break the cache step after it.
      - name: Real RTPS round trip over a veth pair (needs root)
        working-directory: crates/transport-tsn
        run: |
          bin=$(cargo test -p zerodds-transport-tsn --features live --test veth_loopback \
            --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "veth_loopback" and .executable != null) | .executable')
          test -x "$bin"
          sudo "$bin" --ignored --test-threads=1

  # ---------------------------------------------------------------------------
  # No-std build for the Safe-Subset crates.
  # Verifies the Safe-Subset contract from
  # docs/architecture/04_safety_by_architecture.md §2.
  # Scope widens as Safe-Subset crates gain real content.
  # ---------------------------------------------------------------------------
  no-std:
    name: no_std build (safe subset)
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # The same two steps as the GitLab job `no-std` (ci/full.yml).
      - name: Build safe-subset crates for bare-metal
        run: |
          cargo build --target thumbv7em-none-eabihf \
            -p zerodds-foundation \
            -p zerodds-wire \
            -p zerodds-xrce-client \
            --no-default-features
      - name: Every crate that claims no-std builds without std
        run: bash tools/no-std-claims-gate.sh --target thumbv7em-none-eabihf

  # ---------------------------------------------------------------------------
  # Coverage — cargo-llvm-cov, line/region/function coverage.
  # Branch coverage requires nightly Rust and will be added later as a separate
  # nightly job. Target bar: 99% (soft gate, no merge block
  # during the bootstrap era).
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage (cargo-llvm-cov)
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      # The workspace's debug test build needs more disk than a hosted runner
      # leaves free: the x86_64 test build and the coverage build ended in
      # "No space left on device". The SDKs removed here are not used by
      # this job; line tables instead of full debug info shrink the build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.21 --locked
      - name: Run coverage
        # `--include-build-script`: without it the report says 0 of 693
        # regions for `crates/lang-rules/src/encode.rs` under
        # `wire-conformance`, because that crate drives the generator
        # from its `build.rs` and cargo-llvm-cov leaves build scripts
        # out of the report by default. With it, 353 of 693. Measured in
        # docs/codec-coverage-report.md §"What cannot be measured".
        #
        # `--lib --bins` was dropped with it: the integration tests are
        # where the codec evidence lives — `tests/interop_corpus.rs`
        # alone moves `fill_cpp.rs` from 0 to 73.5% — and excluding them
        # measured the harness rather than the code under it.
        run: cargo llvm-cov --workspace --include-build-script --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov --workspace --include-build-script --summary-only
      # Branch coverage is nightly-only (`-Z coverage-options=branch`) and
      # rust-toolchain.toml pins 1.88.0, so it cannot come from the step
      # above. It runs here on its own nightly, non-gating: a nightly lint
      # firing under the workflow's `-D warnings` must not turn the mirror
      # red, and the number is a diagnostic rather than a threshold.
      - name: Branch coverage (nightly, non-gating)
        continue-on-error: true
        env:
          RUSTFLAGS: ""
        run: |
          rustup toolchain install nightly --profile minimal \
            --component llvm-tools-preview
          cargo +nightly llvm-cov --workspace --branch --include-build-script \
            --summary-only
      - name: Upload lcov artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
          retention-days: 30
