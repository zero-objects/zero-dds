# Maven Central publish job for org.zerodds:omgdds (crates/java-omgdds/java).
# Spec: internal/packaging/language-binding-publish-followup.md
#
# Setup once (user action, takes several days due to Sonatype bureaucracy):
#
#  1. Create a Sonatype Central Portal account (free):
#     https://central.sonatype.com/
#     In the portal: "Register new namespace" → domain `org.zerodds`
#     Verification: set TXT record `OSSRH-XXXXXX` on zerodds.org DNS.
#     Approval time: 1-3 business days.
#
#  2. Generate a user token in the portal:
#     central.sonatype.com → View Account → Generate User Token
#     Yields a <username> + <token> pair for the portal API.
#
#  3. Create a GPG key for signing (Maven Central requires a PGP signature):
#     gpg --full-generate-key   # RSA 4096, never expires, mail-only
#     gpg --list-secret-keys --keyid-format LONG
#     gpg --armor --export-secret-keys <KEYID> > /tmp/maven-gpg.asc
#     gpg --keyserver hkps://keys.openpgp.org --send-keys <KEYID>
#     gpg --keyserver hkps://keyserver.ubuntu.com --send-keys <KEYID>
#
#  4. Set GitHub secrets:
#     SONATYPE_USERNAME       portal token username
#     SONATYPE_PASSWORD       portal token value
#     MAVEN_GPG_PRIVATE_KEY   contents of /tmp/maven-gpg.asc
#     MAVEN_GPG_PASSPHRASE    GPG key password

name: publish-maven
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + sign only, no upload"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign + deploy to Maven Central
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Sync version from Cargo.toml workspace
        run: |
          WS_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Workspace version: $WS_VERSION"
          cd crates/java-omgdds/java
          mvn -B versions:set -DnewVersion="$WS_VERSION" -DgenerateBackupPoms=false
          # Set parent-version-references too if any
          mvn -B versions:commit

      - name: Verify pom.xml has required Maven-Central metadata
        working-directory: crates/java-omgdds/java
        run: |
          # Maven Central requires: <name>, <description>, <url>, <licenses>,
          # <scm>, <developers> in pom.xml. Check and fail with a clear hint
          # if any are missing.
          missing=""
          for tag in name description url licenses scm developers; do
            if ! grep -q "<$tag>" pom.xml; then
              missing="$missing $tag"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::pom.xml missing required Maven-Central elements:$missing"
            echo "::error::See https://central.sonatype.org/publish/requirements/"
            exit 1
          fi

      - name: Build + verify
        working-directory: crates/java-omgdds/java
        run: mvn -B clean verify

      - name: Deploy to Maven Central (staged)
        if: ${{ !inputs.dry_run }}
        working-directory: crates/java-omgdds/java
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          # The central-publishing-maven-plugin (modern Sonatype path) must
          # be registered as a <plugin> in pom.xml. If not yet
          # set up: internal/packaging/language-binding-publish-followup.md
          # lists the plugin configuration.
          mvn -B -Prelease deploy

      - name: Upload Maven artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-target
          path: |
            crates/java-omgdds/java/target/*.jar
            crates/java-omgdds/java/target/*.asc
          if-no-files-found: warn
