[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerodds-wire"
# Keep aligned with workspace.package.version (PEP 440 spelling).
version = "1.0.0rc7"
description = "Shared Python XCDR runtime and generated ZeroDDS topic descriptors"
requires-python = ">=3.9"
license = "Apache-2.0"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["zerodds_wire", "zerodds_wire.*"]
exclude = ["tests", "tests.*"]
