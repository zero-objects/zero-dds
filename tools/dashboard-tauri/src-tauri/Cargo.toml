[package]
name = "zerodds-dashboard-tauri"
version = "1.0.0-rc.3"
description = "ZeroDDS live monitoring dashboard, Tauri 2.0 native shell. Embeds the zerodds-dashboard HTTP backend in-process and renders the SPA in a native window."
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
readme = "../README.md"
keywords = ["dds", "monitoring", "tauri", "native", "dashboard"]
categories = ["gui", "visualization"]
authors = ["ZeroDDS Contributors"]
publish = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
zerodds-dashboard = { path = "../../dashboard" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
