[package]
name = "zerodds-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ZeroDDS Benchmark-CLI — End-to-End Latency und Throughput auf der vollen DCPS-Pipeline."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-bench"
readme = "README.md"
keywords = ["dds", "benchmark", "latency", "throughput", "cli"]
categories = ["command-line-utilities", "development-tools::profiling"]
publish = true

[lints]
workspace = true

[[bin]]
name = "zerodds-bench"
path = "src/main.rs"

[lib]
name = "zerodds_bench"
path = "src/lib.rs"

[features]
# Same-host participants exchange every unicast datagram over a shared-memory
# channel instead of loopback UDP, as `zerodds-c-api` does by default. Without
# it this tool's peers on the same host fall back to UDP for everything they
# send it. `ZERODDS_SAME_HOST_SHM=0` turns it off at run time.
default = ["same-host-shm"]
same-host-shm = ["zerodds-dcps/same-host-shm"]

[dependencies]
zerodds-cli-common = { version = "1.0.0-rc.7", path = "../cli-common" }
zerodds-dcps       = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-rtps       = { version = "1.0.0-rc.7", path = "../../crates/rtps" }
