[package]
name = "zerodds-foreign-typeobject-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Reads a foreign vendor's samples through the TypeObject that vendor announced, fetched over TypeLookup (DDS-XTypes 1.3 §7.6.3.3)."
publish = false

[lints]
workspace = true

[[bin]]
name = "zerodds-foreign-typeobject-probe"
path = "src/main.rs"

[dependencies]
zerodds-dcps       = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-rtps       = { version = "1.0.0-rc.7", path = "../../crates/rtps" }
zerodds-types      = { version = "1.0.0-rc.7", path = "../../crates/types" }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../../crates/ast-layout" }
zerodds-wire-codec = { version = "1.0.0-rc.7", path = "../../crates/wire-codec" }
serde_json = "1"
