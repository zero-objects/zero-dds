[package]
name = "zerodds-isolation-smoke"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Isolation-matrix smoke-test runner"
publish = false

[lints]
workspace = true

[[bin]]
name = "isolation-smoke"
path = "src/main.rs"

[dependencies]
zerodds-rtps = { version = "1.0.0-rc.4", path = "../../crates/rtps" }
zerodds-transport = { version = "1.0.0-rc.4", path = "../../crates/transport" }
zerodds-transport-udp = { version = "1.0.0-rc.4", path = "../../crates/transport-udp" }
zerodds-transport-shm = { version = "1.0.0-rc.4", path = "../../crates/transport-shm" }

# UDS-Transport ist POSIX-only; auf Windows nicht in den Build aufnehmen.
[target.'cfg(unix)'.dependencies]
zerodds-transport-uds = { version = "1.0.0-rc.4", path = "../../crates/transport-uds" }

[dev-dependencies]
tempfile = "3"
