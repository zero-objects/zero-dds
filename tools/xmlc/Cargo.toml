[package]
name = "zerodds-xmlc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The ZeroDDS DDS-XML tool: validate an OMG DDS-XML 1.0 document, list its types, or render its deployment."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-xmlc"
readme = "README.md"
