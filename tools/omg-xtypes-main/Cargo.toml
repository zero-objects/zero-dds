[package]
name = "zerodds-omg-xtypes-main"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG dds-xtypes interoperability-test-suite reference client for ZeroDDS (github.com/omg-dds/dds-xtypes). BUILD + LOCAL-VALIDATE artifact — not submitted upstream."
homepage = "https://zerodds.org"
readme = "README.md"
keywords = ["dds", "xtypes", "interop", "shapes", "omg"]
categories = ["command-line-utilities", "network-programming"]
# Not published to crates.io — this is an OMG dds-xtypes interop-suite
# reference client, not a ZeroDDS product artifact. The eventual public
# name/version for an upstream submission is undecided (Sandra's call).
publish = false

[lints]
workspace = true

[lib]
name = "zerodds_omg_xtypes_main"
path = "src/lib.rs"

[[bin]]
name = "xtypes_main"
path = "src/main.rs"

[build-dependencies]
# The suite's 25 shape types are generated from
# `interop/shapes/omg-dds-xtypes.idl` rather than written by hand: this
# suite measures type assignability, so the type under test has to be the
# one this project generates. See build.rs.
zerodds-build = { version = "1.0.0-rc.7", path = "../../crates/zerodds-build" }

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
# Named by the generated types: the codec writes through `zerodds-wire`
# and the `DdsType` impl's `type_object()`/`TYPE_IDENTIFIER` through
# `zerodds-types`. `zerodds-types` is also what
# `tests/compatibility_matrix.rs` measures — the assignability
# implementation this suite exists to exercise lives there.
zerodds-wire = { version = "1.0.0-rc.7", path = "../../crates/wire" }
zerodds-types = { version = "1.0.0-rc.7", path = "../../crates/types" }
# No `clap`: the suite's options are single-dash words (`-pub`, `-domain`),
# which clap reads as clusters of short flags. `src/cli.rs` says why.
ctrlc = { workspace = true }
