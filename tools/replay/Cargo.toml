[package]
name = "zerodds-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Inspect/replay CLI for .zddsrec recordings: dump frames, replay at scaled wallclock, optional live re-injection into a DCPS domain."
homepage = "https://zerodds.org"
documentation = "https://zerodds.org/docs/tools/replay.html"
readme = "README.md"
keywords = ["dds", "replay", "recording", "diagnostics", "cli"]
categories = ["command-line-utilities", "development-tools::debugging"]
publish = true

[lints]
workspace = true

[[bin]]
name = "zerodds-replay"
path = "src/main.rs"

[dependencies]
zerodds-recorder = { version = "1.0.0-rc.7", path = "../../crates/recorder" }
# Decoded-format readers (NDJSON + SQLite → raw-CDR frames for byte-exact replay).
zerodds-recorder-decode = { version = "1.0.0-rc.7", path = "../../crates/recorder-decode" }
# Live re-injection target: re-publish recorded frames into a live DCPS domain,
# each under the representation identifier it was recorded with.
zerodds-dcps = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../../crates/rtps" }
zerodds-cli-common = { version = "1.0.0-rc.7", path = "../cli-common" }

[dev-dependencies]
# One DDS domain per test process, host-wide (the domain number is the UDP port).
zerodds-test-domains = { path = "../../crates/test-domains" }
