[package]
name = "xtypes-gap-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Feeds one DDS-XTypes 1.3 probe to this tree and prints what came back."

# Its own workspace on purpose. This is a measuring instrument for
# `tools/xtypes-1.3-gap-scan/scan.sh` and not part of the product: keeping it
# out of the root member list keeps the root `Cargo.lock` unchanged by it.
[workspace]

[dependencies]
zerodds-types = { path = "../../../crates/types" }
zerodds-ast = { path = "../../../crates/ast" }
zerodds-ast-core = { path = "../../../crates/ast-core" }
zerodds-idl-parse = { path = "../../../crates/idl-parse" }
zerodds-idl-lower = { path = "../../../crates/idl-lower" }

[profile.release]
debug = false
