[package]
name = "zerodds-idlc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The ZeroDDS IDL tool: check, lint, format, inspect and generate source from OMG IDL 4.2, and DDS 1.2 §8 DLRL object/home classes from the DLRL pragmas."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idlc"
readme = "README.md"
keywords = ["dds", "idl", "lint", "format", "omg"]
categories = ["development-tools", "command-line-utilities"]
publish = true

[lints]
workspace = true

[[bin]]
name = "zerodds-idlc"
path = "src/main.rs"

[dependencies]
zerodds-ast = { version = "1.0.0-rc.7", path = "../../crates/ast" }
zerodds-ast-core = { version = "1.0.0-rc.7", path = "../../crates/ast-core" }
zerodds-idl-cst = { version = "1.0.0-rc.7", path = "../../crates/idl-cst" }
zerodds-idl-compose = { version = "1.0.0-rc.7", path = "../../crates/idl-compose" }
zerodds-idl-lower = { version = "1.0.0-rc.7", path = "../../crates/idl-lower" }
zerodds-idl-parse = { version = "1.0.0-rc.7", path = "../../crates/idl-parse" }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../../crates/ast-layout" }
zerodds-lang-cst = { version = "1.0.0-rc.7", path = "../../crates/lang-cst" }
zerodds-lang-render = { version = "1.0.0-rc.7", path = "../../crates/lang-render" }
zerodds-lang-rules = { version = "1.0.0-rc.7", path = "../../crates/lang-rules" }
# The XTypes type system. `type_object()` in the emitted C++ trait is the
# same `from_ast::complete_type_object` blob `crates/zerodds-build` puts
# behind the Rust column's `DdsType::type_object` — one lowering of one
# model, rendered into two languages, rather than a second answer here.
zerodds-types = { version = "1.0.0-rc.7", path = "../../crates/types" }
# `dlrl`'s own text parser for the three DDS 1.2 §8 pragmas — `idlc dlrl`
# reuses it rather than routing DLRL through `idl-lower`'s AST facets,
# which already claim `DCPS_DATA_TYPE`/`DCPS_DATA_KEY` for OpenDDS's key
# dialect. `zerodds-dlrl-codegen` groups the pragmas into one entry per
# type and materialises the four language backends; `zerodds-dlrl` itself
# is the direct dependency for `DlrlPragma`/`parse_pragma`, which the
# codegen crate does not re-export.
zerodds-dlrl = { version = "1.0.0-rc.7", path = "../../crates/dlrl" }
zerodds-dlrl-codegen = { version = "1.0.0-rc.7", path = "../../crates/dlrl-codegen" }

[dev-dependencies]
# `tests/dialect_byte_equality.rs`'s comparison target: the same
# reflective encoder `wireprobe-zerodds --dialect <d>` runs, called in
# process instead of through a second binary.
zerodds-wire-probe = { path = "../../crates/wire-probe" }
# `tests/dialect_c_byte_equality.rs` names `zerodds_wire::PidFlagPolicy`
# directly, to spell the C harness's framing from the same enum
# `ProbeRequest::pl_cdr1_framing` returns rather than a copy of its names.
zerodds-wire = { version = "1.0.0-rc.7", path = "../../crates/wire" }
serde_json = "1.0"
