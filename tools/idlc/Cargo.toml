[package]
name = "zerodds-idlc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ZeroDDS IDL4 compiler CLI — Backends fuer C, C++, C#, Java, Python, Rust ueber zerodds-idl-* Codegen-Crates."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-idlc"
readme = "README.md"
keywords = ["dds", "idl", "compiler", "codegen", "omg"]
categories = ["development-tools", "command-line-utilities"]
publish = true

[lints]
workspace = true

[features]
# Built-in default extensibility for an un-annotated aggregate when no
# `--default-extensibility` CLI flag is given (XTypes 1.3 §7.3.3.1 leaves it
# implementation-defined; vendors disagree — FastDDS/spec lean @appendable,
# Cyclone defaults @final). Exactly one should be active; the `--default-
# extensibility` CLI flag overrides this at runtime regardless.
default = ["ext-default-appendable"]
ext-default-appendable = []
ext-default-final = []
ext-default-mutable = []

[[bin]]
name = "zerodds-idlc"
path = "src/main.rs"

[dependencies]
zerodds-idl = { version = "1.0.0-rc.5", path = "../../crates/idl" }
zerodds-idl-cpp = { version = "1.0.0-rc.5", path = "../../crates/idl-cpp" }
zerodds-idl-csharp = { version = "1.0.0-rc.5", path = "../../crates/idl-csharp" }
zerodds-idl-java = { version = "1.0.0-rc.5", path = "../../crates/idl-java" }
zerodds-idl-python = { version = "1.0.0-rc.5", path = "../../crates/idl-python" }
zerodds-idl-rust = { version = "1.0.0-rc.5", path = "../../crates/idl-rust" }
zerodds-idl-ts = { version = "1.0.0-rc.5", path = "../../crates/idl-ts" }
zerodds-corba-rust = { version = "1.0.0-rc.5", path = "../../crates/corba-rust" }

[dev-dependencies]
tempfile = "3"
