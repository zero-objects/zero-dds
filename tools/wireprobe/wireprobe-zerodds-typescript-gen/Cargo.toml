[package]
name = "zerodds-wireprobe-typescript-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Generates the TypeScript compilation unit the ZeroDDS TypeScript wire probe compiles: the types, the codec, and the sample one values.json fills."
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "zerodds_wireprobe_typescript_gen"
path = "src/lib.rs"

[[bin]]
name = "wireprobe-zerodds-typescript-gen"
path = "src/main.rs"

[dependencies]
zerodds-ast = { path = "../../../crates/ast", version = "1.0.0-rc.7" }
zerodds-ast-core = { path = "../../../crates/ast-core", version = "1.0.0-rc.7" }
zerodds-ast-layout = { path = "../../../crates/ast-layout", version = "1.0.0-rc.7" }
zerodds-lang-cst = { path = "../../../crates/lang-cst", version = "1.0.0-rc.7" }
zerodds-lang-render = { path = "../../../crates/lang-render", version = "1.0.0-rc.7" }
zerodds-lang-rules = { path = "../../../crates/lang-rules", version = "1.0.0-rc.7" }
zerodds-wire-probe = { path = "../../../crates/wire-probe", version = "1.0.0-rc.7" }
zerodds-wireprobe-gen = { path = "../wireprobe-zerodds-gen", version = "1.0.0-rc.7" }
serde_json = "1"

[lints]
workspace = true
