[package]
name = "zerodds-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ZeroDDS Admin-CLI — Domain-Inspector, QoS-Validator, Discovery-Snapshot."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-admin"
readme = "README.md"
keywords = ["dds", "admin", "cli", "operations", "tooling"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[lints]
workspace = true

[[bin]]
name = "zerodds-admin"
path = "src/main.rs"

[features]
# Same-host participants exchange every unicast datagram over a shared-memory
# channel instead of loopback UDP, as `zerodds-c-api` does by default. Without
# it this tool's peers on the same host fall back to UDP for everything they
# send it. `ZERODDS_SAME_HOST_SHM=0` turns it off at run time.
default = ["same-host-shm"]
same-host-shm = ["zerodds-dcps/same-host-shm"]

[dependencies]
zerodds-xml = { version = "1.0.0-rc.7", path = "../../crates/xml" }
zerodds-qos = { version = "1.0.0-rc.7", path = "../../crates/qos" }
zerodds-cli-common = { version = "1.0.0-rc.7", path = "../cli-common" }
zerodds-dcps = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-discovery = { version = "1.0.0-rc.7", path = "../../crates/discovery" }

[dev-dependencies]
