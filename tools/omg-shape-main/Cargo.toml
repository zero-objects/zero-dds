[package]
name = "zerodds-omg-shape-main"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OMG dds-rtps interoperability-test-suite shape_main reference client for ZeroDDS (github.com/omg-dds/dds-rtps). BUILD + LOCAL-VALIDATE artifact — not yet submitted upstream."
homepage = "https://zerodds.org"
readme = "README.md"
keywords = ["dds", "rtps", "interop", "shapes", "omg"]
categories = ["command-line-utilities", "network-programming"]
# Not published to crates.io — this is an OMG dds-rtps interop-suite
# reference client, not a ZeroDDS product artifact. The eventual public
# name/version for the upstream submission is undecided (Sandra's call).
publish = false

[lints]
workspace = true

[[bin]]
name = "shape_main"
path = "src/main.rs"

[build-dependencies]
# The suite's `ShapeType` is generated from `interop/shapes/omg-dds-rtps.idl`
# rather than taken from `zerodds_dcps::interop`: a suite run has to measure
# what this project generates, not what someone wrote beside it. See build.rs.
zerodds-build = { version = "1.0.0-rc.7", path = "../../crates/zerodds-build" }

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
# `PlCdr1Reading` of the setting `wire.pl_cdr1_reading` (`suite_settings`).
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../../crates/ast-layout" }
# `GroupWireForm` and the `VendorId`s it is set for (`group_wire_forms`).
zerodds-rtps = { version = "1.0.0-rc.7", path = "../../crates/rtps" }
zerodds-qos  = { version = "1.0.0-rc.7", path = "../../crates/qos" }
zerodds-sql-filter = { version = "1.0.0-rc.7", path = "../../crates/sql-filter" }
# Named by the generated `ShapeType`: the codec writes through `zerodds-wire`
# and the `DdsType` impl's `type_object()` through `zerodds-types`.
zerodds-wire = { version = "1.0.0-rc.7", path = "../../crates/wire" }
zerodds-types = { version = "1.0.0-rc.7", path = "../../crates/types" }
clap  = { version = "4", features = ["derive"] }
ctrlc = { workspace = true }
