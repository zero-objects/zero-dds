[package]
name = "zerodds-snitch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ZeroDDS Discovery-Probe — entdeckt SPDP-Participants und SEDP-Endpoints im DDS-Domain."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-snitch"
readme = "README.md"
keywords = ["dds", "discovery", "spdp", "sedp", "cli"]
categories = ["command-line-utilities", "network-programming"]
publish = true

[lints]
workspace = true

[[bin]]
name = "zerodds-snitch"
path = "src/main.rs"

[lib]
name = "zerodds_snitch"
path = "src/lib.rs"

[features]
# Same-host participants exchange every unicast datagram over a shared-memory
# channel instead of loopback UDP, as `zerodds-c-api` does by default. Without
# it this tool's peers on the same host fall back to UDP for everything they
# send it. `ZERODDS_SAME_HOST_SHM=0` turns it off at run time.
default = ["same-host-shm"]
same-host-shm = ["zerodds-dcps/same-host-shm"]

[dependencies]
zerodds-cli-common = { version = "1.0.0-rc.7", path = "../cli-common" }
zerodds-dcps       = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-discovery  = { version = "1.0.0-rc.7", path = "../../crates/discovery" }
