[package]
name = "zerodds-recorder-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Live recorder daemon: subscribes to a configured set of DDS topics and writes received samples to a .zddsrec file."
homepage = "https://zerodds.org"
documentation = "https://zerodds.org/docs/tools/recorder-bridge.html"
readme = "README.md"
keywords = ["dds", "recording", "diagnostics", "monitoring", "cli"]
categories = ["command-line-utilities", "development-tools::debugging"]
publish = true

[lints]
workspace = true

[[bin]]
name = "zerodds-recorder-bridge"
path = "src/main.rs"

[dependencies]
zerodds-recorder = { version = "1.0.0-rc.7", path = "../../crates/recorder" }
# The runtime the readers live in: a sample comes with the representation
# identifier of its encapsulation header, which the recording keeps.
zerodds-dcps = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../../crates/rtps" }
zerodds-cli-common = { version = "1.0.0-rc.7", path = "../cli-common" }
