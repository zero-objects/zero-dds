[package]
name = "zerodds-bench-suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Structured benchmark suite for ZeroDDS: sub-microsecond roundtrip latency, transport throughput, RTPS fragmentation, typed end-to-end CDR encode/decode."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-bench-suite"
readme = "README.md"
keywords = ["dds", "benchmark", "performance", "latency", "throughput"]
categories = ["development-tools::profiling", "command-line-utilities"]
publish = true

# bench-suite is available as a library (`zerodds-bench-suite`) on crates.io
# but the two [[bin]] targets `roundtrip-1us` and
# `roundtrip-typed` are internal ddsperf-style apples-to-apples interop
# benches and do NOT belong in the binary release archives (cargo-dist).
# The user-facing latency/throughput bench is `tools/bench/` (zerodds-bench).
[package.metadata.dist]
dist = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[build-dependencies]
# `RoundtripBench::Roundtrip` is generated from `idl/roundtrip.idl`, which
# the build holds equal to `tests/perf/dds-roundtrip-bench/roundtrip.idl`,
# the file the Cyclone, RTI and Fast DDS apps of this bench compile — an
# apples-to-apples number needs both apples out of one IDL. See build.rs.
zerodds-build = { version = "1.0.0-rc.7", path = "../../crates/zerodds-build" }


[dependencies]
zerodds-rtps = { version = "1.0.0-rc.7", path = "../../crates/rtps" }
zerodds-transport = { version = "1.0.0-rc.7", path = "../../crates/transport" }
zerodds-transport-udp = { version = "1.0.0-rc.7", path = "../../crates/transport-udp" }
zerodds-transport-shm = { version = "1.0.0-rc.7", path = "../../crates/transport-shm" }
zerodds-transport-tcp = { version = "1.0.0-rc.7", path = "../../crates/transport-tcp" }
# Latency histograms: pure-Rust HdrHistogram port, dev-+bin-only.
hdrhistogram = { version = "7.5", default-features = false }
# DCPS-stack roundtrip via the C-FFI hub.
zerodds = { version = "1.0.0-rc.7", path = "../../crates/zerodds-c-api", package = "zerodds-c-api" }
# Typed roundtrip: full XCDR2 encode/decode path, apples-to-apples
# with Cyclone / RTI / FastDDS custom apps.
zerodds-dcps = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-wire = { version = "1.0.0-rc.7", path = "../../crates/wire" }
zerodds-types = { version = "1.0.0-rc.7", path = "../../crates/types" }

# UDS transport is Unix-only (`#![cfg(unix)]` crate-level). The bench file
# `transports_e2e` cfg-gates its UDS sections accordingly.
[target.'cfg(unix)'.dependencies]
zerodds-transport-uds = { version = "1.0.0-rc.7", path = "../../crates/transport-uds" }

[dev-dependencies]
criterion = { workspace = true }

[[bin]]
name = "roundtrip-1us"
path = "src/bin/roundtrip_1us.rs"

[[bin]]
name = "roundtrip-typed"
path = "src/bin/roundtrip_typed.rs"

# Internal regression gate (CI): transport x payload floor latency, with a
# minimum gate.
[[bin]]
name = "regression"
path = "src/bin/regression.rs"

[[bench]]
name = "transports_e2e"
harness = false

[[bench]]
name = "rtps_fragmented"
harness = false

# Wave 4 validation - the headline bench (Bench-A1).
[[bench]]
name = "dcps_roundtrip_shm_vs_udp"
harness = false

# C-FFI Opt-1 validation (Bench-A2).
[[bench]]
name = "cffi_take_vs_loan"
harness = false

# Opt-2/Int-1 Linux-only validation (Bench-A3).
[[bench]]
name = "recvmmsg_on_off"
harness = false

# Opt-3 multi-thread pool scaling (Bench-A4).
[[bench]]
name = "recv_threads_sweep"
harness = false

[features]
default = []
# Bench-A1, A3 and A4 need DCPS features.
same-host-shm = ["zerodds-dcps/same-host-shm"]
recvmmsg-batch = ["zerodds-dcps/recvmmsg-batch", "zerodds-transport-udp/recvmmsg-batch"]
