[package]
name = "zerodds-spy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ZeroDDS Topic-Spy — abonniert beliebige DDS-Topics und dumpt Samples (hex / size / count)."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-spy"
readme = "README.md"
keywords = ["dds", "spy", "subscribe", "tcpdump", "cli"]
categories = ["command-line-utilities", "network-programming"]
publish = true

[lints]
workspace = true

[[bin]]
name = "zerodds-spy"
path = "src/main.rs"

[lib]
name = "zerodds_spy"
path = "src/lib.rs"

[features]
# Same-host participants exchange every unicast datagram over a shared-memory
# channel instead of loopback UDP, as `zerodds-c-api` does by default. Without
# it this tool's peers on the same host fall back to UDP for everything they
# send it. `ZERODDS_SAME_HOST_SHM=0` turns it off at run time.
default = ["same-host-shm"]
same-host-shm = ["zerodds-dcps/same-host-shm"]

[dependencies]
zerodds-cli-common = { version = "1.0.0-rc.7", path = "../cli-common" }
zerodds-dcps       = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-recorder-decode = { version = "1.0.0-rc.7", path = "../../crates/recorder-decode" }
zerodds-wire-codec = { version = "1.0.0-rc.7", path = "../../crates/wire-codec" }
zerodds-ast-layout = { version = "1.0.0-rc.7", path = "../../crates/ast-layout" }
zerodds-types      = { version = "1.0.0-rc.7", path = "../../crates/types", default-features = false, features = ["std"] }
