[package]
name = "amqp-dds-endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "DDS-AMQP 1.0 Endpoint daemon: synchronous std-only TCP/TLS server bridging AMQP 1.0 brokers to DDS topics per OMG DDS-AMQP 1.0 §2.1."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/amqp-dds-endpoint"
readme = "README.md"
keywords = ["dds", "amqp", "bridge", "endpoint", "messaging"]
categories = ["network-programming", "command-line-utilities"]
publish = true

[lints]
workspace = true

[[bin]]
name = "amqp-dds-endpoint"
path = "src/main.rs"
required-features = ["tls"]

[lib]
path = "src/lib.rs"

[features]
default = ["tls"]
# Spec §10.1 — TLS bracket via rustls. Enables real
# TLS termination (TLS 1.2/1.3) both server side and
# outbound bridge side. Self-signed certs in tests via rcgen.
tls = ["dep:rustls", "dep:rustls-pemfile", "dep:zerodds-bridge-security"]

[dependencies]
zerodds-amqp-bridge = { version = "1.0.0-rc.7", path = "../../crates/amqp-bridge", default-features = false, features = ["alloc", "std"] }
zerodds-amqp-endpoint = { version = "1.0.0-rc.7", path = "../../crates/amqp-endpoint", default-features = false, features = ["std"] }
# Spec §10.1 — TLS bracket. rustls 0.23 is the current
# stable line; internally it uses rustls-webpki 0.102, which
# coexists in parallel with 0.103 in the security-pki crate.
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
# The CSPRNG of the TLS provider: the SCRAM server nonce (src/auth.rs).
zerodds-bridge-security = { version = "1.0.0-rc.7", path = "../../crates/bridge-security", optional = true }
# SIGTERM/SIGINT: the accept loop stops.
signal-hook = { workspace = true }

[dev-dependencies]
# Self-signed cert generation for TLS tests.
rcgen = "0.13"
