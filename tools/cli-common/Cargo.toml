[package]
name = "zerodds-cli-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared CLI primitives for ZeroDDS tools (signal handler, GUID generation, duration parsing, untyped reader config)."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-cli-common"
readme = "README.md"
keywords = ["dds", "cli", "zerodds", "internal"]
categories = ["command-line-utilities", "development-tools"]
publish = true

# This crate is primarily intended for internal ZeroDDS tools, but it
# contains no secret or unfinished paths — the 5 helpers are
# stable APIs (parse_duration, install_signal_handler, stable_prefix,
# participant_guid, raw_reader_config) and are published publicly so that
# the dependent `zerodds-record/-bench/-monitor/-spy/-snitch/-pcap/-mq`
# crates on crates.io resolve.

[lints]
workspace = true

[dependencies]
zerodds-dcps = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
zerodds-qos  = { version = "1.0.0-rc.7", path = "../../crates/qos" }
zerodds-rtps = { version = "1.0.0-rc.7", path = "../../crates/rtps" }
zerodds-types = { version = "1.0.0-rc.7", path = "../../crates/types", default-features = false, features = ["std"] }
libc          = { workspace = true }
