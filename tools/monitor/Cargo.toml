[package]
name = "zerodds-monitor-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ZeroDDS monitoring CLI — live snapshot or Prometheus /metrics server for the ZeroDDS runtime."
homepage = "https://zerodds.org"
documentation = "https://docs.rs/zerodds-monitor"
readme = "README.md"
keywords = ["dds", "monitor", "prometheus", "metrics", "cli"]
categories = ["command-line-utilities", "development-tools::profiling"]
publish = true

[lints]
workspace = true

[[bin]]
name = "zerodds-monitor"
path = "src/main.rs"
# The bin's doc output would be `zerodds_monitor`, the name of the lib of
# crates/monitor: rustdoc writes both into one directory.
doc = false

[lib]
name = "zerodds_monitor_cli"
path = "src/lib.rs"

[features]
# Same-host participants exchange every unicast datagram over a shared-memory
# channel instead of loopback UDP, as `zerodds-c-api` does by default. Without
# it this tool's peers on the same host fall back to UDP for everything they
# send it. `ZERODDS_SAME_HOST_SHM=0` turns it off at run time.
default = ["same-host-shm"]
same-host-shm = ["zerodds-dcps/same-host-shm"]

[dependencies]
zerodds-cli-common  = { version = "1.0.0-rc.7", path = "../cli-common" }
zerodds-monitor-lib = { version = "1.0.0-rc.7", path = "../../crates/monitor", package = "zerodds-monitor" }
zerodds-dcps        = { version = "1.0.0-rc.7", path = "../../crates/dcps" }
