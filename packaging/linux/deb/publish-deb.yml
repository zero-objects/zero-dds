# cargo-dist publish-job for Debian/Ubuntu .deb packages.
# Wired into [workspace.metadata.dist].publish-jobs in Cargo.toml.
# Spec: zerodds-deployment-1.0.md §2.2.1.
name: publish-deb
on:
  workflow_call:
    inputs:
      plan:
        description: "cargo-dist plan JSON"
        required: true
        type: string

jobs:
  build-deb:
    name: Build .deb (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential debhelper devscripts dpkg-dev fakeroot \
              pkg-config libssl-dev
      - name: cargo build (release)
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}
      - name: Assemble debs (per sub-package)
        run: |
          bash packaging/linux/deb/assemble-debs.sh \
               --target ${{ matrix.target }} \
               --version ${{ github.ref_name }} \
               --out dist/
      # APT-Repo wird auf packages.zerodds.org via Pull-Deploy
      # (nr3 cron alle 5 min) gebaut, nicht in CI gepusht. Hier nur
      # die .deb-Files als GH-Release-Asset hochladen — der
      # Pull-Deploy zieht sie und signiert lokal mit dem Server-GPG-Key.
      - name: Upload artifacts (release attachments)
        uses: actions/upload-artifact@v4
        with:
          name: zerodds-deb-${{ matrix.target }}
          path: dist/*.deb
