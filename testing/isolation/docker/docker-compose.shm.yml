# ⚠  TESTING-ONLY — NOT FOR PRODUCTION DEPLOYMENT  ⚠
#
# `ipc: host` and the bind mount of /dev/shm open the IPC boundaries
# of the host system for both containers. A malicious container
# can thereby read other SHM consumers (ROS nodes, PostgreSQL,
# Chromium render processes). This Compose file is
# intended exclusively for the isolation smoke tests of the ZeroDDS pipeline
# (phase2-0-smells #13). For production SHM deployments
# a separate namespace per pair and a dedicated volume
# mount (not /dev/shm) must be used.
#
# L3 SHM smoke test: two containers with a shared `/dev/shm`.
#
# Both containers mount `/dev/shm` from the host — this is the
# standard Docker pattern for cross-container POSIX SHM. On
# Kubernetes: `emptyDir.medium: Memory` with `subPathExpr`,
# shared via a shared PVC.
#
# Run:
#   docker compose -f docker-compose.shm.yml up --build \
#          --abort-on-container-exit --exit-code-from sender
services:
  receiver:
    build:
      context: ../../..
      dockerfile: testing/isolation/docker/Dockerfile
    command:
      - "--transport=shm"
      - "--role=receiver"
      - "--local-id=70"
      - "--peer-id=71"
      - "--base-dir=/dev/shm/zerodds-l3-shm"
      - "--count=20"
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
    ipc: host

  sender:
    build:
      context: ../../..
      dockerfile: testing/isolation/docker/Dockerfile
    command:
      - "--transport=shm"
      - "--role=sender"
      - "--local-id=71"
      - "--peer-id=70"
      - "--base-dir=/dev/shm/zerodds-l3-shm"
      - "--count=20"
    volumes:
      - type: bind
        source: /dev/shm
        target: /dev/shm
    ipc: host
    depends_on:
      - receiver
