[package]
name = "zerodds-endpoint-golden"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Generates XCDR2 golden byte vectors (LE + BE) from the ZeroDDS Rust core, so the native endpoint SDKs (ADR 0013) can be proven byte-identical."
publish = false

[package.metadata.dist]
dist = false

[lints]
workspace = true

[[bin]]
name = "zerodds-endpoint-golden"
path = "src/main.rs"

[dependencies]
zerodds-wire = { version = "1.0.0-rc.7", path = "../../crates/wire" }
zerodds-xrce = { version = "1.0.0-rc.7", path = "../../crates/xrce" }
zerodds-xrce-client = { version = "1.0.0-rc.7", path = "../../crates/xrce-client" }
