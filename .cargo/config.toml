# Workspace-wide Cargo configuration.

[build]
# Single target dir for cache reuse across CI jobs.
# target-dir = "target"

[net]
git-fetch-with-cli = true

# Cross-compile linker (TS-6 stage 1, aarch64-Linux).
# Prerequisite: `apt install gcc-aarch64-linux-gnu` (CI image
# `ci/Dockerfile.rust` layer 1).
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
