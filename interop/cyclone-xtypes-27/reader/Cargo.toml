# Standalone reproducer crate for the CycloneDDS XTypes interop matrix (#27).
# Own `[workspace]` table so it is excluded from the parent workspace and
# never built by a normal `cargo build` at the repo root — it is driven only
# by `run_matrix.sh`, which selects the case's extensibility through
# `ZERODDS_ROBOT_EXTENSIBILITY` (see build.rs).
[package]
name = "cyclone27-reader"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
zerodds-dcps = { path = "../../../crates/dcps" }
zerodds-wire = { path = "../../../crates/wire" }
zerodds-types = { path = "../../../crates/types" }

[build-dependencies]
zerodds-build = { path = "../../../crates/zerodds-build" }

[[bin]]
name = "reader"
path = "src/main.rs"

[[bin]]
name = "writer"
path = "src/writer.rs"

[workspace]
