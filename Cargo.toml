[workspace]
resolver = "2"
members = [
    # Clean-slate rebuild. The common AST is the new foundation; every other
    # crate re-enters this list as it is re-attached to it, one at a time.
    # The pre-demolition member list is preserved in git history at e1f3af895.
    "crates/ast-core",
    # Test scaffolding: leases a DDS domain to one process at a time.
    "crates/config",
    "crates/test-domains",
    # Test scaffolding: drives a DDS reader of another vendor.
    "crates/test-vendor-reader",
    "crates/float128",
    "crates/ast",
    "crates/ast-layout",
    "crates/idl-cst",
    "crates/idl-parse",
    "crates/idl-lower",
    "crates/lang-cst",
    "crates/lang-render",
    "crates/lang-rules",
    "crates/wire",
    # The plan executor: one layout plan, one value, the bytes between
    # them, in both directions and over any value representation.
    "crates/wire-codec",
    "crates/qos",
    "crates/durability-store",
    "crates/durability-store-file",
    "crates/durability-store-sqlite",
    "crates/durability-store-postgres",
    "crates/durability-store-lakehouse",
    "crates/corba-rt",
    "crates/corba-giop",
    "crates/corba-csiv2",
    "crates/corba-cos-notify",
    "crates/corba-cos-transactions",
    # The four of the CORBA family that never named `cdr`, `idl` or
    # `idl-rust` at all: the Interface Repository, the Event and Trading
    # services, and the POA. Their row in docs/OPEN-ITEMS.md said "deps
    # present" and it was right — this line is the whole port.
    "crates/corba-ir",
    "crates/corba-poa",
    "crates/corba-cos-event",
    "crates/corba-cos-trading",
    # The IDL → Rust service generator, over the model and the Annex
    # A.1 tables rather than over a parse tree and ten thread-locals.
    "crates/corba-rust",
    # The component container, the CIF and the DynAny walker.
    "crates/corba-ccm",
    # The IIOP transport, the IOR stack and the naming service. Their
    # `cdr` half was thirty-one lines across three crates.
    "crates/corba-iiop",
    "crates/corba-ior",
    "crates/corba-cosnaming",
    # The GIOP↔DDS bridge, the deployment-and-configuration host, and
    # the two CCM libraries. None of the four named `cdr` at all
    # except the bridge, and the bridge named it for `Endianness`.
    "crates/corba-dds-bridge",
    "crates/corba-dnc",
    "crates/corba-ccm-ejb",
    "crates/corba-ccm-lib",
    # The cross-ORB harness: the feature-matrix IDL through both
    # columns, and the live sessions against omniORB, TAO and JacORB.
    "crates/corba-interop",
    "endpoints/rust",
    # The component model and its asynchronous invocation mapping, back on
    # `idl-parse` + `idl-lower` — step 2 of docs/rebuild-plan.md.
    "crates/ccm",
    "crates/ami4ccm",
    "endpoints/codegen",
    # The AMQP 1.0 endpoint stack and its daemon. The endpoint's only tie to
    # the frontend is the Annex-A round-trip test, which parses the
    # specification's own IDL.
    "crates/foundation",
    "crates/amqp-bridge",
    "crates/amqp-0-9-1",
    "crates/bridge-security",
    "crates/monitor",
    "crates/observability-otlp",
    "crates/amqp-endpoint",
    "tools/amqp-dds-endpoint",
    # Zero-copy same-host shared memory. Independent of the type system and
    # of `wire` — step 4 of docs/rebuild-plan.md.
    "crates/flatdata",
    "crates/flatdata-derive",
    # External iceoryx2 oracle — standalone consumer (iceoryx2-only, zero
    # ZeroDDS deps) that reads a ZeroDDS-published sample over iceoryx2 SHM.
    # `proofs/iceoryx2_external_oracle.sh` builds it with `-p`, which needs
    # membership.
    "tools/iceoryx2-oracle-consumer",
    # The XTypes 1.3 type system: TypeIdentifier, TypeObject, the
    # assignability rules, the runtime DynamicType — step 3 of
    # docs/rebuild-plan.md.
    "crates/types",
    # The CORBA Annex A.1 tables and the stub and skeleton mappings, over
    # the rebuilt AST — step 5 of docs/rebuild-plan.md.
    "crates/corba-codegen",
    "tools/qos-matrix",
    "crates/wire-conformance",
    "crates/wire-probe",
    # The DDSI-RTPS 2.5 wire stack — step 6 of docs/rebuild-plan.md.
    # Its `cdr` half was sixteen lines; what it brought is 2,114 RTPS
    # datagrams six foreign stacks put on a socket, decoded and written
    # back octet for octet.
    "crates/rtps",
    # SPDP, SEDP, the TypeLookup service and the DDS-Security builtin
    # endpoints — step 7 of docs/rebuild-plan.md. Adding this one line
    # also makes members of its path dependencies: `crates/security`,
    # `crates/transport`, `crates/transport-udp`, `crates/security-pki`,
    # `crates/security-keyexchange` and `crates/inspect-endpoint`.
    "crates/discovery",
    # The DCPS public API and its runtime — step 8 of
    # docs/rebuild-plan.md. Adding this one line also makes members of
    # `crates/sql-filter`, `crates/transport-tcp` and `crates/recorder`.
    "crates/dcps",
    # The benchmark harness. It is a path dependency of no member, so the
    # automatic membership that carries the transport and security crates
    # in never reached it; it builds clean and was simply never named.
    # `crates/zerodds-build` stays out: it depends on `crates/idl-compose`,
    # which the demolition removed and nothing has rebuilt.
    "tools/bench-suite",
    # The recording decoder and the three tools built on it. What kept all
    # four out was one manifest line: `recorder-decode` named `zerodds-cdr`
    # as a dependency and used it in no source file. The crate it named is
    # not in this tree, so the four failed to resolve rather than to
    # compile. Dropping the line is the whole port.
    "crates/recorder-decode",
    "tools/record",
    "tools/foreign-typeobject-probe",
    "tools/replay",
    "tools/spy",
    # The IDL tool. Four of its subcommands — check, lint, dump-ast,
    # print-deps — need the front end and nothing else, which is why it
    # comes back before the language backends do rather than after them:
    # `generate` is the one that needs those, and it is the part that is
    # not here yet.
    "tools/idlc",
    # The DDS-XML tool. `crates/xml` is a member, so this waited on
    # nothing at all.
    "tools/xmlc",
    # DLRL code generation. `crates/dlrl` is a member; this waited on
    # nothing either.
    "crates/dlrl-codegen",
    # The shared IDL composition pipeline. Four of the five things it
    # used to do have moved into the front end since; what is left is the
    # composition itself, and `crates/zerodds-build` waited on it.
    "crates/idl-compose",
    # DDS-XML type definitions into the same model `crates/idl-compose`
    # fills from IDL. Beside it rather than inside `crates/xml`: the
    # descriptive `TypeLibrary` there is a published API that drops
    # `tryConstruct`, `hashid`, `autoid` and the int8/uint8 primitives,
    # and widening it would change every signature its callers compile
    # against.
    "crates/xml-compose",
    # The `build.rs` helper. It waited on `crates/idl-compose` and on
    # nothing else.
    "crates/zerodds-build",
    # `crates/rmw-zerodds-shim`. Its `build.rs` regenerates
    # `include/rmw_zerodds.h` from `src/lib.rs` on every build, and the
    # committed header was nine lines behind the source: #31 translated
    # `src/lib.rs` and edited the generated header by hand at `29fa654c1`
    # rather than regenerating it, so nine German doc lines stayed in a
    # public C header. Regenerated in this commit, which is what the
    # membership waited on.
    "crates/rmw-zerodds-shim",
    # `crates/conformance`. Its library and three of its four test files
    # never stopped working; the fourth, `cross_language_xcdr2.rs`, was a
    # shell with nothing left inside it — see the commit that removed it.
    "crates/conformance",
    "crates/spatial-dds",
    "crates/spatial-ros2",
    # DDS-XML 1.0 and DDS-XRCE 1.0 — the two building blocks that waited
    # on `crates/types` and on nothing else, plus the XRCE agent and
    # client built on the codec.
    "crates/xml",
    "crates/xrce",
    "crates/xrce-agent",
    "crates/xrce-client",
    # The sixth of that group. It waited on `zerodds_types::dynamic`,
    # which is a directory with seven files in it since step 3 finished,
    # and what it cost was a port and not a recompile: with the module
    # empty the crate produced five `E0432`/`E0433` on the one path, and
    # with it present twenty-six, because a `TypeDescriptor` used to be a
    # constructor and is a record read off the model now. Its `Registry`
    # builds every message into one model — a message field that names
    # another message needs both types in one — and the byte-identity
    # test holds the result against the same data model written as IDL
    # and lowered by the front end.
    "crates/proto",
    # The three protocol bridges. Their port surface was nil — none of the
    # three names `cdr` or `idl` anywhere in its sources; the only thing
    # that kept them out was the `daemon` feature's path dep on
    # `crates/dcps`, which is a member since 230e7ad9c.
    "crates/coap-bridge",
    "crates/mqtt-bridge",
    "crates/websocket-bridge",
    # The gRPC bridge and the two crates it sits on. None of the three
    # names `cdr` or `idl`; `crates/http2` and `crates/hpack` have no
    # ZeroDDS dependency at all.
    "crates/hpack",
    "crates/http2",
    "crates/grpc-bridge",
    # The routing service. Its `cdr` half was one file — the shape-driven
    # body codec in `src/transform/codec.rs`.
    "crates/routing-service",
    # DDS-RPC 1.0. Its service model was lowered from the old syntax tree
    # and is now lowered from the common AST.
    "crates/rpc",
    # Compiles and runs the DDS-RPC 1.0 Rust binding `zerodds-idlc
    # generate --lang rust` writes, over a real `DcpsRuntime` on
    # loopback — the gate a name comparison of `crates/rpc`'s own tests
    # cannot be, the same reason `crates/wire-conformance` exists for
    # the data codec.
    "crates/rpc-rust-e2e",
    # The C column's generator. Under tools/ rather than crates/ because it
    # is a probe harness and not part of the library surface.
    # The fifteen hand-written endpoint bindings, against the corpus
    # rather than against their two reference files.
    "tools/wireprobe/wireprobe-endpoint-gen",
    # The stem the five codec columns' generators are renderers on.
    "tools/wireprobe/wireprobe-zerodds-gen",
    "tools/wireprobe/wireprobe-zerodds-ada-gen",
    "tools/wireprobe/wireprobe-zerodds-ada83-gen",
    "tools/wireprobe/wireprobe-zerodds-c-gen",
    "tools/wireprobe/wireprobe-zerodds-cpp-gen",
    "tools/wireprobe/wireprobe-zerodds-csharp-gen",
    "tools/wireprobe/wireprobe-zerodds-d-gen",
    "tools/wireprobe/wireprobe-zerodds-elixir-gen",
    "tools/wireprobe/wireprobe-zerodds-fsharp-gen",
    "tools/wireprobe/wireprobe-zerodds-go-gen",
    "tools/wireprobe/wireprobe-zerodds-nim-gen",
    "tools/wireprobe/wireprobe-zerodds-java-gen",
    "tools/wireprobe/wireprobe-zerodds-julia-gen",
    "tools/wireprobe/wireprobe-zerodds-kotlin-gen",
    "tools/wireprobe/wireprobe-zerodds-lua-gen",
    "tools/wireprobe/wireprobe-zerodds-node-gen",
    "tools/wireprobe/wireprobe-zerodds-ocaml-gen",
    "tools/wireprobe/wireprobe-zerodds-python-gen",
    "tools/wireprobe/wireprobe-zerodds-swift-gen",
    "tools/wireprobe/wireprobe-zerodds-typescript-gen",
    "tools/wireprobe/wireprobe-zerodds-zig-gen",
    # The result tree and the two tables generated from it. Under tools/
    # for the same reason: it is a harness over the corpus and not part
    # of the library surface.
    "tools/interop-results",
    # The C interface and the C++ headers over it. Their `cdr` half was
    # two lines in one content-filter row decoder, and the alignment
    # bound in them was the whole port: `BufferReader::new(..).xcdr2()`
    # capped alignment at four and `Reader::new` caps it at eight, so the
    # bound is now passed rather than assumed.
    "crates/zerodds-c-api",
    "crates/cpp",
    # The browser half of the TypeScript binding: the XCDR codec that runs
    # inside the page, since a browser has no socket to run DDS over. Its
    # `cdr` half is the whole port — `zerodds-wire`'s `Writer`/`Reader` are
    # the runtime the generated Rust encoders already call, so a value
    # encoded in the page is the value a native peer decodes.
    "crates/ts-wasm",
    # The Python binding. Without `--features extension-module` it is a
    # placeholder lib over `crates/dcps`, which is what a workspace build
    # compiles; the extension module is built by maturin.
    "crates/py",
    # The rest of step 6. Thirty-seven packages, and the shape of the
    # work is the one every step before it found: the port surface is
    # not where the table says it is.
    #
    # Thirty-four of the thirty-seven name none of `zerodds_cdr`,
    # `BufferReader`, `BufferWriter` or `zerodds_idl` anywhere. For
    # thirty-two of those the line below is the whole port. The other
    # two had drifted against a crate the rebuild changed rather than
    # against `cdr`:
    # `tools/pcap` matched `dg.submessages` as `ParsedSubmessage` where
    # `crates/rtps` now yields a `SubmessageFrame` (and
    # `ParsedSubmessage::Unknown` grew a `body`), and `tools/admin`
    # read `DomainEntry::domain_id` and `DomainParticipantEntry::
    # domain_ref` as required where `crates/xml` now makes both
    # optional — DDS-XML §7.3.4.4.2 and §7.3.5.4.2 say they are.
    "crates/chaos-clock-skew",
    "crates/dcps-async",
    "crates/dlrl",
    "crates/dotnet-build-lock",
    "crates/durability-service",
    "crates/durability-service-bin",
    "crates/lint",
    "crates/ros2-rmw",
    "crates/rs",
    "crates/rt-linux",
    "crates/rtc",
    "crates/sys",
    "crates/time-service",
    "crates/web",
    "crates/webdds-bridge",
    "crates/zenoh-bridge",
    "crates/zerodds-soap",
    "crates/zerodds-xml-wire",
    "tools/admin",
    "tools/bench",
    "tools/cargo-dag",
    "tools/chaos",
    "tools/cli-common",
    "tools/dashboard",
    "tools/interop-matrix",
    "tools/isolation-smoke",
    "tools/monitor",
    "tools/mq",
    "tools/omg-security-main",
    "tools/omg-shape-main",
    "tools/omg-xtypes-main",
    # The client for the same suite's v2 harness — the
    # feature/xml-driver-enhanced branch, which is the one
    # interoperability_report.py runs.
    "tools/omg-xtypes-test-main",
    "tools/pcap",
    "tools/perf",
    "tools/secure-permissions",
    "tools/snitch",
    "tools/traceability",
    # The three that did name `cdr`. `safe-crates-only` is a dependency
    # edge and nothing else; the two `endpoints/` binaries are the
    # generator of the endpoint SDK's golden vectors and the XRCE hub
    # the native ports are measured against, and both encode the same
    # XCDR2 body. `BufferWriter::new(..).xcdr2()` capped alignment at
    # four and `Writer::new` caps it at eight, so the bound is passed
    # now rather than assumed — the `uint64` of the SensorReading is
    # the member that tells the two apart. All twenty-five golden
    # vectors come out byte-identical to the ones the pre-demolition
    # generator wrote at `e1f3af895`, and `golden_le.bin` and
    # `golden_be.bin` match `endpoints/swift/testdata/` in the tree.
    "crates/safe-crates-only",
    "endpoints/golden-gen",
    "endpoints/xrce-agent-demo",
    # The live cross-language ping-pong harness, re-attached: it named
    # `crates/cdr` and fifteen `crates/idl-<lang>` generators, all of
    # them demolished. It names `crates/wire` and `crates/lang-rules`
    # now, for the same reason the three above do.
    "crates/endpoint-e2e",
    # The recorder bridge waited on `crates/zerodds-c-api` and on
    # nothing else, and that directory is tracked again. This line makes
    # a member of it too.
    #
    "tools/recorder-bridge",
    # The OPC-UA family: the DDS-OPCUA gateway type system, the Part-14
    # PubSub (UADP) wire stack, the UACP/SecureChannel framing and the
    # Part-4 client/server. What the four lines cost was what open62541
    # said about them — see `internal/OPEN-ITEMS.md` and
    # `crates/opcua-*/proofs/`.
    "crates/opcua-gateway",
    "crates/opcua-pubsub",
    "crates/opcua-uacp",
    "crates/opcua-server",
    # The daemon that ports the four libraries above onto `zerodds-dcps`:
    # the OMG DDS-OPCUA Gateway 1.0 as a running `opc.tcp` server/client
    # plus Part-14 PubSub, `zerodds-opcua-bridged`.
    "crates/opcua-bridge",
    # Already members through a `path =` dependency and with no row here:
    # Cargo makes a member of every path dependency that lies inside the
    # workspace root (The Cargo Book, "Workspaces"). `zerodds-dcps` reaches
    # `zerodds-iceoryx-cyclone` (optional, `cyclone-iox`), `zerodds-recorder`,
    # `zerodds-sql-filter` and the security family; `zerodds-discovery`
    # reaches the transport family and `zerodds-inspect-endpoint`. The rows
    # are added because a row is the thing that says someone looked, and
    # `cargo check -p <name> --all-targets` passes on each.
    "crates/iceoryx-cyclone",
    "crates/inspect-endpoint",
    "crates/recorder",
    "crates/sql-filter",
    "crates/transport",
    "crates/transport-shm",
    "crates/transport-tcp",
    "crates/transport-tsn",
    "crates/transport-udp",
    "crates/transport-uds",
    "crates/security",
    "crates/security-crypto",
    "crates/security-keyexchange",
    "crates/security-logging",
    "crates/security-permissions",
    "crates/security-pki",
    "crates/security-rtps",
    "crates/security-runtime",
]
# The Tauri shell is a sub-project with its own toolchain (tauri-cli +
# platform deps). It is not built via the cargo workspace.
exclude = [
    "tools/dashboard-tauri/src-tauri",
    # Fuzz crates carry their own nightly-only manifests and are driven by
    # `cargo fuzz`, not by the workspace.
    "crates/ast-core/fuzz",
    "crates/amqp-bridge/fuzz",
    "crates/ast/fuzz",
    "crates/rtps/fuzz",
    "crates/xml/fuzz",
    # Standalone nested workspaces: each carries its own `[workspace]` and is
    # built where it stands, not through this one. The demos and tutorials are
    # copied out and built on their own; the proofs, probes and reproducers
    # are driven by their own scripts on a host that has the harness. Naming
    # them keeps the regeneration command in the open item (`git ls-files
    # '*/Cargo.toml'` with neither list naming a directory) quiet.
    "crates/iceoryx-cyclone/proofs/dcps-interop",
    "examples/demos/dds-warehouse/orchestrator",
    "examples/demos/dds-warehouse/stations/01-catalog-dlrl/code",
    "examples/demos/dds-warehouse/stations/02-time-sync/code",
    "examples/demos/dds-warehouse/stations/03-robot-rtc/code",
    "examples/demos/dds-warehouse/stations/04-tsn-movement/code",
    "examples/demos/dds-warehouse/stations/05-sensor-xrce/code",
    "examples/demos/dds-warehouse/stations/06-plc-opcua/code",
    "examples/demos/dds-warehouse/stations/07-order-ami4ccm/code",
    "examples/demos/dds-warehouse/stations/08-wms-ccm/code",
    "examples/demos/dds-warehouse/stations/09-erp-corba/code",
    "examples/demos/dds-warehouse/stations/10-audit-console/code",
    "examples/tutorials/dds-chat/00-base/03-rust-tui",
    "examples/tutorials/dds-chat/apps/embedded-mcu",
    "examples/tutorials/dds-chat/code",
    "examples/tutorials/dds-chat/integrations/amqp",
    "examples/tutorials/dds-chat/integrations/coap",
    "examples/tutorials/dds-chat/integrations/corba",
    "examples/tutorials/dds-chat/integrations/grpc",
    "examples/tutorials/dds-chat/integrations/mqtt",
    "examples/tutorials/dds-chat/integrations/ros2",
    "examples/tutorials/dds-chat/integrations/websocket",
    "interop/cyclone-xtypes-27/reader",
    "interop/typelookup-probe",
    "tests/issue32",
    "tools/wireprobe/hdds-shim",
    "tools/xtypes-1.3-gap-scan/probe",
]

[workspace.package]
version = "1.0.0-rc.7"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/zero-objects/zero-dds"
homepage = "https://zerodds.org"
authors = ["ZeroDDS Contributors"]

# ---------------------------------------------------------------------------
# cargo-dist configuration (Phase-10 §6 zerodds-deployment-1.0).
# Builds platform artifacts and installers on tag-push via GitHub Actions.
# Single source of truth for targets, installer set and bin aliases. The
# concrete .deb/.rpm/Homebrew/MSI/Scoop/Choco manifests live under
# `packaging/<platform>/...` and are evaluated by the `publish-jobs`.
# Spec: docs/specs/zerodds-deployment-1.0.md §6 (cargo-dist) and §1 (bin set).
# ---------------------------------------------------------------------------
[workspace.metadata.dist]
cargo-dist-version = "0.22.1"
ci = ["github"]
# `msi` is excluded here because cargo-dist 0.22 expects a
# `[package.metadata.wix.upgrade-guid]` + `path-guid` per binary, which
# we don't want to maintain across 80+ crates. MSI is built instead in
# the `package-msi` job (release.yml) via our own WiX schema
# (`packaging/windows/msi/zerodds.wxs`).
installers = ["shell", "powershell", "homebrew"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    # aarch64-unknown-linux-musl dropped: cross-musl needs a real
    # aarch64-musl gcc; the glibc-cross-gcc hack breaks on C deps that
    # pull glibc FORTIFY headers (libsqlite3-sys: __memcpy_chk/fcntl64).
    # ARM64 Linux is shipped via aarch64-unknown-linux-gnu.
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
pr-run-mode = "plan"
# Build each shippable app with `-p` instead of `cargo build --workspace`.
# Required because `durability-svc` (dist=false) links the system libduckdb,
# which has no portable form across release targets — a --workspace build
# pulls it in and fails every target with `cannot find -lduckdb`. precise-builds
# makes cargo-dist build only the dist=true apps, skipping it.
precise-builds = true
allow-dirty = ["ci"]
github-release-body = "auto"
homebrew-tap = "zero-objects/homebrew-zerodds"
# cargo-dist 0.22 only knows 'homebrew' and 'npm' as built-in
# publish-jobs. Scoop + AUR + .deb + .rpm run as independent
# jobs in .github/workflows/release.yml and are not linked here.
publish-jobs = [
    "homebrew",
]
checksum = "sha512"
# cargo-dist 0.22 signing: 'cosign' needs OIDC + Sigstore;
# 'minisign' is done by us externally via packaging/github-actions/
# sign-artifacts.sh, so it is not configured here.
sign-artifacts = []

# Bin aliases for shorter invocation paths. Cross-ref:
# zerodds-deployment-1.0.md §1.1 (daemons) + §1.3 (CLIs).
[workspace.metadata.dist.bin-aliases]
zerodds-ws-bridged    = ["zddsws"]
zerodds-mqtt-bridged  = ["zddsmqtt"]
zerodds-coap-bridged  = ["zddscoap"]
zerodds-amqp-bridged  = ["zddsamqp"]
zerodds-grpc-bridged  = ["zddsgrpc"]
zerodds-corba-bridged = ["zddscorba"]
zerodds-ros2-shim     = ["zddsros2"]
zerodds-router        = ["zddsrouter"]
zerodds-admin         = ["zdds"]
zerodds-idlc          = ["zddsidl"]
zerodds-spy           = ["zddsspy"]
zerodds-record        = ["zddsrec"]
zerodds-replay        = ["zddsplay"]
zerodds-bench         = ["zddsbench"]
zerodds-snitch        = ["zddssnitch"]
zerodds-monitor       = ["zddsmon"]
zerodds-mq            = ["zddsmq"]
zerodds-pcap          = ["zddspcap"]
zerodds-perf          = ["zddsperf"]

# Per-target feature selection. Linux-musl builds the static
# AppImage builds (§2.2.4); Windows-MSVC includes the ETW provider.
[workspace.metadata.dist.dependencies.apt]
libssl-dev = "*"
pkg-config = "*"

[workspace.metadata.dist.dependencies.homebrew]
openssl = "*"

[workspace.metadata.dist.dependencies.chocolatey]
visualstudio2022buildtools = "*"

# Workspace-wide lints per 02_architecture.md §2 (no-panic contract)
# and 04_safety_by_architecture.md §2.1 (language restrictions).
# Comfort crates (recorder, monitor, tools/*) may relax individual rules
# via `#![allow(...)]`; safe crates may not.
[workspace.dependencies]
# SHA-256 for XTypes TypeObject hashing (§7.3.1.2). Pure-Rust,
# no_std+alloc, 0 transitive deps. Widely used (rust-crypto family).
sha2 = { version = "0.10", default-features = false }
# HMAC-SHA-256 for OSCORE HKDF key derivation (RFC 8613 §3.2.1 / RFC 5869) and
# AMQP SASL SCRAM-SHA-256 (RFC 7677). Pure-Rust no_std, RustCrypto (pairs sha2).
hmac = { version = "0.12", default-features = false }
# Base64 for the SASL SCRAM wire messages (salt/proof/signature; RFC 7677).
# no_std + alloc.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# AES-CCM AEAD for OSCORE (RFC 8613 §5; AES-CCM-16-64-128, COSE alg 10).
# RustCrypto, no_std, pairs with the `aes` block cipher already in the tree.
ccm = { version = "0.5", default-features = false, features = ["alloc"] }
aes = { version = "0.8", default-features = false }
# sqlite (WAL) cold adapter for the Durability-Service (ADR 0009). `bundled`
# compiles sqlite3 from source — no system libsqlite dependency on any target.
rusqlite = { version = "0.32", features = ["bundled"] }
# PostgreSQL cold adapter (ADR 0009, O11): the sync rust-postgres client — a
# blocking API over its own internal runtime, so it fits the synchronous
# `DurabilityStore` trait with no tokio in our code. Optional TimescaleDB
# hypertable partitioning behind the adapter's own `timescaledb` feature.
postgres = { version = "0.19" }
# DuckDB lakehouse cold adapter (ADR 0009): in-process SQL (House) + Parquet
# export (Lake). Links the *system* libduckdb (v1.5.3 — must match the duckdb
# crate's expected ABI; installed in ci/Dockerfile.rust and on dev hosts) via
# DUCKDB_LIB_DIR/DUCKDB_INCLUDE_DIR. The `bundled` feature (compiling the full
# DuckDB C++ amalgamation from source) was dropped: it OOM-killed the 16 GB CI
# runner and added ~1h to every build.
duckdb = { version = "1.1" }
# Ctrl-C/SIGTERM handler for the durability-service daemon binary (graceful
# shutdown). `termination` also catches SIGTERM/SIGHUP (systemd/docker stop).
ctrlc = { version = "3", features = ["termination"] }
# Criterion for micro-benchmarks. Dev-dependency only.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# proptest for property tests on state machines (TS-1 foundation
# hardening). Dev-dependency only. Pure-Rust + minimal deps.
proptest = { version = "1.4", default-features = false, features = ["std"] }
# insta for snapshot tests of codegen output (TS-1).
insta = { version = "1.40", default-features = false }
# flate2 for the CORBA 3.3 §18 compression codec (Zlib/Gzip/Deflate).
# Pure-Rust backend, no C build, std-only. Used in
# `crates/corba-ccm/src/orb_extensions.rs::CompressionAlgorithm` as a
# real wire codec; replaces the former stub.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# === Dep-hygiene sprint 1 (2026-05-18) ===
# Centralized common deps with an identical spec across multiple crates.
# Prevents version drift on future updates, simplifies
# security audits (one place, all users follow).
#
# rustls 0.23 — TLS stack for all bridge crates (7 users: bridge-
# security, amqp-endpoint, corba-dds-bridge, grpc-bridge, mqtt-bridge,
# websocket-bridge, amqp-dds-endpoint). default-features off + ring
# backend pinned; tls12 for legacy interop.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
# ring 0.17 — standard crypto primitives for all security crates
# (7 users: bridge-security, security-crypto, security-keyexchange,
# security-permissions, security-pki, security-runtime, tools/perf).
ring = "0.17"
# libc — POSIX API bindings. no-default-features for no_std crates
# (rt-linux, transport-shm), the caller may enable the "std" feature.
# 8 users: amqp-endpoint, corba-dds-bridge, dcps, grpc-bridge, rt-linux,
# transport-shm, transport-uds, tools/cli-common.
libc = { version = "0.2", default-features = false }
# signal-hook — graceful-shutdown handler for bridge tools (6 users:
# amqp-endpoint, coap-bridge, corba-dds-bridge, grpc-bridge, mqtt-
# bridge, websocket-bridge). default-features off + iterator API.
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
# rustls-pemfile — PEM loader for bridge cert paths (6 users, like rustls).
rustls-pemfile = "2"
# rustls-pki-types — cert/key wire types (3 users: bridge-security,
# security-permissions, security-pki).
rustls-pki-types = { version = "1.11", default-features = false, features = ["std", "alloc"] }
# rustls-webpki — X.509 chain validation (2 users: security-permissions,
# security-pki). ring backend compatible with rustls above.
# Provider (ring | aws-lc-rs) is selected by the two users' backend features
# (security-pki / security-permissions `ring-backend` vs `aws-lc`), not forced here.
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
# roxmltree — XML parser for DDS-XML config/permissions/OPC-UA NodeSet
# (5 users: amqp-endpoint, opcua-gateway, security-permissions, xml,
# transport-tsn, routing-service). Pure-Rust, no xml-rs (heavy). Without
# default features, so that zerodds-xml can take it with `alloc` alone; each
# user names `std` and `positions`.
roxmltree = { version = "0.20", default-features = false }
# socket2 — extended socket options (SO_REUSEPORT, IP_MULTICAST_*).
# 2 users: transport-udp, transport-uds.
socket2 = { version = "0.5", features = ["all"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# clippy 1.88 newly added doc_overindented_list_items to the default set;
# we use tabular-aligned doc comments for annotation mappings
# (idl-csharp/idl-java) and listener docs, where auto-reformatting
# destroys the visual readability. A local allow is cleaner than
# fragmenting it per-file.
doc_overindented_list_items = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
debug = 1          # line tables for flamegraphs

# `dist` profile for the cargo-dist release pipeline (.github/workflows/release.yml).
# Inherits from release plus `lto = "fat"` for smaller static binaries.
# Spec: zerodds-deployment-1.0.md §6.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.release-safe]
inherits = "release"
lto = "fat"
codegen-units = 1
overflow-checks = true
debug-assertions = false

[profile.bench]
inherits = "release"
debug = 2
