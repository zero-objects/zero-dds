# meta-zerodds layer config — WP 5.E.4
#
# Aktivieren in build/conf/bblayers.conf:
#   BBLAYERS += "${TOPDIR}/../meta-zerodds"

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "zerodds"
BBFILE_PATTERN_zerodds = "^${LAYERDIR}/"
BBFILE_PRIORITY_zerodds = "10"

# Layer-Kompatibilität: Yocto Scarthgap (5.0 LTS) und neuer.
LAYERSERIES_COMPAT_zerodds = "scarthgap nanbield kirkstone"
LAYERVERSION_zerodds = "1"

LAYERDEPENDS_zerodds = "core meta-rust"
